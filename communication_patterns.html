<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Паттерны коммуникации</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Nunito:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --cream: #fffaf5;
    --cream-deep: #fceee0;
    --sage: #e8793a;
    --sage-light: #f4a56c;
    --sage-muted: #f5c9a3;
    --sage-pale: #fde8d3;
    --sage-glow: rgba(232, 121, 58, 0.12);
    --earth: #c46a3c;
    --earth-light: #e8a67a;
    --sky: #f2994a;
    --sky-light: #f7be82;
    --sky-pale: #fde8cc;
    --text: #3a2518;
    --text-soft: #6b4d38;
    --text-muted: #a08060;
    --bad-bg: #fce4e0;
    --bad-text: #c06050;
    --bad-line: #e08878;
    --good-bg: #eaf5e0;
    --good-text: #4a7a30;
    --good-border: #8cbd60;
    --card-shadow: 0 2px 24px rgba(200, 120, 50, 0.08), 0 0 0 1px rgba(200, 120, 50, 0.04);
    --radius: 20px;
    --radius-sm: 12px;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--cream);
    color: var(--text);
    line-height: 1.7;
    font-weight: 400;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* === Atmospheric background === */
  body::before {
    content: '';
    position: fixed;
    top: -30%;
    right: -20%;
    width: 70vw;
    height: 70vw;
    border-radius: 50%;
    background: radial-gradient(circle, #fde0c0 0%, transparent 70%);
    opacity: 0.6;
    pointer-events: none;
    z-index: 0;
  }
  body::after {
    content: '';
    position: fixed;
    bottom: -20%;
    left: -15%;
    width: 60vw;
    height: 60vw;
    border-radius: 50%;
    background: radial-gradient(circle, #fce8c8 0%, transparent 70%);
    opacity: 0.5;
    pointer-events: none;
    z-index: 0;
  }

  .page-wrapper {
    position: relative;
    z-index: 1;
    max-width: 860px;
    margin: 0 auto;
    padding: 60px 24px 100px;
  }

  /* === Header === */
  .page-header {
    text-align: center;
    margin-bottom: 64px;
    opacity: 0;
    animation: breatheIn 1s ease-out 0.2s forwards;
  }

  .page-header__leaf {
    display: inline-block;
    width: 36px;
    height: 36px;
    margin-bottom: 16px;
    opacity: 0.5;
  }

  .page-header h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(2rem, 5vw, 3.2rem);
    font-weight: 500;
    color: var(--text);
    letter-spacing: -0.02em;
    line-height: 1.2;
    margin-bottom: 12px;
  }

  .page-header p {
    font-size: 1.05rem;
    color: var(--text-muted);
    font-weight: 300;
    max-width: 480px;
    margin: 0 auto;
  }

  .header-line {
    width: 48px;
    height: 2px;
    background: var(--sage-light);
    margin: 24px auto 0;
    border-radius: 1px;
  }

  /* === Pattern Card === */
  .pattern-card {
    background: white;
    border-radius: var(--radius);
    box-shadow: var(--card-shadow);
    padding: 44px 40px 40px;
    margin-bottom: 40px;
    position: relative;
    opacity: 0;
    transform: translateY(20px);
    transition: box-shadow 0.4s ease;
  }

  .pattern-card:hover {
    box-shadow: 0 4px 36px rgba(61, 59, 56, 0.09), 0 0 0 1px rgba(61, 59, 56, 0.04);
  }

  .pattern-card.visible {
    animation: cardEnter 0.7s ease-out forwards;
  }

  .pattern-number {
    position: absolute;
    top: -14px;
    left: 36px;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--sage);
    color: white;
    font-size: 0.8rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 8px rgba(232, 121, 58, 0.35);
  }

  /* --- Instead / Do This --- */
  .pattern-header {
    display: flex;
    align-items: stretch;
    gap: 20px;
    margin-bottom: 36px;
    flex-wrap: wrap;
  }

  .pattern-instead,
  .pattern-do {
    flex: 1;
    min-width: 240px;
    border-radius: var(--radius-sm);
    padding: 20px 24px;
  }

  .pattern-instead {
    background: var(--bad-bg);
    border-left: 3px solid var(--bad-line);
  }

  .pattern-do {
    background: var(--good-bg);
    border-left: 3px solid var(--good-border);
  }

  .pattern-label {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    font-weight: 600;
    margin-bottom: 8px;
    display: block;
  }

  .pattern-instead .pattern-label { color: var(--bad-text); }
  .pattern-do .pattern-label { color: var(--good-text); }

  .pattern-instead .pattern-text {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.35rem;
    font-weight: 500;
    color: var(--bad-text);
    text-decoration: line-through;
    text-decoration-color: var(--bad-line);
    text-decoration-thickness: 1.5px;
  }

  .pattern-do .pattern-text {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.35rem;
    font-weight: 500;
    color: var(--good-text);
  }

  /* --- Examples --- */
  .examples-section {
    margin-bottom: 32px;
  }

  .section-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.15rem;
    font-weight: 600;
    color: var(--text-soft);
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .section-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--cream-deep);
  }

  .example-item {
    margin-bottom: 24px;
    padding-left: 20px;
    border-left: 2px solid var(--sage-muted);
    position: relative;
  }

  .example-item:last-child { margin-bottom: 0; }

  .example-item::before {
    content: '';
    position: absolute;
    left: -5px;
    top: 8px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--sage-light);
  }

  .example-situation {
    font-weight: 500;
    color: var(--text);
    margin-bottom: 8px;
    font-size: 0.95rem;
  }

  .example-bad {
    color: var(--bad-text);
    text-decoration: line-through;
    text-decoration-color: rgba(176, 138, 128, 0.5);
    font-size: 0.9rem;
    margin-bottom: 6px;
    padding: 6px 12px;
    background: var(--bad-bg);
    border-radius: 8px;
    display: inline-block;
    max-width: 100%;
  }

  .example-good {
    color: var(--good-text);
    font-weight: 500;
    font-size: 0.93rem;
    padding: 8px 14px;
    background: var(--good-bg);
    border-radius: 8px;
    border-left: 3px solid var(--good-border);
    display: block;
  }

  /* --- Formula --- */
  .formula-section {
    background: var(--cream);
    border-radius: var(--radius-sm);
    padding: 20px 24px;
    display: flex;
    align-items: flex-start;
    gap: 14px;
    margin-bottom: 16px;
  }

  .formula-icon {
    flex-shrink: 0;
    width: 28px;
    height: 28px;
    color: var(--sage);
    margin-top: 1px;
  }

  .formula-label {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    font-weight: 600;
    color: var(--text-muted);
    margin-bottom: 4px;
  }

  .formula-text {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.2rem;
    font-weight: 500;
    color: var(--text);
  }

  /* --- Source --- */
  .source-section {
    text-align: right;
    font-size: 0.8rem;
    color: var(--text-muted);
    font-style: italic;
  }

  .source-section a {
    text-decoration: none;
    color: inherit;
    transition: opacity 0.2s ease;
  }
  .source-section a:hover { opacity: 0.7; }
  .source-section a span { cursor: pointer; }

  .source-section span {
    background: var(--sky-pale);
    padding: 3px 12px;
    border-radius: 20px;
    font-style: normal;
    font-size: 0.75rem;
    letter-spacing: 0.01em;
  }

  /* --- Added date --- */
  .added-date {
    text-align: right;
    font-size: 0.72rem;
    color: var(--text-muted);
    margin-top: 12px;
    opacity: 0.7;
  }

  /* === Daily Button === */
  .daily-btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-top: 28px;
    padding: 14px 32px;
    background: white;
    border: 1.5px solid var(--sage-muted);
    border-radius: 50px;
    font-family: 'Nunito', sans-serif;
    font-size: 0.95rem;
    font-weight: 500;
    color: var(--sage);
    cursor: pointer;
    transition: all 0.35s ease;
    box-shadow: 0 2px 12px rgba(138, 154, 123, 0.08);
  }

  .daily-btn:hover {
    background: var(--sage);
    color: white;
    border-color: var(--sage);
    box-shadow: 0 4px 20px rgba(232, 121, 58, 0.3);
    transform: translateY(-2px);
  }

  .daily-btn:active { transform: translateY(0); }

  .daily-btn svg {
    width: 18px;
    height: 18px;
    transition: transform 0.4s ease;
  }

  .daily-btn:hover svg { transform: rotate(20deg); }

  /* === Modal Overlay === */
  .modal-overlay {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(61, 59, 56, 0.25);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease;
  }

  .modal-overlay.open {
    opacity: 1;
    pointer-events: auto;
  }

  .modal-overlay.open .modal-card {
    transform: translateY(0) scale(1);
    opacity: 1;
  }

  .modal-card {
    background: white;
    border-radius: var(--radius);
    box-shadow: 0 8px 48px rgba(61, 59, 56, 0.15), 0 0 0 1px rgba(61, 59, 56, 0.04);
    padding: 44px 40px 36px;
    max-width: 640px;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
    position: relative;
    transform: translateY(24px) scale(0.97);
    opacity: 0;
    transition: all 0.45s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .modal-card::-webkit-scrollbar { width: 4px; }
  .modal-card::-webkit-scrollbar-track { background: transparent; }
  .modal-card::-webkit-scrollbar-thumb { background: var(--sage-muted); border-radius: 4px; }

  .modal-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--sage-pale);
    color: var(--sage);
    font-size: 0.72rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    padding: 6px 14px;
    border-radius: 20px;
    margin-bottom: 24px;
  }

  .modal-badge svg { width: 14px; height: 14px; }

  .modal-close {
    position: absolute;
    top: 18px;
    right: 18px;
    width: 36px;
    height: 36px;
    border: none;
    background: var(--cream);
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    transition: all 0.2s ease;
  }

  .modal-close:hover {
    background: var(--cream-deep);
    color: var(--text);
  }

  .modal-close svg { width: 16px; height: 16px; }

  .modal-shuffle {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 24px;
    padding: 10px 22px;
    background: var(--cream);
    border: 1.5px solid var(--cream-deep);
    border-radius: 50px;
    font-family: 'Nunito', sans-serif;
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--text-soft);
    cursor: pointer;
    transition: all 0.25s ease;
  }

  .modal-shuffle:hover {
    background: var(--sage-pale);
    border-color: var(--sage-muted);
    color: var(--sage);
  }

  .modal-shuffle svg {
    width: 15px;
    height: 15px;
    transition: transform 0.3s ease;
  }

  .modal-shuffle:hover svg { transform: rotate(180deg); }

  /* === Animations === */
  @keyframes breatheIn {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes cardEnter {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* === Responsive (mobile-first) === */
  @media (max-width: 640px) {
    .page-wrapper { padding: 32px 14px 80px; }
    .page-header { margin-bottom: 44px; }
    .page-header h1 { font-size: 1.8rem; }
    .page-header p { font-size: 0.92rem; }
    .pattern-card { padding: 28px 18px 24px; margin-bottom: 28px; }
    .pattern-number { left: 18px; top: -12px; width: 28px; height: 28px; font-size: 0.72rem; }
    .pattern-header { flex-direction: column; gap: 10px; margin-bottom: 24px; }
    .pattern-instead, .pattern-do { min-width: 0; padding: 14px 16px; }
    .pattern-instead .pattern-text,
    .pattern-do .pattern-text { font-size: 1.1rem; }
    .formula-section { flex-direction: column; gap: 8px; padding: 16px 18px; }
    .example-situation { font-size: 0.88rem; }
    .example-bad { font-size: 0.83rem; padding: 5px 10px; }
    .example-good { font-size: 0.86rem; padding: 7px 12px; }
    .section-title { font-size: 1.05rem; margin-bottom: 14px; }
    .daily-btn { padding: 12px 24px; font-size: 0.88rem; }
    .modal-overlay { padding: 0; align-items: flex-end; }
    .modal-card {
      padding: 28px 18px 24px;
      max-height: 92vh;
      border-radius: var(--radius) var(--radius) 0 0;
    }
    .modal-badge { font-size: 0.65rem; padding: 5px 12px; }
  }

  /* floating mini oranges */
  .mini-orange {
    position: fixed;
    pointer-events: none;
    z-index: 0;
    opacity: 0;
    animation: orangeFloat linear infinite;
  }

  .mini-orange svg { width: 100%; height: 100%; }

  @keyframes orangeFloat {
    0% { opacity: 0; transform: translateY(0) rotate(0deg); }
    8% { opacity: 0.35; }
    50% { transform: translateY(-50vh) rotate(180deg); }
    92% { opacity: 0.35; }
    100% { opacity: 0; transform: translateY(-105vh) rotate(360deg); }
  }
</style>
</head>
<body>

<div class="page-wrapper">
  <header class="page-header">
    <svg class="page-header__leaf" viewBox="0 0 48 48" fill="none">
      <path d="M24 4C24 4 8 16 8 28c0 8.837 7.163 16 16 16s16-7.163 16-16C40 16 24 4 24 4z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.35"/>
      <path d="M24 14v26M24 22c-4-2-8-1-10 1M24 28c4-2 8-1 10 1" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" opacity="0.3"/>
    </svg>
    <h1>Паттерны коммуникации</h1>
    <p>Мягкие замены привычных реакций, которые меняют диалог</p>
    <div class="header-line"></div>
    <button class="daily-btn" onclick="openDaily()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <path d="M12 6v6l4 2"/>
      </svg>
      Коммуникация дня
    </button>
  </header>

  <div id="patterns-container"></div>
</div>

<!-- Daily Modal -->
<div class="modal-overlay" id="dailyModal" onclick="closeDailyOutside(event)">
  <div class="modal-card">
    <button class="modal-close" onclick="closeDaily()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M18 6L6 18M6 6l12 12"/>
      </svg>
    </button>
    <div class="modal-badge">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M12 3v1m0 16v1m-8-9H3m18 0h-1m-2.636-6.364l-.707.707M6.343 17.657l-.707.707m0-12.728l.707.707m11.314 11.314l.707.707"/>
      </svg>
      Коммуникация дня
    </div>
    <div id="dailyContent"></div>
    <div style="text-align:center;">
      <button class="modal-shuffle" onclick="shuffleDaily()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/>
          <polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/>
          <line x1="4" y1="4" x2="9" y2="9"/>
        </svg>
        Другой паттерн
      </button>
    </div>
  </div>
</div>

<script>
// =====================================================
// DATA — добавляй новые паттерны сюда
// =====================================================
const patterns = [
  {
    id: 1,
    instead: '«Да, но...»',
    doThis: 'Валидация чувств / идеи + Коллаборация для решения рисков',
    examples: [
      {
        situation: 'Коллега: «Давай перепишем весь бэкенд на Go»',
        bad: '«Да, но это займёт полгода и всё сломает»',
        good: '«Интересная мысль. Как мы можем получить скорость Go, не останавливая текущую разработку?»'
      },
      {
        situation: 'Жена: «Давай поедем в отпуск в Италию»',
        bad: '«Да, но у нас сейчас нет бюджета»',
        good: '«Хочу! Как мы можем спланировать это с учётом текущего бюджета?»'
      },
      {
        situation: 'Ребёнок: «Хочу собаку!»',
        bad: '«Да, но кто за ней будет убирать?»',
        good: '«Круто что хочешь! Давай вместе подумаем — как организовать уход, чтобы всем было ок?»'
      },
      {
        situation: 'Руководитель тебе: «Нужно запустить фичу за неделю»',
        bad: '«Да, но это нереально, там работы на месяц»',
        good: '«Понял, срочно. Что мы можем урезать в скоупе, чтобы уложиться?»'
      }
    ],
    formula: 'Валидация чувств / идеи + Вопрос «Как мы можем...?»',
    source: 'Импровизация (Yes, And principle)',
    sourceUrl: 'https://youtu.be/RXqBSiCrxiY?si=hbJy2rh--lW90T0Z',
    addedAt: '2026-05-14'
  }
];

// =====================================================
// RENDERER
// =====================================================
function renderPatterns() {
  const container = document.getElementById('patterns-container');
  container.innerHTML = '';

  patterns.forEach((pattern, index) => {
    const card = document.createElement('div');
    card.className = 'pattern-card';
    card.style.animationDelay = `${index * 0.15}s`;

    const examplesHTML = pattern.examples.map(ex => `
      <div class="example-item">
        <div class="example-situation">${escapeHtml(ex.situation)}</div>
        <div class="example-bad">${escapeHtml(ex.bad)}</div>
        <div class="example-good">${escapeHtml(ex.good)}</div>
      </div>
    `).join('');

    const dateHTML = pattern.addedAt
      ? `<div class="added-date">Добавлено ${formatDate(pattern.addedAt)}</div>`
      : '';

    const sourceHTML = pattern.source
      ? `<div class="source-section">${pattern.sourceUrl
          ? `<a href="${escapeHtml(pattern.sourceUrl)}" target="_blank" rel="noopener noreferrer"><span>${escapeHtml(pattern.source)}</span></a>`
          : `<span>${escapeHtml(pattern.source)}</span>`
        }</div>`
      : '';

    card.innerHTML = `
      <div class="pattern-number">${pattern.id}</div>

      <div class="pattern-header">
        <div class="pattern-instead">
          <span class="pattern-label">Вместо</span>
          <div class="pattern-text">${escapeHtml(pattern.instead)}</div>
        </div>
        <div class="pattern-do">
          <span class="pattern-label">Делай так</span>
          <div class="pattern-text">${escapeHtml(pattern.doThis)}</div>
        </div>
      </div>

      <div class="examples-section">
        <div class="section-title">Примеры</div>
        ${examplesHTML}
      </div>

      <div class="formula-section">
        <svg class="formula-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/>
          <path d="M2 17l10 5 10-5"/>
          <path d="M2 12l10 5 10-5"/>
        </svg>
        <div>
          <div class="formula-label">Формула</div>
          <div class="formula-text">${escapeHtml(pattern.formula)}</div>
        </div>
      </div>

      ${sourceHTML}
      ${dateHTML}
    `;

    container.appendChild(card);
  });

  observeCards();
}

function formatDate(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// Intersection Observer for entrance animations
function observeCards() {
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('visible');
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.1 });

  document.querySelectorAll('.pattern-card').forEach(card => observer.observe(card));
}

// Floating mini oranges
function createOranges() {
  const orangeSVG = `<svg viewBox="0 0 40 40" fill="none">
    <circle cx="20" cy="21" r="14" fill="#f4943e" opacity="0.9"/>
    <circle cx="20" cy="21" r="14" fill="url(#og)" opacity="0.6"/>
    <ellipse cx="20" cy="21" rx="12" ry="11" fill="#f7a84e" opacity="0.4"/>
    <path d="M20 7c-1.5-3-0.5-5 1-6 0.5 1.5 0 3.5-1 6z" fill="#5a9a3a" opacity="0.7"/>
    <defs><radialGradient id="og" cx="0.35" cy="0.35"><stop offset="0%" stop-color="#fcc46a"/><stop offset="100%" stop-color="#e8762a"/></radialGradient></defs>
  </svg>`;

  for (let i = 0; i < 7; i++) {
    const el = document.createElement('div');
    el.className = 'mini-orange';
    const size = 14 + Math.random() * 14;
    el.innerHTML = orangeSVG;
    el.style.cssText = `
      width: ${size}px; height: ${size}px;
      left: ${5 + Math.random() * 88}%;
      bottom: -30px;
      animation-duration: ${22 + Math.random() * 18}s;
      animation-delay: ${Math.random() * 20}s;
    `;
    document.body.appendChild(el);
  }
}

// === Daily Modal ===
let currentDailyIndex = -1;

function openDaily() {
  shuffleDaily();
  document.getElementById('dailyModal').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeDaily() {
  document.getElementById('dailyModal').classList.remove('open');
  document.body.style.overflow = '';
}

function closeDailyOutside(e) {
  if (e.target === e.currentTarget) closeDaily();
}

function shuffleDaily() {
  let idx;
  if (patterns.length === 1) {
    idx = 0;
  } else {
    do { idx = Math.floor(Math.random() * patterns.length); } while (idx === currentDailyIndex);
  }
  currentDailyIndex = idx;
  const p = patterns[idx];

  // Pick a random example from this pattern
  const ex = p.examples[Math.floor(Math.random() * p.examples.length)];

  const container = document.getElementById('dailyContent');
  const dailyDateHTML = p.addedAt
    ? `<div class="added-date">Добавлено ${formatDate(p.addedAt)}</div>`
    : '';
  const sourceHTML = p.source
    ? `<div class="source-section" style="margin-top:16px;">${p.sourceUrl
        ? `<a href="${escapeHtml(p.sourceUrl)}" target="_blank" rel="noopener noreferrer"><span>${escapeHtml(p.source)}</span></a>`
        : `<span>${escapeHtml(p.source)}</span>`
      }</div>`
    : '';

  container.innerHTML = `
    <div class="pattern-header">
      <div class="pattern-instead">
        <span class="pattern-label">Вместо</span>
        <div class="pattern-text">${escapeHtml(p.instead)}</div>
      </div>
      <div class="pattern-do">
        <span class="pattern-label">Делай так</span>
        <div class="pattern-text">${escapeHtml(p.doThis)}</div>
      </div>
    </div>

    <div class="examples-section">
      <div class="section-title">Пример</div>
      <div class="example-item">
        <div class="example-situation">${escapeHtml(ex.situation)}</div>
        <div class="example-bad">${escapeHtml(ex.bad)}</div>
        <div class="example-good">${escapeHtml(ex.good)}</div>
      </div>
    </div>

    <div class="formula-section">
      <svg class="formula-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
        <path d="M12 2L2 7l10 5 10-5-10-5z"/>
        <path d="M2 17l10 5 10-5"/>
        <path d="M2 12l10 5 10-5"/>
      </svg>
      <div>
        <div class="formula-label">Формула</div>
        <div class="formula-text">${escapeHtml(p.formula)}</div>
      </div>
    </div>

    ${sourceHTML}
    ${dailyDateHTML}
  `;
}

// Close on Escape
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDaily(); });

// Init
renderPatterns();
createOranges();
</script>
</body>
</html>
