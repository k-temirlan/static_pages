,"category":"Последовательности","text":"Последний раз в двадцатом веке это было в 1987 году. В начале 2013-го это повторилось и будет продолжаться несколько лет. О чем идет речь?","faq":null,"likes":115,"dislikes":34,"solve_percent":2,"solve_total":33554,"date":"22.03.2013","comments":21},{"id":303,"title":"Ряд букв","category":"Последовательности","text":"Продолжите ряд букв: О Д Т ...","faq":null,"likes":234,"dislikes":101,"solve_percent":3,"solve_total":67210,"date":"10.04.2008","comments":11}],"algorithm":[{"id":359,"title":"Зажигалка и два шнура","category":"Алгоритмы","text":"Есть два шнура, горящих неравномерно. Каждый сгорает за час. Как при помощи этих шнуров и зажигалки отмерить 45 минут?","faq":null,"likes":1492,"dislikes":56,"solve_percent":13,"solve_total":63922,"date":"14.01.2009","comments":114},{"id":749,"title":"7 таблеток","category":"Алгоритмы","text":"Оккупанты поймали четырех мегамозгов и предложили им испытание чтобы спастись. По кругу, как патроны в нагане, разложены 7 таблеток: 5 — нейтральны, 2 — отравлены. Первому ММ сообщают где отрава, но после этого мегамозгам общаться запрещено. Каждый мегамозг съедает по одной таблетке, затем их отпускают, живыми или мертвыми. У мегамозгов есть возможность заранее договориться о стратегии. Как им всем гарантированно выжить?","faq":null,"likes":183,"dislikes":7,"solve_percent":10,"solve_total":8975,"date":"09.06.2020","comments":51},{"id":129,"title":"Песочные часы","category":"Алгоритмы","text":"Все решает время. Вы потерпели кораблекрушение и попали в плен к племени каннибалов. Вам в руки дают пару песочных часов: одни отсчитывают ровно 4 минуты, другие — ровно 7. Вождь требует, чтобы вы сказали, когда пройдет точно 9 минут. Если вы это сделаете, вас освободят. Если вы не сделаете этого, вас съедят. Вождь орет: «Начинай отсчитывать немедленно, никакой подготовки!» Что делать?","faq":null,"likes":1707,"dislikes":89,"solve_percent":16,"solve_total":74059,"date":"18.12.2006","comments":148},{"id":766,"title":"Красные и черные","category":"Алгоритмы","text":"Двум мегамозгам завязывают глаза и по краю круглого стола расставляют пять шашек. Шашки могут быть только красного и черного цвета и размещаются на одинаковом расстоянии от своих соседей.Развязывают глаза первому мегамозгу - и он должен убрать 3 шашки. Затем стол раскручивают и развязывают глаза второму мегамозгу - он должен называть цвет и положение каждой убранной шашки. О чем заранее должны были договориться мегамозги чтобы гарантировать, что второй не ошибется?","faq":null,"likes":37,"dislikes":5,"solve_percent":25,"solve_total":95,"date":"15.06.2025","comments":49},{"id":192,"title":"Отбивные","category":"Алгоритмы","text":"Мегамозгу нужно приготовить 12 отбивных.На сковороду помещаются только 8 отбивных.Отбивные готовятся обжариванием с двух сторон,каждая сторона прожаривается за 4 минуты. Нужно успеть приготовить отбивные за 12 минут.Как это сделать?","faq":null,"likes":637,"dislikes":175,"solve_percent":14,"solve_total":72190,"date":"24.04.2007","comments":49},{"id":103,"title":"Посчитать вагоны","category":"Алгоритмы","text":"Есть несколько вагонов, сцепленных между собой по кругу. Внутри ходит Мегамозг, он должен посчитать количество вагонов. Мегамозг может только включать или выключать свет в вагонах. Как ему это сделать? Вначале свет горит случайным образом. (Количество вагонов может быть ну очень большим).","faq":null,"likes":619,"dislikes":21,"solve_percent":4,"solve_total":74242,"date":"05.12.2006","comments":170},{"id":65,"title":"Переправа через мост","category":"Алгоритмы","text":"Четырем мегамозгам надо ночью перебраться через мост. У них есть только один фонарь, без которого по мосту в темноте не пройти. К несчастью, мост настолько ветхий, что выдерживает максимум двух мегамозгов. Еще одна проблема в том, что мегамозги могут двигаться с разной скоростью: первый проходит весь мост за 1 минуту, второй — за 2 минуты, третий — за 5 минут, а четвертый — аж за 10 минут (если идут двое, то движутся со скоростью более медленного). Вот-вот в мост ударит молния и он рухнет, так что надо спешить. За какое минимальное время все четверо могут успеть переправиться? Доказательство минимальности не требуется.","faq":null,"likes":840,"dislikes":49,"solve_percent":8,"solve_total":74381,"date":"24.11.2006","comments":110},{"id":811,"title":"И снова Мориарти","category":"Алгоритмы","text":"Мориарти снова подловил Холмса с Ватсоном. Он разложил в ряд 99 монет орлом или решкой вверх так, как ему заблагорассудилось. Затем позвал Ватсона и попросил его накрыть колпачками все монеты, кроме 17, расположенных одинаковой стороной вверх. Задача Холмса — снять колпачки с 17 монет, которые расположены той же стороной вверх. О чем должны договориться Ватсон и Холмс, чтобы гарантированно справиться с задачей?","faq":"1. Стратегию Ватсон с Холмсом должны обговорить заранее. Они не смогут общаться друг с другом после того, как Мориарти позовет Ватсона.2. Как именно разложены монеты - заранее неизвестно.3. Ватсон не имеет права трогать монеты. Он может только закрывать их колпачками.4. Все колпачки внешне одинаковые.5. Не разрешается накрывать монету двумя (и более) колпачками. Можно считать, что колпачков ровно 82.","likes":35,"dislikes":0,"solve_percent":2,"solve_total":3591,"date":"16.05.2022","comments":22},{"id":672,"title":"Отравленное вино","category":"Алгоритмы","text":"Находчивому трактирщику стало известно, что поборники нравственности тайком пробрались в его погреб и отравили одну из 64 бочек вина. Тот, кто попробует отравленное вино, в ближайшую полночь провозгласит себя трезвенником и отныне не сможет выпить ни капли спиртного. У трактирщика четверо пьющих слуг. Какое минимальное число дней ему понадобится, чтобы гарантированно найти отравленную бочку, наливая вино своим слугам? Определите максимальное число бочек, при котором можно справиться с задачей за тот же срок.","faq":"Трактирщик не может участвовать в дегустации вина.1) Вам нужно найти такое число D, что за D дней можно проверить 64 бочки (и доказать это), но ни для какого d < D за d дней проверить 64 бочки нельзя (и доказать это).2) Вам нужно найти такое N, что за D дней можно проверить N бочек (и доказать это), но ни для какого n > N за D дней проверить n бочек нельзя (и доказать это).","likes":182,"dislikes":1,"solve_percent":2,"solve_total":16646,"date":"27.05.2017","comments":47},{"id":210,"title":"Заключенные и переключатель","category":"Алгоритмы","text":"В тюрьме сидят 10 заключенных, каждый — в одиночной камере. Общаться между собой они не могут. В один прекрасный день начальник тюрьмы объявил им, что предоставляет всем шанс выйти на свободу, и предложил следующие условия: «В подвале тюрьмы есть комната с переключателем, имеющим два состояния: ON/OFF (верх/низ). Вас будут в произвольном порядке по одному приводить в эту комнату и через несколько минут уводить. Находясь в комнате, каждый из вас может либо изменить положение переключателя, либо ничего с ним не делать. Персонал тюрьмы трогать этот переключатель не будет. В какой-то момент один из вас (любой) должен сказать, что в комнате побывали все заключенные. Если он окажется прав — всех отпустят, если ошибется — вы навсегда останетесь в тюрьме. Я обещаю, что в комнате побывают все заключенные и что каждого из вас будут приводить туда снова и снова неограниченное число раз». После этого заключенным разрешили собраться и обсудить стратегию, потом развели по камерам. Что им нужно делать, чтобы гарантированно выйти на свободу?","faq":"Начальное положение переключателя не известно.","likes":394,"dislikes":8,"solve_percent":2,"solve_total":71704,"date":"04.06.2007","comments":188},{"id":11,"title":"Стеклянные шарики","category":"Алгоритмы","text":"У Мегамозга есть два одинаковых стеклянных шарика. За какое минимальное число бросков можно гарантированно определить, начиная с какого этажа 100-этажного здания шарики разбиваются?","faq":null,"likes":625,"dislikes":19,"solve_percent":4,"solve_total":75611,"date":"18.09.2006","comments":156},{"id":24,"title":"Колонна мегамозгов","category":"Алгоритмы","text":"Подлые оккупанты захватили деревню мегамозгов, выстроили их друг за другом в колонну так, что каждый последующий видит всех предыдущих. На каждого мегамозга надели колпак черного или белого цвета так, что ни один мегамозг не видит свой колпак. Начиная с самого последнего (того, который видит всех, кроме себя), у каждого мегамозга по очереди спрашивают цвет его колпака. Если он ошибается, его убивают. Неизвестно, чем бы всё это закончилось, если бы мегамозги заранее не договорились, как минимизировать число убитых. Сколько мегамозгов гарантированно выживет?","faq":"1. Мегамозги могут жертвовать собой ради общего блага.2. Распределение шляп неизвестно ни нам, ни мегамозгам. Могли надеть все черные, или 0, или любое промежуточное число.3. Мегамозги слышат ответы друг друга.4. Всё, что может сделать каждый мегамозг, это однократно назвать цвет своего колпака. Паузы, интонации, прикосновения и другие сигналы нельзя использовать для передачи информации.5. Ответ должен быть справедлив для любого числа жителей.","likes":475,"dislikes":18,"solve_percent":4,"solve_total":75611,"date":"22.09.2006","comments":145},{"id":671,"title":"Свечи и пять минут","category":"Алгоритмы","text":"В магазине поштучно продаются свечи стоимостью 50 рублей, которые полностью сгорают за 30 минут, и свечи по 20 рублей, сгорающие за 13 минут. Те и другие горят неравномерно и поджигаются только с одной стороны. Определите минимальную стоимость набора свечей, с помощью которого можно отмерить 5 минут. Доказательство минимальности не требуется.","faq":null,"likes":213,"dislikes":9,"solve_percent":3,"solve_total":17231,"date":"05.03.2017","comments":44},{"id":25,"title":"Средняя зарплата","category":"Алгоритмы","text":"Три мегамозга хотят узнать свою среднюю заработную плату, но при этом не хотят называть каждый свою. Как это сделать только на словах?","faq":"1. От сговора двоих против одного защищаться не нужно, да и это невозможно: любой, кто знает з/п одного коллеги, свою з/п и среднюю з/п без труда вычислит и з/п другого коллеги.2. Общение не обязательно должно быть открытым: двое могут общаться \"на ушко\" в тайне от третьего.","likes":422,"dislikes":25,"solve_percent":3,"solve_total":75611,"date":"22.09.2006","comments":93},{"id":360,"title":"Переправа шести человек","category":"Алгоритмы","text":"К берегу реки подошли три мегамозга, каждый — со своей девушкой. У них есть одна надувная лодка, которая может выдержать только двух человек. Каждый мегамозг страшно ревнив и не может допустить, чтобы его девушка без него находилась в компании другого мегамозга. Считается, что два человека находятся в одной компании, если они имеют возможность пообщаться, даже если один из них при этом находится в лодке, а другой — на берегу. Как им переправиться на другой берег?","faq":null,"likes":360,"dislikes":39,"solve_percent":3,"solve_total":63877,"date":"19.01.2009","comments":74},{"id":148,"title":"Одномерные парашютисты","category":"Алгоритмы","text":"Двух одномерных парашютистов сбросили на прямую. После приземления они должны встретиться, чтобы выполнить секретное задание. Они сбросили свои парашюты, но возникла загвоздка: на прямой выпал туман и они не видят друг друга. Они не договорились заранее, как действовать в такой ситуации, но они очень и очень логичны и поэтому смогли встретиться друг с другом. Как они действовали? Средств связи у них нет. Кричать нельзя — враг может услышать.","faq":null,"likes":249,"dislikes":62,"solve_percent":3,"solve_total":73791,"date":"11.01.2007","comments":120},{"id":122,"title":"Мегамозги и пять шляп","category":"Алгоритмы","text":"Подлые оккупанты выбрали трех мегамозгов, привязали их к столбам так, что каждый видит двух других, повязали на глаза повязки и надели на каждого одну из пяти шляп (2 красных, 3 синих), оставшиеся 2 шляпы сожгли.С мегамозгов сняли повязки, и через некоторое время они сообщили оккупантам цвета своих шляп. Как они узнали цвета собственных шляп?","faq":null,"likes":304,"dislikes":92,"solve_percent":3,"solve_total":74094,"date":"15.12.2006","comments":111},{"id":755,"title":"Психбольница","category":"Алгоритмы","text":"Оккупанты используют вместо тюрьмы подвал психбольницы, состоящий из 36 одноместных камер (6 рядов по 6 камер). Единственный вход в подвал в одной из угловых камер. В стенах между соседними камерами есть запертые двери. Мегамозга посадили в камеру, расположенную в противоположном от входа углу подвала. В остальных 35 камерах могут находиться как сумасшедшие, так и другие заключенные мегамозги.Мегамозг смог ночью связать охранника, отобрать у него универсальный  ключ от дверей и собрался бежать. При этом он хочет проверить, нет ли мегамозгов в остальных камерах. Сумасшедшие спят чутко и звереют, если их разбудить. Потому нельзя оставлять открытых дверей, а также заходить в камеру с сумасшедшим больше одного раза. Сможет ли Мегамозг добраться до выхода, побывав по пути во всех камерах?","faq":null,"likes":46,"dislikes":16,"solve_percent":2,"solve_total":7925,"date":"18.11.2020","comments":31},{"id":719,"title":"Алхимик и свечи","category":"Алгоритмы","text":"Средневековый алхимик для своих опытов купил большой запас свечей с точным временем горения 3, 7 и 16 минут. Но приступив к делу, он вдруг обнаружил, что вместо точных 3-минутных свечей ему дали обычные — с погрешностью до 30%. Алхимик решил не прерывать уже начатый опыт. За какое наименьшее время он может приготовить замену хотя бы для одной точной 3-минутной свечи? Доказательство минимальности не требуется. Свечи горят неравномерно и поджигаются только с одной стороны.","faq":"1) «Замена» должна обладать теми же свойствами, что и точная трехминутная свеча:- позволять начать отсчет в любое время;- позволять отсчитать суммарное время ровно три минуты с момента начала отсчета.2) Любую свечу можно:- поджигать с одной стороны;- гасить, не дожидаясь полного сгорания;- поджигать ранее погашенную.Только при этих действиях сумм егда, мегамозги заранее договорились, как минимизировать число убитых. О чем договорились мегамозги?","faq":null,"likes":233,"dislikes":6,"solve_percent":1,"solve_total":73099,"date":"20.02.2007","comments":62},{"id":19,"title":"Деление пирога","category":"Алгоритмы","text":"Стандартный способ «честного» деления пирога на двоих: первый участник делит, второй выбирает себе один из кусков, оставшийся кусок достается первому. А что делать, если участников трое?Примечания:1. Участники доверяют только своему глазомеру.2. Каждый хочет получить не меньше трети пирога.3. Пирог круглый.","faq":null,"likes":238,"dislikes":9,"solve_percent":1,"solve_total":75611,"date":"22.09.2006","comments":88},{"id":206,"title":"Побег Мегамозга","category":"Алгоритмы","text":"Мегамозга посадили в тюрьму и сказали, что он выйдет отсюда, только если сможет открыть двери. Двери открываются с помощью следующего устройства: перед входом стоит куб, в котором по бокам с четырех сторон сделаны дырки. В каждой дырке — по рычагу. Рычаги не торчат из дырок, а скрываются в углублениях, т.е. положение рычагов не видно. Рычаги могут подниматься вверх и опускаться вниз. Двери открываются, когда все четыре рычага либо подняты вверх, либо опущены вниз. Мегамозг может засунуть одну или обе руки в углубления и затем совершить манипуляции с рычагами (поднять, опустить, не менять положение). После чего он должен вынуть руки из углублений. Как только руки вынуты, куб автоматически раскручивается, и после его остановки невозможно определить, куда были засунуты руки. В тюрьму льется вода, она затопит камеру через 10 минут, куб крутится ровно минуту. Как Мегамозгу спастись?","faq":null,"likes":257,"dislikes":10,"solve_percent":1,"solve_total":71776,"date":"28.05.2007","comments":122},{"id":596,"title":"64 монеты","category":"Алгоритмы","text":"На каждую клетку доски 8х8 положили монету номиналом 1 или 2 мозгобакса. Монеты одинаковые по размеру, лежат гербом вверх, так что без переворачивания определить номинал невозможно. Известно, что для одной из монет на главной диагонали (в клетке [N, N]) все другие монеты на одной с ней горизонтали имеют номинал 1, а на одной с ней вертикали — 2. Как определить значение N, перевернув не более 7 монет?","faq":null,"likes":183,"dislikes":9,"solve_percent":2,"solve_total":28810,"date":"04.03.2014","comments":23},{"id":307,"title":"Кругосветное путешествие","category":"Алгоритмы","text":"Мегамозг путешествовал в космосе и попал на новую планету, на которой был всего лишь один обитаемый остров — как раз на северном полюсе. Жители планеты хотели совершить кругосветное плаванье (доплыть до южного полюса и вернуться обратно). Но к сожалению, у них было всего 3 корабля, работающих на хитром топливе под названием несимметричный диметилгидразин, зато сколько угодно этого самого несимметричного диметилгидразина. Но баков каждого корабля хватало лишь для того, чтобы проплыть расстояние от острова до южного полюса. Течения на планете были такие, что если выключить двигатели, то корабль сразу могло унести в неизвестном направлении и он терялся, а глубина моря не позволяла пользоваться якорями. Мегамозг предложил им решение, и они совершили кругосветное путешествие, при этом потратив минимальное количество топлива и сохранив все корабли. Что им предложил Мегамозг? Доказательство оптимальности решения не требуется.","faq":null,"likes":188,"dislikes":14,"solve_percent":1,"solve_total":67202,"date":"11.04.2008","comments":71},{"id":175,"title":"Садовник","category":"Алгоритмы","text":"Мегамозг купил 53 упаковки средства, отпугивающего яблочную плодожорку. Средство начинает работать через три дня после нанесения на дерево. Однако он узнал, что одна из упаковок бракованная и отпугивает еще и фруктовую опылялку, без которой яблок не будет. Мегамозг не может рисковать своим садом, но у него есть шесть диких яблонь, на которых он может проверить репелленты. Но через шесть дней у яблочной плодожорки начинается жор, и мало что останется от его сада, если он его не обработает. Как Мегамозгу найти бракованное средство и спасти свой урожай?","faq":"1) Найти бракованное средство нужно до начала обработки сада.2) Эффект отпугивания опылялки проявляется при обработке яблонь бракованным средством даже в очень малой концентрации. (Иначе достаточно было бы все пачки смешать, разбавив этим в 52 раза концентрацию бракованного средства и смесью обработать сад.) Потому расход средства при пробах может быть минималным.","likes":271,"dislikes":22,"solve_percent":2,"solve_total":72660,"date":"22.03.2007","comments":88},{"id":650,"title":"Скачки","category":"Алгоритмы","text":"В скачках участвуют 25 лошадей, в одном заезде могут участвовать любые пять из них. За какое минимальное количество заездов можно определить трех самых быстрых? Доказательство минимальности не требуется.","faq":"0. Время, за которое лошадь завершит заезд, не меняется от заезда к заезду.1. Трех самых быстрых нужно ранжировать по скорости.2. Определить нужно гарантированно, для всевозможных распределений лошадей между забегами должно хватать предложенного числа забегов.","likes":108,"dislikes":17,"solve_percent":1,"solve_total":23235,"date":"29.03.2015","comments":18},{"id":204,"title":"Колпаки с числами","category":"Алгоритмы","text":"Ста мегамозгам на головы надели колпаки с числами из диапазона 1..100, причем не обязательно, что на всех разные. К примеру, всем могли надеть колпак с числом 7 или половине — колпак с числом 20, а второй половине — с числом 10. Главное, что не меньше 1 и не больше 100. После этого всех их поставили по кругу. Каждый мегамозг видит 99 чисел на головах других, но не свое. После этого каждый пишет на листке бумаги число от 1 до 100 — предполагаемое число на своём колпаке. Общаться и подглядывать нельзя ;) Их всех отпустят, если хотя бы один угадает свое число. Какой стратегии они должны придерживаться, если хотят, чтобы их гарантированно отпустили? (Мегамозги могли заранее договориться о стратегии).","faq":null,"likes":188,"dislikes":3,"solve_percent":null,"solve_total":null,"date":"21.05.2007","comments":179},{"id":346,"title":"Фокус с пятью картами","category":"Алгоритмы","text":"Фокусник берет колоду из 52 карт, как в блэкджеке, и отдает ее зрителям. Зрители выбирают (каким угодно способом) любые 5 карт и отдают их помощнику фокусника. Тот смотрит на карты и называет фокуснику 4 из них. В ответ фокусник называет пятую. Кроме мастей и значений карт, фокусник не получает никакой дополнительной информации (помощник говорит ровным голосом, без пауз и т.д.). Каким образом фокуснику удается «угадать» пятую карту?","faq":null,"likes":203,"dislikes":5,"solve_percent":null,"solve_total":null,"date":"18.11.2008","comments":108},{"id":693,"title":"Зашифруй монету","category":"Алгоритмы","text":"Мориарти устанавливает на каждую клетку шахматной доски монету. Все монеты одинаковы, но одни монеты установлены вверх решкой, другие — орлом в произвольном порядке. После этого он показывает Холмсу на одну из монет. Холмс, увидев монету, на которую показал Мориарти, может перевернуть одну любую монету на доске (а может и не переворачивать ни одной), после чего они зовут Ватсона. Ватсон, посмотрев на доску, должен определить, на какую монету указал Мориарти. Какой стратегии должны придерживаться Холмс и Ватсон, чтобы выиграть (предполагается, что они её могут обговорить заранее)?","faq":"1. Информацию о положении искомой монеты Ватсон может получать только из того, какой стороной повёрнуты монеты на доске.2. Положение доски фиксировано.3. Общаться и передавать какие-то знаки друг другу после того, как Мориарти указал на монету, Холмс с Ватсоном не могут.4. Выигрыш должен быть гарантирован, независимо от изначального положения монет на доске и выбора Мориарти.","likes":53,"dislikes":1,"solve_percent":null,"solve_total":null,"date":"07.05.2020","comments":37},{"id":477,"title":"Погоня","category":"Алгоритмы","text":"Мегамозг преследует подлого Оккупанта-преступника, который пытается скрыться в подвале своего дома. Подвал представляет собой 3 узких прямых коридора одинаковой длины, расходящихся в виде пропеллера из маленькой комнаты и заканчивающихся тупиком. В подвале темно, и Мегамозг может разглядеть преступника только с расстояния, не превышающего 10 м. Скорость Мегамозга в два раза больше скорости Оккупанта. При какой максимальной длине коридоров Мегамозг может гарантированно поймать преступника? Доказательство максимальности не требуется.","faq":"Когда ММ находится в одном из коридоров он видит только этот коридор? Т.е. если он на расстоянии в 1 метр от комнаты, то он видит только область длиною 11 метров?Верно.А когда мегамозг зашел в туннель, он видит, что в комнате делается? Т.е. находясь в туннеле он сможет увидеть, что оккупант перебежал из одного туннеля в другой?Он увидит, что оккупант был в туннеле, но направление движения определить не сможет.","likes":83,"dislikes":3,"solve_percent":null,"solve_total":null,"date":"13.02.2011","comments":63},{"id":470,"title":"Сортировка мегамозгов","category":"Алгоритмы","text":"Деревня мегамозгов в очередной раз была захвачена оккупантами. В этот раз оккупанты придумали следующее: на лбу каждого мегамозга пишут произвольное натуральное число (все числа разные) и дают каждому по красному и синему колпаку. После чего по сигналу все мегамозги должны одновременно выбрать один из колпаков и надеть его себе на голову. Затем мегамозгов строят в шеренгу в порядке возрастания чисел, написанных на их лбах. Если при этом цвета колпаков в шеренге чередуются — всех отпускают, иначе — всех убивают. Мегамозгам сообщили правила и дали возможность заранее договориться. Смогут ли они гарантированно выжить?","faq":"Мегамозгов можно отличить друг от друга по внешнему виду?Да.Могут ли они использовать какие-либо сигналы?Нет. После написания чисел они не могут обмениваться никакой информацией.Числа совершенно произвольные могут быть, или всё-таки ... ?Произвольные и различные между собой натуральные числа. К примеру, /3 12 345 1000/ или /1 2 3 4 89/","likes":85,"dislikes":4,"solve_percent":null,"solve_total":null,"date":"19.12.2010","comments":61},{"id":522,"title":"Расскажи другу","category":"Алгоритмы","text":"Семь разных костей домино показали двум мегамозгам и оккупанту, перемешали и раздали мегамозгам по три. Возможности заранее договориться у мегамозгов не было. Получится ли у них, открыто общаясь, сообщить друг другу свои кости так, чтобы оккупант не смог вычислить местонахождение ни одной из костей, которых он не видит, если оставшуюся кость:а) спрятали;б) отдали оккупанту?","faq":"В случае а) оккупант не должен узнать, какая кость спрятана.","likes":49,"dislikes":2,"solve_percent":null,"solve_total":null,"date":"11.07.2012","comments":55},{"id":475,"title":"Обмен шифрами","category":"Алгоритмы","text":"Каждому из двух мегамозгов необходимо передать другому шифр незаметно для оккупантов. Они подходят к речке, на берегу которой лежит кучка из 26 одинаковых камней, и строго по очереди начинают кидать камни в воду. За раз бросают как минимум один, расходятся, когда камней больше не осталось. Смогут ли мегамозги обменяться информацией, если шифр - любое число от 1 до 1700?","faq":null,"likes":79,"dislikes":4,"solve_percent":null,"solve_total":null,"date":"01.02.2011","comments":66},{"id":679,"title":"Экстрасенс и казино","category":"Алгоритмы","text":"Казино проводит игру из 9 раундов, в которой участвуют два посетителя и крупье. В начале каждому участнику выдают два именных шара: белый и черный. В каждом раунде игроки выбирают один из шаров и незаметно друг для друга бросают его в общий мешок. Затем у всех на глазах мешок раскрывают и определяют победителя. Посетители выигрывают, если все три шара оказались одного цвета, в противном случае побеждает казино. Игроки забирают свои шары, и начинается следующий раунд.В игре решили поучаствовать два друга, один из которых — экстрасенс, который за секунду до начала игры сможет узнать, какие шары во всех раундах будет выбирать крупье. К сожалению, секунды не хватит, чтобы поделиться полученной информацией с партнером. Какое максимальное число выигрышей могут гарантировать себе друзья, заранее договорившись о стратегии? Доказательство максимальности не требуется.","faq":"1. Экстрасенс получает информацию обо всех раундах за секунду до первого раунда. Этой секунды не хватит, чтобы передать другу любое количество информации.2. Второй друг не видит, какой именно шар бросает экстрасенс в текущем раунде, но знает, какие шары бросали и экстрасенс, и казино во всех предыдущих раундах.3. Экстрасенс не может предсказать, какой шар бросит второй друг, если они не договаривались об этом и цвет шара не следует из их стратегии.4. Обмен дополнительной информацией во время игры с помощью тайных знаков невозможен. Забирать шар левой или правой рукой - это тоже тайный знак.","likes":20,"dislikes":1,"solve_percent":null,"solve_total":null,"date":"27.12.2017","comments":58},{"id":597,"title":"Книги на полке","category":"Алгоритмы","text":"Во время уборки Мегамозг заметил, что в собрании сочинений его любимого писателя все тома стоят в обратном порядке — с 15-го по 1-й. Мегамозг решил расставить их по возрастанию. Он может взять любое количество соседних книг и переставить на другое место. Сколько таких действий ему понадобится, чтобы упорядочить 15-томник? Доказательство минимальности не требуется.","faq":"1. Действие \"переставить на другое место\" подразумевает место на той же полке. Т.е. разрешается взять одну или несколько соседних книг, при необходимости передвинуть одну или несколько книг на полке, а затем поставить взятые на освободившееся место.2. Книги должны сохранять ориентацию (переворачивать нельзя).","likes":74,"dislikes":5,"solve_percent":null,"solve_total":null,"date":"17.02.2014","comments":29},{"id":638,"title":"Жуки на доске","category":"Алгоритмы","text":"На доске размером 9х9 в каждой клетке сидит жук. По сигналу каждый жук переползает в одну из соседних по диагонали клеточек. При этом может оказаться, что в некоторых клетках будет по нескольку жуков, а некоторые клетки будут свободными. Найти наименьшее возможное число свободных клеток.","faq":null,"likes":95,"dislikes":6,"solve_percent":null,"solve_total":null,"date":"13.04.2015","comments":16},{"id":820,"title":"Предохранители","category":"Алгоритмы","text":"Чтобы электричество в доме заработало, Мегамозгу нужно вставить два новых предохранителя. Всего у него 20 предохранителей. Он знает, что исправны только 10 из них, но не знает, какие именно. Приведите алгоритм, который позволяет гарантированно включить в доме свет за наименьшее возможное количество попыток.Одна попытка - это вставить два предохранителя. Если Мегамозг вставит два рабочих предохранителя - в доме появится свет, иначе - ничего не произойдет.","faq":"1. Если вставить только один предохранитель - ничего не произойдет, даже если он рабочий.2. Нужно именно включить свет, а не просто найти пару исправных предохранителей.3. Как и во всех задачах, где не сказано обратное, в этой задаче Требуется обосновать минимальность ответа.","likes":15,"dislikes":1,"solve_percent":null,"solve_total":null,"date":"01.12.2021","comments":7},{"id":637,"title":"Стихи и утренники","category":"Алгоритмы","text":"На детсадовских утренниках читают стихи с табуреточки Глаша, Даша, Маша, Паша, Саша и Георгий Константинович. Каждый из них за один утренник может либо рассказать стишок сам (при этом от волнения он никого не слышит), либо послушать стихи остальных. Какое минимальное число утренников потребуется провести, чтобы каждый услышал стишок каждого?","faq":"1. Участник никого не слышит в течение всего утренника, если ему в этот день выпало рассказывать.2. За каждый утренник может читать стихи сколько угодно человек (от 0 до 6).","likes":102,"dislikes":8,"solve_percent":null,"solve_total":null,"date":"27.01.2015","comments":23},{"id":151,"title":"Автомобиль","category":"Алгоритмы","text":"У Мегамозга есть автомобиль с пустым баком вместительностью 20 л и есть три бочонка с топливом, каждый — по 100 л. В автомобиле можно увезти не больше одного бочонка. Мегамозг хочет уехать от места, где он находится с автомобилем и тремя бочонками, как можно дальше. Как далеко он может уехать, если на 1 км расходуется 1 л топлива? Необходимо найти расстояние до наиболее удаленного положения, до которого можно доехать в данных обстоятельствах. (Доказательство максимальности пути не требуется).","faq":null,"likes":146,"dislikes":17,"solve_percent":null,"solve_total":null,"date":"16.01.2007","comments":51},{"id":430,"title":"Лабиринт","category":"Алгоритмы","text":"Любимую собаку-киборга мегамозга злобные оккупанты посадили в клетчатый лабиринт 6х6 клеток, в левую нижнюю его клетку. В правой верхней клетке находится лестница - выход из лабиринта. Стороны квадрата: северная, восточная, южная и западная – непроходимы, также между некоторыми клетками стоят непроходимые перегородки, однако путь от собаки к выходу существует. Но Мегамозг все это предусмотрел и заранее снабдил собаку бесконечным источником энергии и конечной последовательностью команд, которую она начинает выполнять, попав в лабиринт. Собака понимает команды вида: «север», «юг», «запад», «восток». При выполнении команды она перемещается в соседнюю клетку в соответствующем направлении. Наткнувшись на перегородку, собака останавливается и переходит к выполнению следующей команды.Как мегамозгу задать такую последовательность команд, выполняя которую, собака гарантировано когда-нибудь наткнется на выход?","faq":null,"likes":66,"dislikes":9,"solve_percent":null,"solve_total":null,"date":"26.12.2009","comments":100},{"id":298,"title":"Оккупанты и два мегамозга","category":"Алгоритмы","text":"Подлые оккупанты опять совершенно неожиданно захватили двух мегамозгов. Они приготовили 2 колпака, написали на одном из них число от 1 до 99, а на другом число на 1 большее (мегамозги об этом знали). Потом надели эти колпаки на захваченных и посадили их друг перед другом. Оккупанты по очереди спрашивают, знают ли мегамозги, какое число написано на их колпаке, пока кто-нибудь из них не ответит, но спрашивать будут не больше 231 раза. Их пустят на колбасу, если либо ответ окажется неверным, либо за 231 раз никто не ответит. Смогут ли мегамозги выжить?","faq":null,"likes":97,"dislikes":24,"solve_percent":null,"solve_total":null,"date":"14.03.2008","comments":118},{"id":546,"title":"Вопросы россыпью","category":"Алгоритмы","text":"Есть 100 коробок, пронумерованных числами от 1 до 100. В одной коробке лежит приз, и ведущий знает, в какой. Зритель может послать ведущему пачку записок с вопросами, требующими ответа «да» или «нет». Ведущий перемешивает записки в пачке и, не оглашая вслух вопросов, честно отвечает на все. Какое наименьшее число записок нужно послать, чтобы наверняка узнать, где находится приз?","faq":"Ведущий должен быть способен ответить на все вопросы.","likes":113,"dislikes":35,"solve_percent":null,"solve_total":null,"date":"21.01.2013","comments":35},{"id":337,"title":"Часовой на мосту","category":"Алгоритмы","text":"Часовому было приказано ходить по одномерному мосту длиной 100 м в течение одного часа таким образом, чтобы побывать в каждой точке моста четное число раз (0, 2, 4 и т.д.). Начинать и заканчивать маршрут часовой может в любой точке моста по своему усмотрению. Сможет ли часовой придумать такой маршрут? Примечания: 1) часовой должен двигаться с постоянной конечной скоростью (значение скорости он выбирает сам), 2) разворачиваться часовой может мгновенно.","faq":null,"likes":44,"dislikes":24,"solve_percent":null,"solve_total":null,"date":"04.08.2008","comments":103}]};

const CAT_LABELS = {
  logic:'Логика', weighing:'Взвешивания', liars:'Лжецы и хитрецы',
  games:'Игры', zagadki:'Загадки', life:'На смекалку',
  probability:'Вероятности', equivival:'Последовательности', algorithm:'Алгоритмы'
};

const CAT_ICONS = {
  logic:'🧩', weighing:'⚖️', liars:'🎭', games:'🎲',
  zagadki:'❓', life:'💡', probability:'🎯',
  equivival:'🔢', algorithm:'⚙️'
};

let currentCat = 'logic';
let currentSort = 'default';
let searchQuery = '';
let viewMode = 'category'; // 'category' or 'solved'

// LocalStorage helpers — stores {id: "ISO timestamp"}
function getSolved() {
  try {
    const raw = JSON.parse(localStorage.getItem('bg_solved') || '{}');
    // Migrate old format (true -> timestamp)
    let migrated = false;
    for (const k in raw) { if (raw[k] === true) { raw[k] = new Date().toISOString(); migrated = true; } }
    if (migrated) localStorage.setItem('bg_solved', JSON.stringify(raw));
    return raw;
  } catch { return {}; }
}
function setSolved(id, val) {
  const s = getSolved();
  if (val) s[id] = new Date().toISOString(); else delete s[id];
  localStorage.setItem('bg_solved', JSON.stringify(s));
}
function isSolved(id) { return !!getSolved()[id]; }
function solvedAt(id) { return getSolved()[id] || null; }
function totalSolved() { return Object.keys(getSolved()).length; }
function totalPuzzles() { return Object.values(DATA).reduce((a, b) => a + b.length, 0); }

// Build sidebar
function buildNav() {
  const nav = document.getElementById('cat-nav');
  const solved = getSolved();
  nav.innerHTML = '';
  for (const [key, puzzles] of Object.entries(DATA)) {
    const solvedInCat = puzzles.filter(p => solved[p.id]).length;
    const btn = document.createElement('button');
    btn.className = 'cat-btn' + (viewMode === 'category' && key === currentCat ? ' active' : '');
    btn.innerHTML = `<span>${CAT_ICONS[key] || ''} ${CAT_LABELS[key] || key}</span><span class="solved-count">${solvedInCat ? solvedInCat + '✓' : ''}</span><span class="count">${puzzles.length}</span>`;
    btn.onclick = () => { currentCat = key; viewMode = 'category'; render(); closeSidebarMobile(); };
    nav.appendChild(btn);
  }
  // Update solved nav button
  const solvedBtn = document.getElementById('solved-nav-btn');
  solvedBtn.className = 'cat-btn' + (viewMode === 'solved' ? ' active' : '');
  document.getElementById('solved-nav-count').textContent = totalSolved();
}

// Render puzzles
function render() {
  buildNav();
  updateStats();

  if (viewMode === 'solved') { renderSolvedView(); return; }

  document.getElementById('sort-bar').style.display = '';
  document.getElementById('search').parentElement.style.display = '';

  const puzzles = DATA[currentCat] || [];
  const title = CAT_LABELS[currentCat] || currentCat;
  document.getElementById('page-title').textContent = title;

  let filtered = puzzles;
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    filtered = puzzles.filter(p => p.title.toLowerCase().includes(q) || p.text.toLowerCase().includes(q));
  }

  // Sort
  filtered = [...filtered];
  if (currentSort === 'likes') filtered.sort((a, b) => b.likes - a.likes);
  else if (currentSort === 'difficulty') filtered.sort((a, b) => (a.solve_percent ?? 100) - (b.solve_percent ?? 100));
  else if (currentSort === 'date') filtered.sort((a, b) => {
    const da = a.date ? a.date.split('.').reverse().join('') : '0';
    const db = b.date ? b.date.split('.').reverse().join('') : '0';
    return db.localeCompare(da);
  });

  const solvedCount = filtered.filter(p => isSolved(p.id)).length;
  document.getElementById('page-subtitle').textContent = `${filtered.length} задач${filtered.length === 1 ? 'а' : filtered.length < 5 ? 'и' : ''} · ${solvedCount} решено`;

  const list = document.getElementById('puzzle-list');
  if (!filtered.length) {
    list.innerHTML = '<div class="empty-state"><div class="icon">🔍</div><p>Ничего не найдено</p></div>';
    return;
  }

  list.innerHTML = filtered.map((p, i) => {
    const solved = isSolved(p.id);
    const textLong = p.text.length > 250;
    return `
    <div class="puzzle-card ${solved ? 'solved' : ''}" style="animation-delay:${Math.min(i * 40, 400)}ms" data-id="${p.id}">
      <div class="card-top">
        <input type="checkbox" class="solve-check" ${solved ? 'checked' : ''} onchange="toggleSolve(${p.id}, this.checked)" title="Отметить как решённую">
        <div class="card-title">${esc(p.title)}</div>
      </div>
      <div class="card-meta">
        ${p.likes != null ? `<span class="meta-item meta-likes"><svg viewBox="0 0 24 24"><path d="M14 9V5a3 3 0 00-3-3l-4 9v11h11.28a2 2 0 002-1.7l1.38-9a2 2 0 00-2-2.3H14z"/><path d="M7 22H4a2 2 0 01-2-2v-7a2 2 0 012-2h3"/></svg>${p.likes}</span>` : ''}
        ${p.dislikes != null ? `<span class="meta-item meta-dislikes"><svg viewBox="0 0 24 24"><path d="M10 15v4a3 3 0 003 3l4-9V2H5.72a2 2 0 00-2 1.7l-1.38 9a2 2 0 002 2.3H10z"/><path d="M17 2h2.67A2.31 2.31 0 0122 4v7a2.31 2.31 0 01-2.33 2H17"/></svg>${p.dislikes}</span>` : ''}
        ${p.solve_percent != null ? `<span class="meta-item meta-solve">Решили ${p.solve_percent}% из ${p.solve_total}</span>` : ''}
        ${p.date ? `<span class="meta-item meta-date">${p.date}</span>` : ''}
        ${p.comments ? `<span class="meta-item">💬 ${p.comments}</span>` : ''}
      </div>
      <div class="card-text ${textLong ? 'collapsed' : ''}" id="text-${p.id}">${esc(p.text)}</div>
      ${p.image ? `<img class="card-img" src="${p.image}" alt="Иллюстрация к задаче" loading="lazy">` : ''}
      ${textLong ? `<button class="expand-btn" onclick="toggleExpand(${p.id}, this)">Показать полностью ▾</button>` : ''}
      ${p.faq ? `<details class="card-faq"><summary>Примечания к условию</summary><div style="margin-top:8px">${esc(p.faq)}</div></details>` : ''}
    </div>`;
  }).join('');

  renderMath();
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function toggleSolve(id, checked) {
  setSolved(id, checked);
  const card = document.querySelector(`[data-id="${id}"]`);
  if (card) card.classList.toggle('solved', checked);
  buildNav();
  updateStats();
  // Update subtitle
  const puzzles = DATA[currentCat] || [];
  const solvedCount = puzzles.filter(p => isSolved(p.id)).length;
  const filtered = searchQuery ? puzzles.filter(p => p.title.toLowerCase().includes(searchQuery.toLowerCase()) || p.text.toLowerCase().includes(searchQuery.toLowerCase())) : puzzles;
  const fSolved = filtered.filter(p => isSolved(p.id)).length;
  document.getElementById('page-subtitle').textContent = `${filtered.length} задач · ${fSolved} решено`;
}

function toggleExpand(id, btn) {
  const el = document.getElementById('text-' + id);
  const collapsed = el.classList.toggle('collapsed');
  btn.textContent = collapsed ? 'Показать полностью ▾' : 'Свернуть ▴';
}

function updateStats() {
  const ts = totalSolved(), tp = totalPuzzles();
  document.getElementById('stats-text').textContent = `${ts} / ${tp}`;
  document.getElementById('progress-fill').style.width = (tp ? (ts / tp * 100) : 0) + '%';
}

function showSolvedView() {
  viewMode = 'solved';
  render();
  closeSidebarMobile();
}

function findPuzzleById(id) {
  for (const puzzles of Object.values(DATA)) {
    const p = puzzles.find(x => x.id == id);
    if (p) return p;
  }
  return null;
}

function findPuzzleCat(id) {
  for (const [cat, puzzles] of Object.entries(DATA)) {
    if (puzzles.find(x => x.id == id)) return cat;
  }
  return null;
}

function formatDateTime(iso) {
  const d = new Date(iso);
  const pad = n => String(n).padStart(2, '0');
  return `${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function formatDateOnly(iso) {
  const d = new Date(iso);
  const pad = n => String(n).padStart(2, '0');
  const months = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
  return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
}

function renderSolvedView() {
  document.getElementById('page-title').textContent = 'Решённые задачи';
  document.getElementById('sort-bar').style.display = 'none';
  document.getElementById('search').parentElement.style.display = 'none';

  const solved = getSolved();
  const entries = Object.entries(solved)
    .map(([id, ts]) => ({ id: parseInt(id), ts, puzzle: findPuzzleById(id), cat: findPuzzleCat(id) }))
    .filter(e => e.puzzle)
    .sort((a, b) => b.ts.localeCompare(a.ts));

  const ts = entries.length, tp = totalPuzzles();
  const pct = tp ? Math.round(ts / tp * 100) : 0;

  // Stats by category
  const byCat = {};
  for (const e of entries) {
    byCat[e.cat] = (byCat[e.cat] || 0) + 1;
  }

  // Group by date
  const byDate = {};
  for (const e of entries) {
    const day = e.ts.slice(0, 10);
    if (!byDate[day]) byDate[day] = [];
    byDate[day].push(e);
  }

  const list = document.getElementById('puzzle-list');
  document.getElementById('page-subtitle').textContent = `${ts} из ${tp} (${pct}%)`;

  let html = `<div class="solved-stats">
    <div class="stat-card"><div class="stat-value">${ts}</div><div class="stat-label">Решено</div></div>
    <div class="stat-card"><div class="stat-value">${tp - ts}</div><div class="stat-label">Осталось</div></div>
    <div class="stat-card"><div class="stat-value">${pct}%</div><div class="stat-label">Прогресс</div></div>
    <div class="stat-card"><div class="stat-value">${Object.keys(byDate).length}</div><div class="stat-label">Дней активности</div></div>
  </div>`;

  // Per-category breakdown
  html += `<div class="solved-stats" style="margin-bottom:28px">`;
  for (const [cat, puzzles] of Object.entries(DATA)) {
    const done = byCat[cat] || 0;
    const total = puzzles.length;
    const catPct = total ? Math.round(done / total * 100) : 0;
    html += `<div class="stat-card" style="cursor:pointer" onclick="currentCat='${cat}';viewMode='category';render()">
      <div class="stat-value" style="font-size:1.1rem">${done}/${total}</div>
      <div class="stat-label">${CAT_ICONS[cat] || ''} ${CAT_LABELS[cat] || cat}</div>
      <div style="margin-top:6px;height:3px;background:var(--border);border-radius:2px;overflow:hidden">
        <div style="width:${catPct}%;height:100%;background:var(--green);border-radius:2px"></div>
      </div>
    </div>`;
  }
  html += `</div>`;

  if (!entries.length) {
    html += '<div class="empty-state"><div class="icon">📝</div><p>Пока нет решённых задач. Отмечайте задачи галочкой!</p></div>';
  } else {
    // Timeline grouped by day
    html += `<div style="display:flex;flex-direction:column;gap:8px">`;
    for (const [day, items] of Object.entries(byDate)) {
      html += `<div class="solved-timeline-date">${formatDateOnly(items[0].ts)}</div>`;
      for (const e of items) {
        const p = e.puzzle;
        const time = new Date(e.ts);
        const timeStr = `${String(time.getHours()).padStart(2,'0')}:${String(time.getMinutes()).padStart(2,'0')}`;
        html += `<div class="solved-item" style="animation:fadeUp .3s both">
          <span class="si-date">${timeStr}</span>
          <span class="si-title">${esc(p.title)}</span>
          <span class="si-cat">${CAT_ICONS[e.cat] || ''} ${CAT_LABELS[e.cat] || e.cat}</span>
          <button class="si-remove" onclick="setSolved(${p.id},false);render()" title="Убрать из решённых">✕</button>
        </div>`;
      }
    }
    html += `</div>`;
  }

  list.innerHTML = html;
}

// Daily puzzle
let dailyOffset = 0;
function getDailyPuzzle(offset) {
  const allPuzzles = Object.values(DATA).flat();
  const unsolved = allPuzzles.filter(p => !isSolved(p.id));
  const pool = unsolved.length ? unsolved : allPuzzles;
  const today = new Date();
  const seed = today.getFullYear() * 10000 + (today.getMonth() + 1) * 100 + today.getDate();
  const idx = ((seed + offset) % pool.length + pool.length) % pool.length;
  return pool[idx];
}

function showDaily() {
  const p = getDailyPuzzle(dailyOffset);
  if (!p) return;
  const solved = isSolved(p.id);
  const overlay = document.getElementById('modal-overlay');
  document.getElementById('modal-content').innerHTML = `
    <div class="modal-header">
      <span class="modal-title">&#9733; Задача дня</span>
      <div style="display:flex;align-items:center;gap:8px">
        <button class="daily-nav-btn" onclick="dailyOffset--;showDaily()" title="Предыдущая">&#8592;</button>
        <button class="daily-nav-btn" onclick="dailyOffset++;showDaily()" title="Следующая">&#8594;</button>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
    </div>
    <div class="card-top" style="margin-bottom:12px">
      <input type="checkbox" class="solve-check" ${solved ? 'checked' : ''} onchange="toggleSolve(${p.id}, this.checked)">
      <div class="card-title" style="font-size:1.2rem">${esc(p.title)}</div>
    </div>
    <div class="card-meta" style="margin-bottom:14px">
      ${p.solve_percent != null ? `<span class="meta-item meta-solve">Решили ${p.solve_percent}% из ${p.solve_total}</span>` : ''}
      <span class="meta-item meta-likes"><svg viewBox="0 0 24 24" style="width:14px;height:14px;stroke:var(--green);fill:none;stroke-width:2"><path d="M14 9V5a3 3 0 00-3-3l-4 9v11h11.28a2 2 0 002-1.7l1.38-9a2 2 0 00-2-2.3H14z"/></svg>${p.likes}</span>
      ${p.date ? `<span class="meta-item meta-date">${p.date}</span>` : ''}
    </div>
    <div class="card-text" style="font-size:.92rem;line-height:1.75;color:var(--text-dim)">${esc(p.text)}</div>
    ${p.image ? `<img class="card-img" src="${p.image}" alt="Иллюстрация к задаче">` : ''}
    ${p.faq ? `<details class="card-faq" style="margin-top:16px"><summary>Примечания к условию</summary><div style="margin-top:8px">${esc(p.faq)}</div></details>` : ''}
  `;
  overlay.classList.add('active');
  renderMath(document.getElementById('modal-content'));
  closeSidebarMobile();
}

function closeModal() { document.getElementById('modal-overlay').classList.remove('active'); }

// Sidebar mobile
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.querySelector('.sidebar-overlay').classList.toggle('active');
}
function closeSidebarMobile() {
  document.getElementById('sidebar').classList.remove('open');
  document.querySelector('.sidebar-overlay').classList.remove('active');
}

// Search
document.getElementById('search').addEventListener('input', e => {
  searchQuery = e.target.value.trim();
  render();
});

// Sort
document.getElementById('sort-bar').addEventListener('click', e => {
  const btn = e.target.closest('.sort-btn');
  if (!btn) return;
  currentSort = btn.dataset.sort;
  document.querySelectorAll('.sort-btn').forEach(b => b.classList.toggle('active', b === btn));
  render();
});

// KaTeX rendering
function renderMath(root) {
  const el = root || document.getElementById('puzzle-list');
  if (typeof renderMathInElement === 'function') {
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$', right: '$', display: false}
      ],
      throwOnError: false
    });
  }
}

// Init
document.addEventListener('DOMContentLoaded', () => { render(); });
// KaTeX auto-render callback
document.addEventListener('DOMContentLoaded', () => {
  const check = setInterval(() => {
    if (typeof renderMathInElement === 'function') { clearInterval(check); renderMath(); }
  }, 200);
});

// Keyboard
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeModal(); closeSidebarMobile(); }
});
</script>
</body>
</html>
