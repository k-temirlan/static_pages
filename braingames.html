08","comments":96},{"id":410,"title":"Круговое вранье","category":"Лжецы, хитрецы, правдивцы","text":"Мегамозг попал на остров, каждый житель которого либо всегда говорит правду, либо всегда лжет. Все жители острова встали в круг лицом к центру, и каждый сказал Мегамозгу про соседа справа, правдив ли он. На основании этих высказываний Мегамозг смог однозначно определить, какую долю от всех жителей острова составляют правдивцы. Определите и вы, чему она равна.","faq":null,"likes":254,"dislikes":10,"solve_percent":1,"solve_total":62065,"date":"27.06.2009","comments":45},{"id":626,"title":"Кто бы правду мне сказал...","category":"Лжецы, хитрецы, правдивцы","text":"В группе из 27 человек каждый либо правдивец, либо хитрец (отвечающий как ему вздумается). Каждому из них по отдельности можно задать любое количество вопросов, на которые он может ответить либо «да», либо «нет». За какое минимальное количество вопросов можно гарантированно идентифицировать хотя бы одного правдивца, если известно, что хитрецов меньше половины? Доказательство минимальности не требуется.","faq":"1. Запрещены вопросы, на которые нельзя ответить \"да\" или \"нет\".2. Все люди в группе знают принадлежность друг друга к хитрецам и правдивцам.3. Хитрец отвечает как ему хочется, то есть, на все ваши вопросы может сказать правду.4. Хитрецов может не быть вовсе.","likes":22,"dislikes":0,"solve_percent":null,"solve_total":null,"date":"13.01.2021","comments":26},{"id":518,"title":"Три брата","category":"Лжецы, хитрецы, правдивцы","text":"Невезучий Мегамозг снова попал в руки подлых оккупантов. И опять встал вопрос о жизни или смерти. Перед ним поставили трех человек и сказали: «Это три брата: Правдивец, Лжец и Хитрец (который случайным образом выбирает, сказать «да» или «нет»). Если ты, задав один вопрос любому, гарантированно определишь одного из тех, кто не Хитрец, тебя отпустят. Они могут отвечать на твой вопрос либо «да», либо «нет». Нельзя задавать вопрос, ответ на который не известен». Может ли Мегамозг справиться с поставленной задачей?","faq":"1. Хитрец не решает перед каждым ответом, кто он - правдивец или лжец.Он решает, что сказать - 'да' или 'нет'. Он всегда хитрец.2. При этом принцип выбора ответа для нас выглядит случайным, т.е. он нам неизвестен и может быть любым. Например, хитрец может спрашивать генератор случайных чисел, или замерять температуру своего тела с точностью до тысячных и использовать четность последней значащей цифры, или всегда отвечать \"да\".","likes":135,"dislikes":8,"solve_percent":null,"solve_total":null,"date":"02.06.2012","comments":89},{"id":365,"title":"Немой стражник","category":"Лжецы, хитрецы, правдивцы","text":"Вы стоите на развилке двух дорог, одна из дорог ведет к дому (но вы не знаете, какая). К счастью, на развилке стоит стражник, который либо правдивец, либо лжец. К сожалению, стражник немой, но, к счастью, не глухой и понимает вас. Стражник, говоря «да» и «нет», произносит их как «ыыыы» и «уууу», однако, что из них означает «да», а что «нет» — неизвестно. Других звуков стражник не говорит, да и вдобавок не может показать нужное направление жестом. Ко всему прочему он еще и глуповат: не понимает длинные вопросы более 15 слов. Какой вопрос нужно задать стражнику, чтобы узнать, какая дорога выведет вас к родному дому? Вопрос можно задать только один и только такой, на который стражник в состоянии ответить.","faq":null,"likes":198,"dislikes":18,"solve_percent":null,"solve_total":null,"date":"30.01.2009","comments":79},{"id":202,"title":"«Данетка»","category":"Лжецы, хитрецы, правдивцы","text":"Перед вами три шкатулки, в одной из которых находится конфета, и ведущий знает, в какой именно. Ведущий всегда говорит правду, но ответить может только на вопрос о ложности или истинности некоторого суждения «да» или «нет». Как узнать, где лежит конфета, задав ведущему всего один вопрос? Ответ ведущего строится по законам математической логики.","faq":null,"likes":145,"dislikes":47,"solve_percent":null,"solve_total":null,"date":"17.05.2007","comments":130},{"id":603,"title":"Один вопрос","category":"Лжецы, хитрецы, правдивцы","text":"Однажды, гуляя по острову лжецов и правдивцев, Мегамозг встретил 10 незнакомых туземцев. Задав вопрос одному из них и услышав «нет» в ответ, он определил, кто из них кто. Что это мог быть за вопрос?","faq":"Встреченные туземцы знают друг про друга кто лжец, кто правдивец?Да.","likes":70,"dislikes":27,"solve_percent":null,"solve_total":null,"date":"07.09.2014","comments":37}],"games":[{"id":777,"title":"Игра в длинные числа","category":"Игры","text":"Мегамозги Бычков и Медведев играют в игру. Медведев диктует цифры от 1 до 9, каждая может встретиться ровно один раз, а Бычков записывает их на бумагу: первую в центре листа, а каждую последующую — правее всех уже записанных или левее всех уже записанных. Цель Бычкова — получить максимально возможное число, Медведева — минимально возможное. Какие числа могут оказаться на листочке?","faq":"1. Медведев сам определяет, в каком порядке диктовать цифры.2. Свой выбор Бычков может делать для каждой цифры отдельно.","likes":58,"dislikes":7,"solve_percent":7,"solve_total":3406,"date":"21.06.2022","comments":24},{"id":706,"title":"Блиц с шоколадкой","category":"Игры","text":"Оккупанты решили поиздеваться над Микромозгом-тугодумом и заставили сыграть его в такую игру. Берется огромная плитка шоколада 104x21. Первый игрок ломает ее на два куска по одной из бороздок. Далее ходят по очереди: сначала второй берет любой из имеющихся кусков и ломает по бороздке, затем первый и т.д. На обдумывание очередного хода дается всего 5 секунд. Проигрывает тот, кто за отведенное время не сделает очередной ход. Микромозг вправе выбрать, каким по счету он будет ходить, но в случае проигрыша его казнят. «Как мне победить?!» — с этим вопросом прибежал перепуганный до смерти Микромозг к Мегамозгу — и тут же успокоился, выслушав ответ. Какую стратегию предложил Мегамозг?","faq":"1. Мегамозг, будучи бесконечно умным, предложил Микромозгу самую простую из возможных стратегию. Ведь речь идет о жизни и смерти :)2. Разрешено делать только действия, предусмотренные правилами игры. Есть шоколадку нельзя, выбрасывать тоже.","likes":77,"dislikes":4,"solve_percent":4,"solve_total":6358,"date":"31.03.2021","comments":16},{"id":115,"title":"Охота кота Леопольда","category":"Игры","text":"Перед котом Леопольдом пять мышиных норок, расположенных в ряд. В одной из них спряталась мышка. Леопольд может засунуть лапу в любую из норок и попробовать поймать мышку. Мышка боится кота, поэтому после каждой его попытки обязательно перебегает в соседнюю норку справа или слева. За какое минимальное количество попыток кот сможет гарантированно поймать мышку? Доказательство минимальности не требуется.","faq":null,"likes":513,"dislikes":9,"solve_percent":2,"solve_total":74189,"date":"09.12.2006","comments":135},{"id":797,"title":"Переливай-ка!","category":"Игры","text":"Два лаборанта во время дежурства придумали себе развлечение с новой партией из 100 одинаковых мензурок. В одну мензурку наливают воду. Затем лаборанты по очереди выполняют следующие действия:- первый выбирает мензурку и отливает из нее в любые две другие любое количество воды, возможно разное;- второй выбирает мензурку и аналогичным образом делает одно переливание в любую другую мензурку.Сможет ли первый получить 10 мензурок с одинаковыми порциями воды, если второй хочет ему помешать?","faq":"1. Порцией воды считается любое количество, не равное нулю.2. У лаборантов отличный глазомер: они точно знают, сколько воды в каждой мензурке, и могут точно отмерить переливаемый объем.3. Переливать можно в любую мензурку: как в пустую, так и в уже заполненную водой.4. Выливать воду в другие емкости запрещено.5. Чтобы первый получил \"зачет\", достаточно, чтобы нашлось 10 одинаковых объемов в некоторых мензурках. Количество воды в других мензурках не важно.6. Испарением и неделимостью молекул пренебречь.","likes":12,"dislikes":0,"solve_percent":null,"solve_total":null,"date":"04.11.2022","comments":9},{"id":664,"title":"Миллион дублонов","category":"Игры","text":"Два минимозга нашли пещеру с сокровищами, в которой лежит миллион дублонов. Пещера заколдована: за раз из нее можно вынести количество дублонов, равное либо 1, либо натуральной степени любого простого числа, иначе умрешь на месте. Минимозги решили выносить монеты по очереди и заранее договорились, что клад достанется тому, кто возьмет последний дублон. У кого из них есть выигрышная стратегия?","faq":null,"likes":121,"dislikes":2,"solve_percent":1,"solve_total":20387,"date":"10.02.2016","comments":23},{"id":767,"title":"Игра со степенями","category":"Игры","text":"Двое школьников играют в игру. Первый выбирает целое число больше двух, с которым по очереди выполняются следующие действия: сначала второй вычитает квадрат натурального числа, затем первый возводит в натуральную степень. Второй выигрывает, если после его хода получится ноль. Может ли первый ему помешать?","faq":null,"likes":35,"dislikes":1,"solve_percent":1,"solve_total":7008,"date":"13.02.2021","comments":13},{"id":780,"title":"Диагональ против вертикали","category":"Игры","text":"Двое играют на доске 10x10 клеток. Первый кладет фишки на одну или несколько подряд идущих свободных клеток по диагонали, второй - по вертикали. Игрок, после хода которого на доске не останется свободных клеток, объявляется победителем. Кто победит при оптимальной игре?","faq":null,"likes":34,"dislikes":2,"solve_percent":1,"solve_total":5233,"date":"15.09.2021","comments":6},{"id":106,"title":"Игра с монетами","category":"Игры","text":"Двое мегамозгов решили сыграть в игру: кладут на круглый стол монеты. Тот, кому некуда положить монету, проигрывает. Монеты могут соприкасаться и краями выходить за границы стола (но чтоб не падали), но не могут лежать друг на друге. Все монеты одного размера, идеально ровные и круглые. Стол тоже идеально ровный и круглый. Есть ли выигрышная стратегия для какого-либо игрока? Если нет, то докажите. Если есть, то для какого игрока и какая?А если стол будет квадратный?","faq":null,"likes":251,"dislikes":21,"solve_percent":2,"solve_total":74236,"date":"05.12.2006","comments":32},{"id":329,"title":"Крестики-нолики по-мегамозговски","category":"Игры","text":"Два мегамозга решили поиграть в крестики-нолики по новым правилам: любой игрок может поставить в свой ход по желанию либо крестик, либо нолик. Они играют на обычном поле 3×3. Выигрывает по-прежнему тот, после хода которого образуются три крестика или нолика, стоящих в линию. Есть ли в этой игре выигрышная стратегия и у кого: начинающего или второго?","faq":null,"likes":238,"dislikes":37,"solve_percent":2,"solve_total":66613,"date":"15.06.2008","comments":28},{"id":332,"title":"Игра с суммами","category":"Игры","text":"Двое играют в следующую игру. На столе в ряд выложено четное число карточек с числами. Игроки по очереди берут одну из карточек с любого из концов ряда. Выигравший должен набрать бОльшую сумму, иначе ничья. Кто не проигрывает в этой игре? Какова непроигрышная стратегия?","faq":null,"likes":157,"dislikes":7,"solve_percent":null,"solve_total":null,"date":"08.07.2008","comments":48},{"id":402,"title":"Цезарь и Брут","category":"Игры","text":"Два полководца (Цезарь и Брут) захватывают некую страну, представляющую собой города, некоторые из которых соединены дорогами так, что из любого города можно дойти по дорогам в любой другой. В первый ход сначала Цезарь выбирает любой город и захватывает его, потом Брут выбирает любой незахваченный город и захватывает его. Далее каждый по очереди (начиная с Цезаря) выбирает любой незахваченный никем город, соединенный с уже захваченным им городом, и захватывает его. Игра продолжается, пока не будут захвачены все города. Каждый хочет захватить как можно больше городов. Если в какой-то момент один из игроков не может захватить город, он пропускает ход. Может ли случиться, что Брут захватит городов больше, чем Цезарь?","faq":"1. Города соединены каждый с каждым? Т.е. можно ли из любого города попасть в любой другой, не проходя через третий?Необязательно.2. Цезарь играет оптимально или может быть глуповат?Конечно, Цезарь выбирает наилучшую для него стратегию.3. В очередной ход игрок должен захватить город рядом с последним захваченным им городом?Необязательно. Игрок может захватить город рядом с любым ранее захваченным им городом.","likes":77,"dislikes":3,"solve_percent":null,"solve_total":null,"date":"24.04.2009","comments":53},{"id":417,"title":"Три фишки в ряд","category":"Игры","text":"Есть полоска, разделенная на N клеток, расположенных горизонтально в ряд (N > 3). На первых трех клетках, если считать справа, стоит по фишке. Двое играют в игру, в которой каждым ходом любая фишка перемещается влево на любую свободную клетку (разрешается перепрыгивать через другие фишки). Игроки ходят по очереди. Проигрывает тот, кто не может сделать очередной ход. У кого есть выигрышная стратегия?","faq":null,"likes":141,"dislikes":6,"solve_percent":null,"solve_total":null,"date":"14.09.2009","comments":19},{"id":419,"title":"Игра в 15","category":"Игры","text":"Два игрока играют в следующую игру. На бумаге выписаны числа от 1 до 9, игроки по очереди закрывают любую из цифр фишкой своего цвета. Выигрывает тот участник, который первым закроет своими фишками три числа, сумма которых равна 15 (если игрок закрыл больше трех чисел, то он выигрывает, если сумма хотя бы одной из троек чисел равна 15). Есть ли в этой игре выигрышная стратегия? Если есть, то у какого игрока и какая?","faq":null,"likes":175,"dislikes":7,"solve_percent":null,"solve_total":null,"date":"08.10.2009","comments":21},{"id":108,"title":"Пирожки","category":"Игры","text":"Два мегамозга играют в игру. Каждый по очереди берет из кучи пирожков 1, 2 или 3 пирожка и съедает их. При этом он не может взять столько, сколько взял соперник предыдущим ходом. Выигрывает тот, кто съедает последний пирожок или после чьего хода соперник свой ход сделать не может. Кто из них выиграет при правильной игре, если сначала в куче было 2000 пирожков?","faq":null,"likes":142,"dislikes":7,"solve_percent":null,"solve_total":null,"date":"07.12.2006","comments":40},{"id":659,"title":"Делится-не-делится","category":"Игры","text":"Два мегамозга играют в следующую игру. Первый задумывает целое число больше 100, а второй называет целое число больше единицы. Если названное число является делителем задуманного, второй выиграл. В противном случае первый вычитает его из задуманного, запоминает результат, и игра продолжается уже с этим числом. Первый победит, если в процессе игры у него получится отрицательное число. Повторять ранее названные числа второй мегамозг не может. Есть ли у него выигрышная стратегия?","faq":null,"likes":78,"dislikes":4,"solve_percent":null,"solve_total":null,"date":"27.10.2016","comments":40},{"id":718,"title":"Морской бой — 2","category":"Игры","text":"Петя с папой играют в морской бой. Папа расставляет 37 кораблей размером 1х1 на доску 7х7, после чего Петя стреляет сетью, которая представляет собой квадрат 2х2, навсегда убирающей с поля корабль в том случае, если он в сети оказался один. Петя выигрывает, если сумеет убрать все корабли с доски. Может ли папа так расставить корабли, чтобы Петя мог выиграть?","faq":"1. Сеть должна целиком помещаться в поле.","likes":44,"dislikes":3,"solve_percent":null,"solve_total":null,"date":"04.08.2019","comments":17},{"id":617,"title":"Игра с клетками","category":"Игры","text":"Два мегамозга вырезали из клетчатой бумаги полоску 1×N и играют в такую игру: первый за свой ход закрашивает не более 10 клеток, а второй, в свою очередь, стирает краску не более чем с 10 идущих подряд закрашенных клеток. Первый выиграет, если закрасит всю полоску. При каких N ему это удастся?","faq":"1. Требуется найти все N, при которых у первого игрока есть выигрышная стратегия, обосновать это и объяснить, почему для других N выигрышной стратегии не существует.2. Второй имеет право стирать только группу идущих подряд закрашенных клеток (от 0 до 10).","likes":76,"dislikes":6,"solve_percent":null,"solve_total":null,"date":"14.02.2015","comments":15},{"id":400,"title":"Игра со стержнями","category":"Игры","text":"Два мегамозга играют в игру. Имеется 100 деревянных стержней с длинами 1, 2, ..., 100 мегадюймов. Каждый по очереди выбирает 3 стержня, складывает из них треугольник и сжигает его. Проигрывает тот, кто не может сделать ход. У кого из игроков есть выигрышная стратегия?","faq":"Треугольник из трех стержней можно сложить только тогда, когда длины этих стержней удовлетворяют строгому неравенству треугольника, т.е. сумма длин любых двух стержней из трех, выбранных игроком, должна превышать длину третьего.Пример: из стержней 5, 7 и 12 нельзя сложить треугольник.","likes":71,"dislikes":7,"solve_percent":null,"solve_total":null,"date":"22.04.2009","comments":20},{"id":311,"title":"Шоколадка с ядовитой плиткой","category":"Игры","text":"Дана шоколадка, состоящая из N×M плиток (причем плиток как минимум две), плитка в левом нижнем углу ядовитая. Двое по очереди отламывают куски шоколадки и съедают их. За каждый ход игрок выбирает одну из оставшихся плиток, отламывает и съедает ее и все плитки, расположенные не ниже и не левее выбранной. Тот, кто будет вынужден съесть ядовитую плитку, проигрывает. Докажите, что у первого есть выигрышная стратегия.","faq":null,"likes":65,"dislikes":7,"solve_percent":null,"solve_total":null,"date":"20.04.2008","comments":53},{"id":429,"title":"Клетки и квадраты","category":"Игры","text":"На бесконечном листе клетчатой бумаги два Мегамозга играют в такую игру: первый по сетке рисует квадрат со сторонами 2 или 3, а второй закрашивает в этом квадрате одну клетку и так далее по очереди. Ни один из игроков не может повторять ранее сделанный ход. Второй выигрывает, если сможет сделать 15 ходов, иначе выигрывает первый. Кто победит при правильной игре обоих?","faq":null,"likes":31,"dislikes":4,"solve_percent":null,"solve_total":null,"date":"21.12.2009","comments":54},{"id":432,"title":"Игра на симметричность","category":"Игры","text":"На изначально пустой доске 1х81 двое мегамозгов играют в игру. Первый ММ каждый ход ставит белую или черную фишку на любое поле доски. Второй за ход может поменять местами любые две фишки на доске либо пропустить ход. Если после 81 хода каждого игрока фишки на доске будут расположены симметрично, выиграет второй, в противном случае — первый. Кто же победит?","faq":null,"likes":128,"dislikes":17,"solve_percent":null,"solve_total":null,"date":"06.01.2010","comments":35},{"id":726,"title":"Сыграем в дурака!","category":"Игры","text":"Двое мегамозгов играли на пляже в подкидного (не переводного) дурака и в какой-то момент игры при пустой колоде у 1-го игрока остались король (червы) и три шестерки (пики, бубны, червы), а у второго туз, дама, валет червовые и две десятки (бубны и червы). Козыри червы. Нужно определить, кто выиграет при дальнейшей оптимальной игре.","faq":"1) Несколько карт унесло ветром, потому колода была неполной.2) Текущее состояние игры такое: предыдущий заход игры уже завершен, а новый еще не начат. Карты, которых в данный момент нет на руках у игроков, уже вышли из игры. 3) Кто из игроков должен сейчас заходить - неизвестно. Дать ответ для обоих случаев: при заходе 1-го игрока и при заходе 2-го.","likes":33,"dislikes":5,"solve_percent":null,"solve_total":null,"date":"31.08.2020","comments":39},{"id":673,"title":"Стенка на стенку","category":"Игры","text":"В «Игре в пешки» игроки ходят по очереди, перемещая одну из своих пешек по шахматной доске. Ходить можно как вперед, так и назад на любое количество клеток, но нельзя ни перепрыгивать через пешку противника, ни съедать ее. Проигрывает тот, кто не сможет сделать ход. Кто выиграет при оптимальной игре в следующей позиции, если сейчас ход белых?","faq":null,"likes":41,"dislikes":7,"solve_percent":null,"solve_total":null,"date":"06.05.2017","comments":12}],"zagadki":[{"id":88,"title":"Необычная покупка","category":"Загадки","text":"— Сколько просите за один? — поинтересовался покупатель в магазине.— Двадцать рублей, — ответил продавец. — А за двенадцать? — Сорок рублей. — Вообще-то, мне нужно сто двадцать. — Пожалуйста. С вас шестьдесят рублей. Что покупал этот человек?","faq":null,"likes":649,"dislikes":148,"solve_percent":10,"solve_total":74303,"date":"29.11.2006","comments":127},{"id":689,"title":"Мегапоговорки","category":"Загадки","text":"Восстановите текст русской народной пословицы, поговорки или крылатой фразы:Чем меньше производная функции, тем выше значение функции.В пословице опровергается прямая зависимость между размерами животного и интенсивностью источаемого запаха.Рекомендуется обратить особое внимание на знак математической операции.Обстановка доставляет наслаждение при любом значении (x, y, z), отличном от текущего.Пословица о благоприятном воздействии физической величины на человека.Необходимым условием существования высокоорганизованных биосоциальных организмов является их способность совершать круговые движения.В данной поговорке устанавливается прицел на 2-3 см ниже предполагаемого.","faq":null,"likes":79,"dislikes":9,"solve_percent":1,"solve_total":17021,"date":"31.03.2017","comments":38},{"id":646,"title":"Свободное место","category":"Загадки","text":"Сидит человек. Когда он встанет, место под ним освободится. При желании вы сможете увидеть это место, потрогать рукой и убедиться, что на нем наверняка поместится человек вашей комплекции. Но даже если очень захотите, вы не сможете сесть на это место. Где сидит человек?","faq":"Вы - это вы, т.е. человек, не персонаж и не животное.Никто вам не мешает.","likes":142,"dislikes":24,"solve_percent":3,"solve_total":22302,"date":"06.07.2015","comments":31},{"id":392,"title":"Два раза бесплатно","category":"Загадки","text":"Каждому человеку два раза в жизни это дается бесплатно. Но чтобы получить это в третий раз, человеку приходится платить огромные деньги. Что это?","faq":null,"likes":458,"dislikes":90,"solve_percent":7,"solve_total":63297,"date":"19.03.2009","comments":33},{"id":383,"title":"На границе","category":"Загадки","text":"Во время Второй мировой войны над пропастью между Германией и Швейцарией был мост. Его охранял немецкий часовой. Ему было приказано стрелять в каждого, кто попытается бежать из Германии через мост в Швейцарию, и возвращать назад тех, у кого нет разрешения на вход в Германию. Часовой был на немецкой стороне моста. Он сидел в будке и каждые три минуты выходил наружу, чтобы осмотреть мост. Была одна женщина, которой необходимо было срочно попасть в Швейцарию, но она не могла получить разрешения на это. Она знала, что может проникнуть на мост, когда часовой сидит в будке, но для того, чтобы пройти весь мост, требовалось пять-шесть минут. На мосту было негде спрятаться, и часовой мог с легкостью застрелить ее, если бы увидел, что она направляется в Швейцарию. Как она смогла перебраться через мост?","faq":null,"likes":317,"dislikes":66,"solve_percent":4,"solve_total":63342,"date":"15.03.2009","comments":16},{"id":533,"title":"Лиса и ветка","category":"Загадки","text":"Ходит байка, согласно которой лисы время от времени совершают странный ритуал: лиса берет в зубы ветку, медленно заходит в реку и плывет, старательно оставляя ветку сухой, а заплыв достаточно далеко, выплевывает ветку и возвращается. В народе нашли довольно логичное объяснение такому поведению лис. Какое?","faq":null,"likes":181,"dislikes":38,"solve_percent":2,"solve_total":36254,"date":"14.12.2012","comments":42},{"id":517,"title":"История любви","category":"Загадки","text":"Она не могла существовать без него... никогда. Он всегда был для нее причиной чтобы жить. Но, как только между ними исчезала преграда, она исчезала тоже. Назовите эту парочку.","faq":null,"likes":180,"dislikes":41,"solve_percent":2,"solve_total":42190,"date":"26.05.2012","comments":21},{"id":254,"title":"Вещь на выброс","category":"Загадки","text":"Что за вещь, которую мы выбрасываем, когда она нужна, и поднимаем, когда не нужна?","faq":null,"likes":232,"dislikes":63,"solve_percent":4,"solve_total":69405,"date":"13.10.2007","comments":10},{"id":160,"title":"Праздники","category":"Загадки","text":"Написав на доске даты ближайших праздников, которые будут отмечаться в школе, — Хэллоуин и Рождество Христово — учитель информатики вдруг поставил между этими датами знак равенства. Почему? В какой стране это могло произойти?","faq":null,"likes":53,"dislikes":19,"solve_percent":null,"solve_total":null,"date":"06.02.2007","comments":57},{"id":225,"title":"Ужин","category":"Загадки","text":"В семье готовится ужин. Глава семейства решил подшутить и насыпал в кастрюлю горсть соли. Чуть позже то же проделал старший сын. Затем — средний и младший. Завершила это коварное дело дочь. Когда ужин был готов, то всем пришлось его еще солить. Что готовили на ужин?","faq":null,"likes":228,"dislikes":81,"solve_percent":3,"solve_total":71249,"date":"11.07.2007","comments":63},{"id":231,"title":"Загадка Леонардо да Винчи","category":"Загадки","text":"Чем больше оттуда берут, тем больше оно становится. Что это?","faq":null,"likes":273,"dislikes":97,"solve_percent":6,"solve_total":71175,"date":"14.07.2007","comments":27},{"id":85,"title":"Две реки","category":"Загадки","text":"Наступает ночь, и образуются две реки: одна белая, другая красная. Течение их направлено в противоположные стороны, и случись им смешаться, возникает боль и печаль. Наступает день — и две реки исчезают. Что это за реки?","faq":"07.12.2014 условие задачи было изменено.","likes":122,"dislikes":48,"solve_percent":7,"solve_total":74307,"date":"29.11.2006","comments":112},{"id":245,"title":"Зарплата натурой","category":"Загадки","text":"Несмотря на стабилизацию экономической ситуации в стране мегамозгов, работникам одного из предприятий продолжают выдавать зарплату собственной продукцией. Почему?","faq":null,"likes":299,"dislikes":121,"solve_percent":6,"solve_total":69839,"date":"26.09.2007","comments":5},{"id":304,"title":"Непонятный цвет","category":"Загадки","text":"Двое гуляющих остановились около одного предмета и заспорили. Один сказал: «Это черная». Второй возразил: «Нет, это красная». «Почему же она белая?» — спросил первый. «А потому что зеленая». Что это?","faq":null,"likes":498,"dislikes":207,"solve_percent":12,"solve_total":67202,"date":"11.04.2008","comments":41},{"id":164,"title":"Наказание разбойникам","category":"Загадки","text":"Поймал царь трех братьев разбойников и осудил их: первому брату дал 10 лет тюрьмы, второму — 20 лет тюрьмы, третьему — пожизненно. Царь вскоре умер, и на престол взошел его сын, по этому случаю он объявил амнистию и сократил всем сроки наказания вдвое: первому брату сидеть 5 лет, второму — 10 лет. Какое наказание он определил третьему брату?","faq":null,"likes":375,"dislikes":159,"solve_percent":6,"solve_total":73308,"date":"07.02.2007","comments":71},{"id":224,"title":"Видеть сквозь стены","category":"Загадки","text":"Микроскоп — вещь, которая позволяет смотреть на маленькие предметы. Телескоп — вещь, которая позволяет смотреть на далекие предметы. А как называется вещь, которая позволяет смотреть сквозь стены?","faq":null,"likes":257,"dislikes":109,"solve_percent":4,"solve_total":71249,"date":"11.07.2007","comments":39},{"id":367,"title":"Ветеран","category":"Загадки","text":"Отставной английский генерал очень опечалился, когда увидел на улице нищего с плакатом «Ветеран Второй мировой войны». Поэтому он дал ему 9 фунтов. Нищий поблагодарил его — и генерал разозлился. Почему?","faq":null,"likes":206,"dislikes":87,"solve_percent":3,"solve_total":63665,"date":"07.02.2009","comments":22},{"id":500,"title":"Изобретение Мегамозга","category":"Загадки","text":"Дело было в Великобритании XVIII века. Один мегамозг, разделив на части обычную географическую карту тех времен, изготовил учебное пособие. Назовите это, столь популярное в наши дни, изобретение.","faq":null,"likes":158,"dislikes":68,"solve_percent":2,"solve_total":48232,"date":"12.12.2011","comments":16},{"id":282,"title":"Кольцо в кофе","category":"Загадки","text":"Мегамозг уронил в чашку с кофе золотое кольцо и смог достать его пальцами, даже не замочив их. Как такое могло быть?","faq":null,"likes":220,"dislikes":128,"solve_percent":4,"solve_total":68071,"date":"12.01.2008","comments":60},{"id":277,"title":"Принцесса-роза","category":"Загадки","text":"Гуляя знойным летом на заходе солнца в дворцовом парке, принц встретил девушку удивительной красоты. Они сразу понравились друг другу и провели вдвоём волшебную ночь. Но на рассвете она сказала, что ей нужно уходить. Что она принцесса, превращенная злым колдуном в розу. И только на одну ночь летом становится девушкой. Если до восхода солнца не превратится опять в розу — она умрёт. А расколдовать её можно только, узнав среди сотни других роз. Если принц ошибется — она погибнет! Принцесса ушла, но принц с восходом солнца вышел в свой парк и без труда нашел её! Они жили долго и счастливо! Как он ее узнал?","faq":null,"likes":153,"dislikes":93,"solve_percent":2,"solve_total":68310,"date":"17.12.2007","comments":26}],"life":[{"id":92,"title":"Рукопожатия маляров","category":"На смекалку","text":"Шли два мегамозга, работающие малярами, навстречу — еще двое. У каждого руки испачканы своей краской, и никому не хочется пачкаться чужой. Мегамозги хотят поздороваться друг с другом (каждый из первой пары с каждым из второй и наоборот) рукопожатием, но на всех есть только две перчатки. Как им можно решить эту проблему? Перчатки не выворачиваются.","faq":null,"likes":1622,"dislikes":51,"solve_percent":10,"solve_total":74293,"date":"30.11.2006","comments":263},{"id":15,"title":"Забывчивый больной","category":"На смекалку","text":"У Мегамозга нашли страшную болезнь. Доктор выписал ему всего 4 таблетки двух видов (по две каждого вида), совершенно неотличимых друг от друга, и предупредил, что, если выпить более одной таблетки одного вида — смерть, не выпить таблеток — смерть, выпить за раз меньше нормы — смерть. Таблетки надо принять за два приема: утром — 2 таблетки (по одной каждого вида) и также вечером — 2 таблетки (по одной каждого вида). К несчастью, Мегамозг смешал таблетки. Как ему гарантированно выжить?","faq":null,"likes":2577,"dislikes":110,"solve_percent":23,"solve_total":75611,"date":"22.09.2006","comments":216},{"id":188,"title":"Два кубика и наклейки","category":"На смекалку","text":"Есть два кубика и бесконечное число наклеечек с цифрами от 0 до 9. Необходимо так расклеить эти наклейки, чтобы с помощью этих кубиков можно было бы представить любое число месяца. Числа 1, 2, ..., 9 должны представляться как 01, 02, ..., 09.","faq":null,"likes":992,"dislikes":70,"solve_percent":9,"solve_total":72262,"date":"18.04.2007","comments":95},{"id":27,"title":"Верёвка и скала","category":"На смекалку","text":"Мегамозг стоит на скале высотой 100 метров. У скалы на высоте 50 метров есть уступ. У Мегамозга есть веревка длиной 75 метров. Ему нужно спуститься со скалы, используя эту веревку. Веревку можно привязывать только к двум колышкам, которые находятся на высоте 50 и 100 метров.Небольшая подсказка: веревку можно резать поперек.","faq":null,"likes":880,"dislikes":89,"solve_percent":9,"solve_total":75611,"date":"22.09.2006","comments":150},{"id":66,"title":"Три выключателя","category":"На смекалку","text":"Есть три выключателя, один из которых включает/выключает свет в кладовке. Находясь возле выключателей, невозможно определить, горит свет в кладовке или нет. Необходимо определить, какой из выключателей относится к кладовке. Все выключатели изначально в положении ВКЛ. При этом разрешается один раз подойти к выключателям, а затем зайти в кладовку и дать ответ.","faq":null,"likes":972,"dislikes":113,"solve_percent":12,"solve_total":74377,"date":"24.11.2006","comments":117},{"id":12,"title":"Фабрики кроссовок","category":"На смекалку","text":"Мегамозг — владелец фирмы по производству кроссовок. У фирмы есть две фабрики, где производят одну и ту же модель. На обеих фабриках воруют по-черному. Мегамозгу не хочется прибегать к каким-либо кадровым изменениям, однако необходимо остановить воровство. Как это сделать?","faq":null,"likes":797,"dislikes":240,"solve_percent":16,"solve_total":75611,"date":"22.09.2006","comments":97},{"id":168,"title":"Наследство","category":"На смекалку","text":"Старый мегамозг перед смертью завещал трем сыновьям свои 17 мозгокнижек. Киломозгу завещал 1/2, Минимозгу 1/3, а Микромозгу 1/9. И никак они книжки поделить не могли. Но мимо проходил один Мегамозг, он помог им поделить книги. Что сделал Мегамозг?","faq":null,"likes":502,"dislikes":159,"solve_percent":8,"solve_total":72985,"date":"27.02.2007","comments":72},{"id":75,"title":"Люки","category":"На смекалку","text":"Почему канализационные люки делают круглыми?","faq":null,"likes":858,"dislikes":287,"solve_percent":14,"solve_total":74342,"date":"27.11.2006","comments":62},{"id":341,"title":"Мегамозг и фургон","category":"На смекалку","text":"Работал как-то Мегамозг перевозчиком живой воды и добился на этом поприще фантастических успехов. Он стал единственным поставщиком живой воды в замок Мегатолстосумов. Дело в том, что конструкция машины для перевозки живой воды запатентована и изменению не подлежит, а ворота в замке были низкими, и ни один перевозчик не мог туда проехать. Не хватало какой-то мелочи — 2–3 см по высоте. Раз за разом конкурентам Мегамозга приходилось тратить время на разгрузку живой воды у ворот и последующую ее доставку к Мегатолстосумам, и они в итоге отказались от своих контрактов. Мегамозг был единственным, кто решил эту проблему. Что он придумал?","faq":null,"likes":545,"dislikes":182,"solve_percent":10,"solve_total":65790,"date":"06.09.2008","comments":36},{"id":107,"title":"Пожарное ведро","category":"На смекалку","text":"Пожарные ведра бывают разные: в виде усеченного конуса, цилиндрические и т.д. Почему же на пожарных щитах предпочитают размещать только ведра конической формы?","faq":null,"likes":389,"dislikes":229,"solve_percent":9,"solve_total":74225,"date":"06.12.2006","comments":31},{"id":84,"title":"Устройство раковины","category":"На смекалку","text":"Почему сливная труба раковины имеет кривую форму (положенная набок буква S)?","faq":null,"likes":398,"dislikes":243,"solve_percent":10,"solve_total":74307,"date":"29.11.2006","comments":25},{"id":238,"title":"Зарплата работнику","category":"На смекалку","text":"Мегамозг нанял себе работника на неделю. Расплачиваться с ним необходимо каждый день кусочком золота. Для этой цели Мегамозг запасся куском золота в виде цилиндра, от которого планировал каждый день отрезать по 1/7 части. Беда, естественно, пришла неожиданно: в первый день расплаты Мегамозг обнаружил, что ножовки хватит только на два распила. Как ему рассчитаться? (Два распила — это значит, что до поломки ножовка сможет распилить только два «диаметра» золотого цилиндра).","faq":null,"likes":671,"dislikes":72,"solve_percent":7,"solve_total":70365,"date":"01.09.2007","comments":209},{"id":302,"title":"Мегамозг и часы","category":"На смекалку","text":"У Мегамозга не было наручных часов, но зато дома висели точные настенные часы, которые он иногда забывал заводить. Однажды утром, обнаружив, что часы остановились, Мегамозг отправился в гости к своему другу, у которого были точные часы. Он провел там почти весь день, а вернувшись домой, сумел правильно поставить свои часы. Каким образом ему удалось это сделать, если время в пути заранее известно не было?","faq":null,"likes":514,"dislikes":71,"solve_percent":6,"solve_total":67210,"date":"10.04.2008","comments":132},{"id":59,"title":"Как поезд трогается с места","category":"На смекалку","text":"Мегамозг заметил, что перед тем, как двинуть поезд вперёд, машинист обычно подаёт весь состав назад. Для чего это делается?","faq":null,"likes":459,"dislikes":117,"solve_percent":7,"solve_total":74392,"date":"23.11.2006","comments":48},{"id":260,"title":"Заговор против Мегамозга","category":"На смекалку","text":"Жил был Мегамозг, и был он очень знаменит в своей стране. Но однажды завистливые правители решили избавиться от него и придумали хитрую казнь: взяли два листа и написали на одном «должен умереть», а на другом — «должен жить». Листы сложили в коробку: какой из них Мегамозг вытянет, так и будет. А чтобы избавиться от ненавистного Мегамозга наверняка, тайно заменили спасительный вердикт на еще один лист с надписью «должен умереть». Куда ни кинь — всюду клин... Хитрыми путями Мегамозг узнал об этой подмене и крепко задумался.В утро казни на площади собралось много народа; он, как и было положено, вытащил лист, чтобы определить свою судьбу... А через несколько минут было решено, что он должен жить. Что сделал Мегамозг, чтобы остаться в живых?","faq":null,"likes":465,"dislikes":125,"solve_percent":8,"solve_total":69050,"date":"26.10.2007","comments":79},{"id":131,"title":"Ворованный спирт","category":"На смекалку","text":"Филя работал дальнобойщиком и частенько возил спирт через границу. Поскольку он и сам был не дурак выпить, то решил, что окончание рейса хорошо бы отметить бутылочкой С2H5OH. Но цистерна была запломбирована, а за срыв пломбы Филю запросто могли попереть с работы. И все-таки он придумал, как воровать спирт, не снимая пломбы с цистерны. Как ему удалось это провернуть, не присутствуя ни при заливке, ни при сливе цистерны?","faq":null,"likes":479,"dislikes":144,"solve_percent":7,"solve_total":74055,"date":"18.12.2006","comments":100},{"id":296,"title":"Стук колес","category":"На смекалку","text":"Почему, когда мы едем в поезде, колеса стучат реже, чем если мы стоим на платформе, а поезд проезжает мимо?","faq":"Учитывая различное возможное расположение наблюдателей как вдоль вагона так и на перроне, следует уточнить модель. Будем сравнивать стук, слышимый двумя наблюдателями:- первый стоит в переходе между двумя пассажирскими вагонами и слышит только стук от ближайших колесных тележек этих двух вагонов (обычно в пассажирских вагонах в каждой тележке по две колесные пары);- второй стоит на перроне напротив стыка рельсов и слышит стук колес только от этого стыка.","likes":298,"dislikes":98,"solve_percent":4,"solve_total":67460,"date":"13.03.2008","comments":29},{"id":79,"title":"Шахматисты","category":"На смекалку","text":"Два мегамозга сыграли 5 партий в шахматы, ни одна из которых не закончилась вничью. Первый выиграл столько же партий, сколько второй, при этом у каждого мегамозга число выигрышей оказалось равно числу проигрышей. Приведите возможные результаты партий.","faq":null,"likes":266,"dislikes":148,"solve_percent":5,"solve_total":74320,"date":"28.11.2006","comments":56},{"id":267,"title":"Беспризорник","category":"На смекалку","text":"Жил-был беспризорник в подвале среди других таких же беспризорников, как и он. Он собрал 10 окурков. Из трех окурков он делает самокрутку и выкуривает. Вопрос: сколько самокруток выкурит беспризорник?","faq":null,"likes":408,"dislikes":254,"solve_percent":5,"solve_total":68512,"date":"27.11.2007","comments":157},{"id":154,"title":"Мегамозг и бутылка","category":"На смекалку","text":"Террор деревни мегамозгов проклятыми оккупантами продолжается. На этот раз, поймав Мегамозга, оккупанты дали ему обычную полную бутылку воды и угОльную линейку, потребовав, чтобы он посчитал объем бутылки, иначе — смерть. Мегамозг внимательно осмотрел бутылку: она была не фигурной, ровной, с плоским дном, без этикетки. Провел несколько действий и дал ответ. Как ему это удалось?","faq":"1. Бутылка представляет собой цилиндр и горлышко вычурной формы небольшого объёма.2. Шкала есть на обоих \"катетах\" угольника.","likes":343,"dislikes":32,"solve_percent":2,"solve_total":73697,"date":"19.01.2007","comments":153},{"id":574,"title":"План торгового центра","category":"На смекалку","text":"Мегамозгу поручили раскрасить в 4 цвета гигантский план торгового центра. Каждый его фрагмент нужно полностью покрыть краской так, чтобы все фрагменты получились одноцветными, но никакие смежные не были окрашены одинаково. Площадь фрагмента 1 - 2 м2, остальные занимают по 1 м2 плана. Мегамозгу выдали 3 л красной, 3 л желтой, 2 л зеленой и 1 л синей масляной краски (расход - 1 л/м2). Как он справился с поручением?","faq":"Уважаемые игроки! Прежде чем задать какой-либо вопрос в комментариях, подумайте, не будет ли ответ на него подсказкой. В частности, положительный ответ на некий вопрос по этой задаче является практически решением.","likes":314,"dislikes":43,"solve_percent":3,"solve_total":30518,"date":"23.10.2013","comments":74,"image":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAfQAAAHFCAYAAAAE8AuCAAAACXBIWXMAAC4jAAAuIwF4pT92AAAgAElEQVR4nO3dB5xcZbnH8TeJISEQOggBMSgg7C7SFLFc0IteUC9dQZASkCZSrnTwoiBIu/QOUpVeBKRIld4jENhdBSkiJfQWCCmQ3P/DeYc9DDPbMjPvmWd+38/n4fSz7yzZ+c855z1nPjNz5swAAACa22dSNwAAAMw6Ah0AAAcIdAAAHCDQAQBwgEAHAMABAh0AAAcIdAAAHCDQAQBwgEAHAMABAh0AAAcIdAAAHCDQAQBwgEAHAMCBQQV6R3vbGA32rXFbANTeSqrRcbxL9VrCtsyKIzq7up9L3QigyAZ7hD6/aqdaNgRA3S2XugGz4BwVgQ70glPuAAA4UItAn6Y6vgb7AVB7/xN6/s7Hq25L15QBs7OAI1M3AmgWtQj0qZ1d3XvWYD8AaqyjvW3H0PN3flsz/a2q7VsFAh3oN065AwDgAIEOAIADBDoAAA4Q6AAAOECgAwDgAIEOAIADBDoAAA4Q6AAAOECgAwDgAIEOAIADBDoAAA4Q6AAAOECgAwDgAIEOAIADBDoAAA4Q6AAAOECgAwDgAIEOAIADBDoAAA4Q6AAAOECgAwDgAIEOAIADBDoAAA4Q6AAAOECgAwDgAIEOAIADBDoAAA4Q6AAAOECgAwDgAIEOAIADBDoAAA4Q6AAAOECgAwDgAIEOAIADBDoAAA4Q6AAAOECgAwDgAIEOAIADBDoAAA4Q6AAAOECgAwDgAIEOAIADLRfoHe1t4zQ4PHU7gAYZlRsfk6wVAOqu5QJdvqhaKHUjgATmTN0AAPXTioEOAIA7rR7oM1SXp24EUEcbqIbF8VdSNgRAfbV6oE/v7OreKHUjgHrpaG97L/RcR38rZVsA1FerBzoAAC4Q6AAAOECgAwDgAIEOAIADBDoAAA4Q6AAAOECgAwDgAIEOAIADBDoAAA4Q6AAAOECgAwDgAIEOAIADBDoAAA4Q6AAAOECgAwDgAIEOAIADBDoAAA4Q6AAAOECgAwDgAIEOAIADBDoAAA4Q6AAAOECgAwDgAIEOAIADBDoAAA4Q6AAAOECgAwDgAIEOAIADBDoAAA4Q6AAAOECgAwDgAIEOAIADBDoAAA4Q6Ki7jva2lTXYXPVN1VjVaNVk1dOqm1Wnd3Z1P52sgQDgAIGOulGQj9TgRNXWqiFli0eoVo61m9Y9SMODFewzG9tKAPCBQEddKKAtwC9RrR1nfaC6QnWb6k3VGNU6qtVUw1W/Vc2u2q/RbQUADwh01MuWoSfMX1OtpaPvv5Wtc5SCf5yGZ6iGqfbR9FVa7/7GNRMAfCDQUS+75sa3qxDmH9H8cxTi7RrdI2Sn5XdUEegAMEAEOmpOAb2wBivEyVdUV/axyXkhC3Szar3aBQCeEeioh7lV16ss2J/pR0e313Pjo+vWKgBwjEBHzSnAH9fg+wPYZLnc+MQaNwcAWgKBjiLYKTd+S7JWAEATI9CRVEd720Ya/CBOTlOdkrA5KK7L9G9lSupGAA1wa2d q/QbQHAh0AHBOQf1ofL78xiF7Kpx9cYz1aLde1naa/fJevooUTYJAB4AWEHt+nx0LDhHoAAA4QKADAOAAgQ4AgAMEOgAADhDoAAA4QKADAOAAgQ4AgAMEOgAADhDoAAA4QKADAOAAgQ4AgAMEOgAADhDoAAA4QKADAODA/wOSIxrp2NtgqQAAAABJRU5ErkJggg=="},{"id":20,"title":"Свет на лестнице","category":"На смекалку","text":"Как провести электричество, чтобы свет на лестнице можно было включать и выключать как с верхней площадки, так и с нижней?","faq":null,"likes":328,"dislikes":50,"solve_percent":3,"solve_total":75611,"date":"22.09.2006","comments":92},{"id":133,"title":"Посылка","category":"На смекалку","text":"Вы хотите послать другу ценный предмет, но не хотите, чтоб была возможность у кого-то перехватить его. У вас есть коробка, которая больше, чем сам предмет. У коробки есть кольца (петли), которые больше, чем было бы достаточно для любого замка. Замки (обычные, не самозащелкивающиеся) с ключами продаются в магазинах. Как же послать другу предмет? Замечание: вы не можете послать ключ в незапертой коробке, так как его могут скопировать. А также нельзя сначала послать предмет в запертой коробке, а потом ключ.","faq":null,"likes":318,"dislikes":54,"solve_percent":3,"solve_total":74055,"date":"18.12.2006","comments":118},{"id":728,"title":"Аттракцион-лабиринт","category":"На смекалку","text":"Минимозг придумал аттракцион-лабиринт, в котором добираться от старта до финиша нужно таким образом, чтобы цвета пройденных индикаторов чередовались. Но вот беда, у Минимозга никак не получается сделать его проходимым. Минимозг пришел Мегамозгу с проектом лабиринта и просьбой внести минимальное количество изменений в цвета индикаторов, чтобы лабиринт стал проходимым. Что бы Вы предложили на месте Мегамозга?","faq":"1. Индикаторы при прохождении через них не убираются, проходить один и тот же индикатор можно произвольное число раз.2. Менять направление движения можно только на перекрестках и поворотах дорог лабиринта.","likes":78,"dislikes":18,"solve_percent":3,"solve_total":8645,"date":"27.07.2020","comments":18,"image":"data:image  не уравновешены, так как имеют разные длины плеч, но за правильность гирь он ручается. Зато второй сказал, что его весы абсолютно точные, но за гири он поручиться не может. Мегамозг решил попросить гири у первого и взвесить камень у второго, но проклятая конкуренция вынудила их отказать ему в этой маленькой просьбе. Мегамозг нашел выход и из этой ситуации, найдите его и вы.","faq":null,"likes":210,"dislikes":37,"solve_percent":1,"solve_total":53880,"date":"07.03.2011","comments":71},{"id":256,"title":"N киллеров и одна СВД","category":"На смекалку","text":"N киллеров совместно купили СВД (снайперскую винтовку Драгунова). Винтовка крепится к петле на стене в гараже (у всех собственников есть замки с ключами), так что каждый из них может пользоваться винтовкой в любое время. Но вот беда: ведь если кто-то из них решит спереть винтовку, то не удастся узнать, кто же присвоил ее себе. Как им поступить, чтобы для каждого сохранилась возможность независимо от других использовать оружие, но все знали, кто его взял?","faq":null,"likes":168,"dislikes":43,"solve_percent":1,"solve_total":69334,"date":"16.10.2007","comments":133},{"id":259,"title":"Конструкторская задача","category":"На смекалку","text":"Есть стальная пластина 100×20×2 мм и стальной прут длиной 200 мм и диаметром 3 мм. На обоих концах прута нарезана правая резьба, длина нарезанного участка с каждой стороны 6 мм. В пластине просверлены 2 отверстия возле концов, диаметром 2,5 мм, в них тоже нарезана резьба (т.е. прут можно вкрутить в любое из этих отверстий). Требуется изготовить деталь, в которой прут, изогнутый в виде буквы П, был бы обоими концами вкручен в отверстия на пластине, причем по 1 мм резьбы должны «торчать» с другой стороны пластины. Как это сделать? Технология изготовления не должна требовать более сложного инструмента, чем тот, что обычно имеется дома (т.е. отвертки, плоскогубцы, тиски, молоток — можно; а высокотемпературная печь, пневматический молот, сварочный аппарат и пресс-форма — нельзя). Деталь должна проходить следующую проверку: если распилить прут, то каждая его половина должна вывинчиваться из пластины.","faq":null,"likes":161,"dislikes":45,"solve_percent":1,"solve_total":69076,"date":"25.10.2007","comments":65},{"id":604,"title":"Запрещенный препарат","category":"На смекалку","text":"В Мозголяндии некоторые жители пристрастились к употреблению запрещенного препарата «Отупин». Власти решили оценить остроту проблемы, но было понятно, что употребляющие не согласятся открыто признаться в нарушении закона. Как ни странно, Мегамозг и тут нашел выход. «Есть такой способ опроса, который позволяет оценить общий процент отупляющихся и дает полные гарантии конфиденциальности для всех участников», — сказал он. Способ действительно оказался хорошим, и в опросе согласились принять участие даже самые недоверчивые жители, подозревающие, что все их действия могут быть подсмотрены. Предложите такой способ и вы.","faq":"1. Нужно устроить опрос так, чтобы ни для одного отдельно взятого жителя нельзя было бы определить, употребляет он \"Отупин\" или нет, даже если другие смогут видеть и слышать всё, что видят и слышат опрашиваемые в ходе опроса.2. Это касается не только обычных жителей, но и организаторов опроса - ни один из организаторов не должен быть способен сказать о ком-либо, что тот употребляет отупин.3. Оценка не обязана быть идеально точной (типа 3.486845345%), но и погрешность оценки не должна быть 50%, и более того, оценка должна быть состоятельной. Т.е. если считать, что все участники в точности следуют инструкциям и их количество устремляется к бесконечности, погрешность оценки должна стремиться к нулю.","likes":63,"dislikes":10,"solve_percent":null,"solve_total":null,"date":"28.10.2017","comments":54},{"id":336,"title":"Прикладная","category":"На смекалку","text":"Реализуйте свое предложение по улучшению сайта, расширению его функционала, привлечению аудитории, спонсоров, коллаборации. Зачет можно получить не за техническую реализацию, а за какую-нибудь существенную активность — продвижение в интернете, вузах, школах, организация работы программистов-волонтеров и т.д.Бонусом к зачету будет 10% от прибыли с реализованной идеи.","faq":null,"likes":6,"dislikes":3,"solve_percent":null,"solve_total":null,"date":"22.07.2008","comments":85},{"id":620,"title":"Шахматный набор","category":"На смекалку","text":"Одного индийского мастера попросили изготовить набор шахмат по спецзаказу, пообещав за каждую сделанную фигуру заплатить 1 рупию. По окончании работы мастеру заплатили 96 рупий. Почему?","faq":"Это был набор для игры в шахматы по стандартным правилам.","likes":117,"dislikes":13,"solve_percent":2,"solve_total":16527,"date":"16.06.2017","comments":44},{"id":112,"title":"Достать шарик","category":"На смекалку","text":"В вертикально вкопанную металлическую трубу высотой 2 метра диаметром 5 см уронили металлический шарик диаметром 3 см. Придумайте как можно больше способов достать шарик из трубы, не выкапывая ее.","faq":null,"likes":105,"dislikes":25,"solve_percent":2,"solve_total":74209,"date":"08.12.2006","comments":37},{"id":80,"title":"Задача про барометр","category":"На смекалку","text":"Опишите хотя бы 10 способов определить высоту здания с помощью барометра.","faq":null,"likes":53,"dislikes":16,"solve_percent":null,"solve_total":null,"date":"28.11.2006","comments":41},{"id":512,"title":"Труба с водой","category":"На смекалку","text":"Есть очень длинная и очень толстая металлическая труба, по которой течет вода. Как, не нарушая целостность трубы, узнать в какую сторону течет вода?","faq":null,"likes":142,"dislikes":43,"solve_percent":2,"solve_total":45494,"date":"27.02.2012","comments":55},{"id":273,"title":"Три сестры","category":"На смекалку","text":"Жил-был царь. У него было три дочери: старшая, средняя и младшая. Младшая была самая красивая, самая любимая. Царь был стар и умен. Он давно издал указ, по которому первая дочь, выходящая замуж, получит полцарства. Зная указ, средняя и старшая дочери очень хотели замуж и часто из-за этого ссорились. Младшая дочь замуж не собиралась. Чтобы разрешить все вопросы с замужеством и уладить ссоры, царь предложил провести такое соревнование.Он поставил на стол три чайника. Они были совершенно одинаковы, как по внешнему виду, так и по вместимости. Царь налил в каждый чайник равное количество воды из ведра. «Мои любимые дочери, — начал свою речь царь, — сейчас каждая из вас возьмет по чайнику и отправится вместе со мной на кухню. Там вы поставите чайники на плиту и дождетесь, пока они закипят. Та дочь, у которой чайник закипит раньше, выйдет замуж первой». Как ни странно, но расчеты царя были точными: первым закипел чайник у младшей дочери. Почему так получилось?","faq":null,"likes":185,"dislikes":63,"solve_percent":3,"solve_total":68419,"date":"06.12.2007","comments":108},{"id":436,"title":"Лампа на луне","category":"На смекалку","text":"При разработке космического корабля для посадки на Луну необходимо было создать мощную осветительную лампу. Но испытания показали, что во всех предложенных конструкциях при ударе, имитирующем посадку, происходит разгерметизация лампы по линии крепления стеклянного баллона к металлу цоколя. И тут Мегамозг предложил… Что предложил Мегамозг?","faq":null,"likes":139,"dislikes":48,"solve_percent":1,"solve_total":58865,"date":"19.01.2010","comments":18},{"id":119,"title":"Застольная","category":"На смекалку","text":"Решил Мегамозг ресторан открыть на природе, но досталась ему местность очень неровная, а он знал, как раздражает посетителей, когда столы шатаются. А так как столы надо убирать вечером и выставлять утром, выравнивать каждый раз ножки у столов очень сложно (столов много, а ставить столы всегда на те же места сложно). Что предпринял Мегамозг для того, чтобы столы не шатались?","faq":null,"likes":154,"dislikes":60,"solve_percent":2,"solve_total":74134,"date":"13.12.2006","comments":39},{"id":582,"title":"Шоколадный мыслитель","category":"На смекалку","text":"Минимозг хочет подарить Мегамозгу на день рождения шоколадного «Мыслителя» с начинкой из густого варенья. Он сделал соответствующую фигурную формочку, обмазал изнутри горячим шоколадом, подождал застывания и решил наложить в нее варенья, закрыв отверстие шоколадной пластинкой. Оказалось, что густое варенье неравномерно заполняет форму, при этом пустоты делают фигурку Мыслителя очень хрупкой. Тогда Минимозг решил нагреть варенье и, когда оно стало достаточно текучим, вылил его в шоколадную форму. Но шоколад расплавился и смешался с начинкой. Как же Минимозгу изготовить конфету, чтобы Мегамозг не остался без подарка?","faq":null,"likes":60,"dislikes":26,"solve_percent":null,"solve_total":null,"date":"14.06.2013","comments":13},{"id":459,"title":"Купите денежку","category":"На смекалку","text":"У Мегамозга было 5 купюр по 100 рублей каждая (купюры самые обычные). Мегамозг позвонил по пяти номерам телефонов и предложил ответившим купить у него одну купюру в 100 рублей за 500 рублей. Согласились все. Кому звонил Мегамозг и почему они согласились на столь необычное предложение?","faq":null,"likes":129,"dislikes":83,"solve_percent":1,"solve_total":56949,"date":"28.08.2010","comments":41},{"id":82,"title":"Минимозги на концерте","category":"На смекалку","text":"На концерте классической музыки в ряды ценителей прекрасного затесались два минимозга, которые устроились в партере друг позади друга. Во время первой же паузы минимозги решили, что музыкант закончил исполнять произведение, поэтому самое время для аплодисментов. Из всего зала только они начали аплодировать, причем одновременно. «Хорошо, что я не один так опозорился», — подумал минимозг, который первым услышал аплодисменты другого. Кто это был?","faq":"1. Слух у минимозгов абсолютно одинаковый.2. Условие задачи поменяли 01.08.2017, поэтому более ранние комментарии могут не соответствовать новому условию.","likes":41,"dislikes":28,"solve_percent":2,"solve_total":74307,"date":"29.11.2006","comments":70},{"id":278,"title":"Мегамозг и помидоры","category":"На смекалку","text":"Мегамозг собрал с грядки урожай помидоров и сложил в кладовке неспелые зеленые (для засолки) и спелые красные (для приготовления сока). Через неделю он зашел в кладовку и увидел, что зеленые помидоры покраснели, и теперь все томаты выглядят спелыми. Как Мегамозгу отделить спелые помидоры от дозревших?","faq":null,"likes":205,"dislikes":152,"solve_percent":6,"solve_total":68306,"date":"18.12.2007","comments":117}],"probability":[{"id":684,"title":"Три кубика — 2","category":"Теория вероятностей","text":"Трем братьям достались в наследство три необычных кубика, на гранях которых встречались только натуральные числа от 1 до 8, причем ни одно число не встречалось на двух разных кубиках. По наставлению отца все споры разрешались броском кубиков: у кого выпадет большее число, тот и выиграл. Благодаря этому в спорах среднего с младшим чаще выигрывал средний брат, а с кем бы из двоих братьев ни спорил старший брат — чаще побеждал именно он. Повзрослев, братья стали жить отдельно, перестали спорить и начали играть в кубики втроем в качестве развлечения, когда удавалось собраться вместе всей семьей. Каково же было их удивление, когда выяснилось, что теперь чаще всех выигрывает младший, а реже всех — старший.Приведите пример кубиков, с которыми это возможно при большом числе игр.","faq":"1. Серия споров была достаточна длинной, чтобы ее фактические результаты соответствовали теоретически вычисленной вероятности.2. В игре втроем выигрывал только один из троих - тот у кого число больше.","likes":24,"dislikes":4,"solve_percent":3,"solve_total":1932,"date":"22.06.2023","comments":61},{"id":940,"title":"Больше 100 в кости","category":"Теория вероятностей","text":"Игральную кость бросают до тех пор, пока сумма всех выпавших чисел не превысит 100. Какому конкретно числу с наибольшей вероятностью окажется равна эта сумма?","faq":null,"likes":40,"dislikes":1,"solve_percent":4,"solve_total":2837,"date":"20.10.2022","comments":9},{"id":232,"title":"Русская рулетка","category":"Теория вероятностей","text":"Оккупант ловит Мегамозга, берет шестизарядный револьвер, вставляет в барабан подряд два патрона, приставляет к своему виску и спускает курок. Пусто. Затем Оккупант приставляет револьвер к голове Мегамозга и говорит: «Я могу сейчас прокрутить барабан, а могу оставить так. Как тебе больше нравится?» Что надо ответить Мегамозгу, чтобы увеличить свои шансы на выживание?","faq":"После прокрутки барабана вероятности всех 6-ти возможных положений барабана - равны.","likes":547,"dislikes":24,"solve_percent":4,"solve_total":71131,"date":"17.07.2007","comments":75},{"id":53,"title":"Три шкатулки","category":"Теория вероятностей","text":"Мегамозг решил сыграть в «Поле чудес». Якубович выносит ему три шкатулки. В одной — ключи от квартиры, где деньги лежат, в двух других — пусто. Мегамозг показывает на одну из шкатулок, но прежде чем показать Мегамозгу ее содержимое, Якубович сначала открывает одну пустую из двух оставшихся (Якубович знает, где лежат ключи), а затем предлагает поменять свой выбор. Вопрос: если поменять выбор, вероятность нахождения ключа увеличится? Уменьшится? Останется прежней?","faq":null,"likes":462,"dislikes":34,"solve_percent":4,"solve_total":74434,"date":"16.11.2006","comments":86},{"id":299,"title":"Распределить шары","category":"Теория вероятностей","text":"Имеются две коробочки, а также 100 черных и 100 белых шариков. Разложить шарики по коробкам таким образом, чтобы вероятность вытащить черный была максимальной.","faq":"1. После раскладывания шаров по коробкам равновероятно выбирается одна из коробок, а потом из неё равновероятным образом выбирается случайный шар.2. Все 200 шариков должны быть разложены по этим двум коробкам.","likes":301,"dislikes":30,"solve_percent":3,"solve_total":67218,"date":"08.04.2008","comments":74},{"id":142,"title":"Поезда в метро","category":"Теория вероятностей","text":"Жил-был Мегамозг. Он работал и с работы ездил домой на метро. Однажды Мегамозг познакомился с девушкой, которая жила в противоположной стороне от дома. И тогда Мегамозг решил, что когда он будет возвращаться с работы, то будет садиться на первый попавшийся поезд и ехать либо домой, либо к девушке. Поезда и туда, и обратно идут каждые 5 минут. Через месяц оказалось, что к девушке он ездил в 4 раза чаще, чем домой. Почему?","faq":null,"likes":315,"dislikes":36,"solve_percent":3,"solve_total":74006,"date":"22.12.2006","comments":118},{"id":739,"title":"Вероятности наоборот","category":"Теория вероятностей","text":"Из двух урн с белыми и черными шарами вынимают по одному шару. Известно, что вероятность вынуть оба белых шара равна 54%. Чему равна вероятность, что оба шара окажутся черными, если всего шаров — 25?","faq":null,"likes":54,"dislikes":22,"solve_percent":2,"solve_total":9072,"date":"28.05.2020","comments":22},{"id":247,"title":"Угадай свой цвет","category":"Теория вероятностей","text":"Три мегамозга заходят в комнату по очереди, на каждого при входе надевают колпак черного или белого цвета, колпаки выбираются случайным образом. После того как они посмотрели друг на друга, их разводят по разным комнатам и каждому предлагают ответить, какого цвета на нем колпак. Мегамозг может либо назвать цвет, либо отказаться отвечать. Если все мегамозги промолчат или хотя бы один из них ответит неверно, всех расстреляют. Кто из них должен отвечать и какова максимальная вероятность выжить? Заранее они ни о чем не договариваются, никаких знаков друг другу не подают. Доказательство максимальности не требуется.","faq":"Выбор какой колпак надеть делается подбрасыванием манетки - вероятность 50 на 50.","likes":195,"dislikes":12,"solve_percent":1,"solve_total":69811,"date":"27.09.2007","comments":63},{"id":193,"title":"Демография","category":"Теория вероятностей","text":"Однажды Великий Султан столкнулся с поистине сложной проблемой. Представители обедневшей знати стали жаловаться, что им сложно набирать себе гаремы, соответствующие их статусу. Ведь девочек рождается примерно столько же, сколько и мальчиков, и, после того как богачи заберут к себе в гаремы по сотне жен, им, собственно, никого и не остается. Чтобы решить сложившуюся проблему, Султан решил увеличить количество девочек по отношению к количеству мальчиков. Для этого он издал такой указ: «Женщине разрешается рожать детей до тех пор, пока она не родит первого мальчика. После этого ей рожать запрещается. Таким образом, в каждой семье может быть максимум один мальчик, а девочек — сколько угодно». Насколько изменится отношение количества девочек к количеству мальчиков после выполнения этого указа?","faq":null,"likes":254,"dislikes":18,"solve_percent":2,"solve_total":72189,"date":"24.04.2007","comments":57},{"id":320,"title":"Письмо в ящике стола","category":"Теория вероятностей","text":"С вероятностью 1/2 в один из восьми ящиков стола (выбран случайно) положили письмо. Затем по очереди открыли 7 ящиков — все пусты. Какова вероятность того, что в последнем ящике письмо?","faq":null,"likes":278,"dislikes":20,"solve_percent":2,"solve_total":67036,"date":"29.04.2008","comments":55},{"id":349,"title":"Получите приз","category":"Теория вероятностей","text":"В преддверии Дня мегамозга администратор клуба «Игры разума» разослал десяти случайно выбранным участникам следующее сообщение: «Администрация сайта извещает Вас и 9 других участников о том, что каждый из вас получит денежный приз (одинаковый для всех), но при условии, что в течение недели один из вас (и только один!) пришлет ответное сообщение». После получения сообщения номинанты друг с другом не общаются. Как им следует поступить, чтобы максимизировать свои шансы получить призы?","faq":null,"likes":200,"dislikes":22,"solve_percent":1,"solve_total":64750,"date":"02.12.2008","comments":66},{"id":493,"title":"Тест на сверхспособности","category":"Теория вероятностей","text":"В Мозголяндии один из тысячи рождается со сверхспособностями. Для их обнаружения каждому новорождённому делают тест ДНК. Вероятность ошибки тестирования — 1%. Сына Мегамозга признали сверхчеловеком. Какова вероятность, что на самом деле он им не является?","faq":"Ошибка тестирования — это когда тест либо показывает наличие сверхспособностей, когда их нет, либо показывает отсутствие сверхспособностей, когда они есть.","likes":225,"dislikes":27,"solve_percent":1,"solve_total":48705,"date":"21.11.2011","comments":36},{"id":741,"title":"Точки на сфере","category":"Теория вероятностей","text":"На сфере случайным образом выбираются 4 точки. С какой вероятностью центр сферы окажется внутри тетраэдра, образованного этими точками?","faq":"1. Распределение точек стандартное равномерное. То есть, вероятность попадания точки в любую область пропорциональна площади области.","likes":16,"dislikes":2,"solve_percent":1,"solve_total":3287,"date":"18.07.2022","comments":16},{"id":351,"title":"Честный жребий","category":"Теория вероятностей","text":"Как с помощью бросания монеты провести честную жеребьевку, если известно, что у этой монеты орел выпадает немного чаще, чем решка. Под честной жеребьевкой понимается вероятность успеха 1/2.","faq":null,"likes":251,"dislikes":43,"solve_percent":2,"solve_total":64750,"date":"02.12.2008","comments":49},{"id":606,"title":"Монорельсовый трамвай","category":"Теория вероятностей","text":"Между пунктами A и B по единственному проложенному рельсу с постоянной скоростью ходит монорельсовый трамвай. Трамвай может в любой точке маршрута принять или высадить пассажира по его желанию, не затрачивая времени и не теряя скорости. В некоторый произвольный момент времени к произвольному месту рельса подходит пассажир, желая поехать в другую произвольную точку маршрута на трамвае. Докажите, что трамвай при первом проходе мимо пассажира скорее всего едет не в ту сторону, в которую хочет поехать пассажир. Найдите точное значение вероятности этого события.","faq":"Могу ли я считать положение пассажира известным и обозначить его X?Нет, не можете, ведь в условии этого не написано. Также смотрите следующий вопрос:Какую вероятность нужно найти в этой задаче?Как и во всех других задачах на вероятности, вопрос в этой задаче можно переформулировать через клонирование миров:Представьте, что вы создали много-много идентичных миров. В каждом мире вы как создатель случайным образом выбираете конкретную ситуацию из множества, описанного в задаче. Сначала с помощью генератора случайных чисел (есть на предусмотрительно купленном вами в магазине калькуляторе) вы выбираете время, когда придет пассажир. Затем, еще раз запуская генератор, выбираете положение пассажира на маршруте. Затем точно так же выбираете точку на маршруте, в которую хочет попасть ваш пассажир. И.... ждете первой встречи пассажира с трамваем.Спрашивается, в каком проценте миров пассажир испытает разочарование при первой встрече с трамваем, если число созданных миров устремить к бесконечности.Момент времени, место посадки и место, куда он хочет добраться, выбираются равномерным распределением?Да.В точках А и В разворот(смена направления движения) происходят условно говоря мгновенно?Да.","likes":123,"dislikes":3,"solve_percent":1,"solve_total":27778,"date":"22.06.2014","comments":28},{"id":712,"title":"Колпаки с буквами","category":"Теория вероятностей","text":"Оккупанты схватили шестнадцать мегамозгов и надели каждому на голову колпак со случайной буквой: «А» или «Б». Каждый мегамозг видит буквы на головах других, но не свою. После этого каждый может написать на своем листке бумаги «А» или «Б». Их всех отпустят, если хотя бы один напишет букву на своем колпаке и никто не напишет букву, которой нет на его колпаке. У них было время предварительно договориться. Найдите максимальную вероятность им оказаться на воле и приведите стратегию, при которой эта вероятность достигается. Доказательство максимальности не требуется.","faq":"1. Выбор буквы «А» или «Б» для каждого колпака равновероятен и не зависит от выбора для других.2. На бумаге все пишут одновременно и втайне друг от друга.3. Процедура происходит только один раз. Второго шанса выбраться из плена не будет.4. Единственная информация, на которой каждый мегамозг может основывать свой выбор, - это буквы на головах остальных 15 мегамозгов и их договоренности, сделанные еще до того, как были надеты колпаки.","likes":19,"dislikes":1,"solve_percent":null,"solve_total":null,"date":"01.09.2021","comments":53},{"id":234,"title":"Коробки с именами","category":"Теория вероятностей","text":"Подлые оккупанты захватили четырех мегамозгов и сказали, что их соберут вместе, дадут 5 минут на совещание, а дальше будут по одному заводить в комнату, где находятся 4 коробки в линию. В каждой коробке находится имя ровно одного мегамозга, имена всех мегамозгов присутствуют, все имена различны. Их всех по очереди заводят в комнату с коробками. Мегамозг при заходе в комнату должен будет открыть 2 коробки в поисках своего имени. После этого мегамозга выводят через другую дверь и он больше не встречается с остальными до конца испытания. Коробки приводятся в исходное состояние, и заходит следующий мегамозг. Их отпустят только в том случае, если каждый найдет свое имя, иначе все будут казнены. О чем договорились мегамозги и какие у них шансы выжить? Доказательство оптимальности стратегии не требуется.","faq":null,"likes":153,"dislikes":9,"solve_percent":null,"solve_total":null,"date":"08.08.2007","comments":103},{"id":283,"title":"Три кубика","category":"Теория вероятностей","text":"Мегамозг предлагает всем желающим сыграть с ним в игру. У Мегамозга есть три пронумерованных им игральных кубика (числа от 1 до 6, могут повторяться). Соперник может выбрать любой из них, затем Мегамозг выбирает из двух оставшихся. Игроки кидают свои кубики. У кого выпадает меньшее число, тот выплачивает сопернику заранее определённую сумму, в случае равенства проигрывает Мегамозг. Как Мегамозг пронумеровал грани кубиков, если теперь он целыми днями играет в эту игру со всеми подряд и обычно каждый день получает от нее хорошую прибыль?","faq":null,"likes":154,"dislikes":9,"solve_percent":null,"solve_total":null,"date":"12.01.2008","comments":48},{"id":514,"title":"Бросаем кубик","category":"Теория вероятностей","text":"Один Мегамозг бросил игральный кубик 2011 раз, а другой Мегамозг — 2012. Какова вероятность того, что нечетные числа у второго выпали больше раз, чем у первого?","faq":null,"likes":131,"dislikes":9,"solve_percent":null,"solve_total":null,"date":"08.03.2012","comments":13},{"id":519,"title":"Альтернативные кости","category":"Теория вероятностей","text":"Несложно посчитать вероятность выпадения определенной суммы на паре обычных игральных кубиков: сумма «2» будет выпадать с вероятностью 1/36, «3» — 2/36 и т.д. Существует ли иная раскладка натуральных чисел на паре кубиков, дающая те же вероятности для тех же самых сумм?","faq":null,"likes":118,"dislikes":8,"solve_percent":null,"solve_total":null,"date":"13.06.2012","comments":44},{"id":461,"title":"Именные футболки","category":"Теория вероятностей","text":"Ко Дню мегамозга было выпущено N именных футболок, строго по одной на каждого. Предполагалось, что мегамозги по одному в определенном порядке будут заходить в комнату, находить свою футболку, надевать ее и выходить. Но к сожалению, первый мегамозг выбыл из строя и на его место был поставлен минимозг, которому именную футболку не успели сделать. Процедура осталась той же, но минимозг, зайдя в комнату первым, надевает любую попавшуюся ему футболку. Далее каждый мегамозг, если не находит свою футболку, надевает любую другую из оставшихся. Какова вероятность того, что последний зашедший в комнату наденет свою футболку?","faq":null,"likes":143,"dislikes":10,"solve_percent":null,"solve_total":null,"date":"09.09.2010","comments":16},{"id":462,"title":"Бракованные резисторы","category":"Теория вероятностей","text":"Мегамозг собрал цепь, как показано на картинке. Однако все резисторы, которые он использовал, сделаны подлыми оккупантами, и поэтому каждый из них с вероятностью 50% бракованный. Бракованный резистор выглядит как обычный, но ток не проводит. С какой вероятностью после замыкания ключа по цепи Мегамозга все-таки пойдет ток?","faq":null,"likes":68,"dislikes":5,"solve_percent":null,"solve_total":null,"date":"14.09.2010","comments":56,"image":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD//gA+Q1JFQVRPUjogZ2QtanBlZyB2MS4wICh1c2luZyBJSkcgSlBFRyB2NjIpLCBkZWZhdWx0IHF1YWxpdHkK/9sAQwAIBgYHBgUIBwcHCQkICgwUDQwLCwwZEhMPFB0aHx4dGhwcICQuJyAiLCMcHCg3KSwwMTQ0NB8nOT04MjwuMzQy/9sAQwEJCQkMCwwYDQ0YMiEcITIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIy/8AAEQgCWAJYAwEiAAIRAQMRAf/EAB8AAAEFAQEBAQEBAAAAAAAAAAABAgMEBQYHCAkKC//EALUQAAIBAwMCBAMFBQQEAAABfQECAwAEEQUSITFBBhNRYQcicRQygZGhCCNCscEVUtHwJDNicoIJChYXGBkaJSYnKCkqNDU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6g4SFhoeIiYqSk5SVlpeYmZqio6Slpqeoqaqys7S1tre4ubrCw8TFxsfIycrS09TV1tfY2drh4uPk5ebn6Onq8fLz9PX29/j5+v/EAB8BAAMBAQEBAQEBAQEAAAAAAAABAgMEBQYHCAkKC//EALURAAIBAgQEAwQHBQQEAAECdwABAgMRBAUhMQYSQVEHYXETIjKBCBRCkaGxwQkjM1LwFWJy0QoWJDThJfEXGBkaJicoKSo1Njc4OTpDREVGR0hJSlNUVVZXWFlaY2RlZmdoaWpzdHV2d3h5eoKDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uLj5OXm5+jp6vLz9PX29/j5+v/aAAwDAQACEQMRAD8A9+opaSgArzvxT4l8UR+OV0DQJNOiRbEXTvdoWydxGBg1Ddp4g8Q/EfWtLs/E13pdpY28DokEasGL5znP0rGtNKv9K+LU9vf6vPqsraSGE0yKrKN5+XA4xQBq/wBofEr/AJ//AA//AN+X/wAaP7Q+JX/P/wCH/wDvy/8AjW7tb0NGxvQ0AYX9ofEr/n/8P/8Afl/8al0LxN4tj8dafoeuy6ZNBeW0swa1jZSpT6mtja3oa47XNNvdS+Jvh61stTm0yc2dwwuIVDMAOoweOaAPY6K8+uvB3ie3s5px8QNTJjjZ8GCPnAzWT4R0XxV4m8LWOsS+OtSge5QsY0gjIXkj+lAG3458SeINO8RaLo2gtZRy3ySuz3SFgNmPT61mf2h8Sv8An/8AD/8A35f/ABrJ1LRNT0j4meG11HXrrVzJBcbDPGq+XgDpj1rs9jehoAwv7Q+JX/P/AOH/APvy/wDjR/aHxK/5/wDw/wD9+X/xrd2t6GjY3oaAOeh8UeNdN8TaFZ6xPpM1pqVyYGFtEwZeM5yTXqdeO+NbO5vdb8JW1tdyWU8mokJcxqC0Z29QDXTf8IR4m/6KDqn/AIDx0Ad5XF/ELxFq+hRaRDov2YXWoXgt91ypZVBBOeK5fwhpfivxPpl1dy+OdRgMN5LbBUhjIIQ4B/Gqni7w9q+ka14Vl1DxNeatG+pqqxTxKoU7TzxQBsHUPiUCR9v8P/8Afl/8aP7Q+JX/AD/+H/8Avy/+NbzI248HrSbW9DQBhf2h8Sv+f/w//wB+X/xqlqPirx7oQsrnULjRZraW7it3SGJg2HOMjJrqtrehrkPiRDLL4btI45Ghd9St1WUDlCW6igD2GiuD/wCEI8Tf9FB1T/wHjrn/A вовведения?","faq":"Правильно ли я понимаю, что сначала был один автобус, а потом их стало десять?Да. Автобусов 10.","likes":70,"dislikes":10,"solve_percent":null,"solve_total":null,"date":"28.12.2010","comments":44},{"id":520,"title":"Три события","category":"Теория вероятностей","text":"Есть три попарно независимых события, которые не могут произойти одновременно. Каково максимальное произведение их вероятностей?","faq":"Два события называются независимыми, если появление любого из них не меняет вероятности второго.Фраза \"события, которые не могут произойти одновременно\" имеет стандартный в теории вероятностей смысл: их пересечение равно пустому множеству.Видимо имеется в виду что все три не могут произойти одновременно но любые два могут... ?Два могут.","likes":60,"dislikes":8,"solve_percent":null,"solve_total":null,"date":"03.07.2012","comments":60},{"id":507,"title":"Больше/меньше","category":"Теория вероятностей","text":"Оккупанты, известным только им образом, выбирают два различных вещественных числа и записывают их на двух бумажках. Затем предлагают Мегамозгу выбрать любую бумажку, посмотреть на написанное там число и угадать, больше число на другой бумажке или меньше. Докажите, что у Мегамозга есть стратегия, которая позволит ему угадать с вероятностью больше 50%.","faq":"1. О какой вероятности идет речь?Можно рассматривать вероятность со статистической точки зрения. Если оккупанты повторят испытание много-много раз, предлагая одну и ту же пару чисел разным мегамозгам (которые не могут общаться и не договаривались заранее), использующим одну и ту же стратегию, то более половины мегамозгов должны дать правильный ответ.2. Можно ли считать, что оккупанты загадывают числа случайным образом?Нельзя, это противоречит условию. Оккупанты могут выбирать числа как угодно: могут случайным образом, могут по детерминированному алгоритму.3. Знают ли оккупанты стратегию Мегамозга? Могут ли они ей противодействовать?Стратегия Мегамозга должна работать, даже если она известна оккупантам и они пытаются ей противодействовать.4. А решение вообще существует?Да, существует.5. Это задача именно по теории вероятностей?Да, решение чисто математическое. Никаких подвохов.","likes":101,"dislikes":16,"solve_percent":null,"solve_total":null,"date":"02.01.2012","comments":126},{"id":541,"title":"Угадайка","category":"Теория вероятностей","text":"Мегамозг угадывает число, выбранное случайным образом из натуральных чисел от 1 до 2014. После каждого неверного варианта ему сообщают: перебор или недобор. Называть можно только те числа, которые еще не исключили. Мегамозг выигрывает, если угадывает число с нечётной попытки. Сможет ли Мегамозг выигрывать с вероятностью большей 2/3?","faq":"1. Натуральные числа выбираются с равной вероятностью.2. Угадать означает назвать число и получить в ответ \"да\".","likes":59,"dislikes":10,"solve_percent":null,"solve_total":null,"date":"26.01.2013","comments":33},{"id":453,"title":"Очередь за спичками","category":"Теория вероятностей","text":"Сто мегамозгов стоят в очереди и хотят купить по коробку спичек по цене 50 коп. У 50 из них есть только по монете в 50 коп., а у других 50 есть только по монете в рубль. Найти вероятность, что продавец сможет выдать всем сдачу, если в начале в кассе денег нет.","faq":null,"likes":67,"dislikes":16,"solve_percent":null,"solve_total":null,"date":"02.08.2010","comments":42},{"id":678,"title":"Без пересечений","category":"Теория вероятностей","text":"Собака-киборг Мегамозга из задачи «Лабиринт» сломалась и теперь умеет бежать только на восток и на юг. Кроме того, направление она может менять, лишь пройдя целое число метров. В качестве развлечения Мегамозг запускает собаку через пустое поле размером N×N клеток. Она стартует из северо-западного угла поля и непременно заканчивает свой путь в юго-восточном, ведь там ее ждет хозяин. Все возможные пути собаки равновероятны. Какова вероятность, что во время двух таких запусков собака не пробежит дважды ни через одну клетку поля (не считая угловых)?","faq":"1. Стороны поля параллельны сторонам света.2. Земля плоская.3. Если траектории касаются в одной точке, но не пересекаются, это тоже \"запрещено\", так как они проходят через одну и ту же точку. В задаче же спрашивается о траекториях, которые имеют только две общие точки - точку старта и точку финиша в углах поля.4. Центр собаки перемещается между центрами клеток, т.е. в пределах квадрата (N-1)x(N-1) метров.","likes":15,"dislikes":4,"solve_percent":null,"solve_total":null,"date":"24.03.2017","comments":26}],"equivival":[{"id":184,"title":"Шпион","category":"Последовательности","text":"Американский шпион стоял под дверями русского центра и смотрел на проход русских агентов. Подходит первый русский агент, ему из дверей: «26», он в ответ: «13» — и прошел. Подходит второй русский агент, ему: «22», он в ответ: «11» — и прошел. Шпион все понял и пошел ко входу, ему: «20», он в ответ: «10» — шпиона арестовали. Что он должен был ответить, при условии что следующий русский агент в ответ на «100» сказал «3» и беспрепятственно прошел?","faq":null,"likes":657,"dislikes":102,"solve_percent":9,"solve_total":72349,"date":"11.04.2007","comments":113},{"id":197,"title":"Цифры в квадрате","category":"Последовательности","text":"Расположите числа от 1 до 9 в квадрате 3×3 (9 ячеек) так, чтобы суммы чисел в каждом ряду, столбце и диагоналях были одинаковыми.","faq":null,"likes":495,"dislikes":143,"solve_percent":10,"solve_total":72174,"date":"25.04.2007","comments":88},{"id":196,"title":"Кувшины с бусинами","category":"Последовательности","text":"Мегамозг-кладоискатель нашел 6 старинных кувшинов. К сожалению, в них оказались не сокровища, а всего лишь бусины. В первом кувшине оказалось 60 бусин, во втором — 30, в третьем — 20, в четвертом — 15. Сколько бусин было в пятом и в шестом кувшинах, если все эти 6 чисел образуют определенную закономерность?","faq":null,"likes":498,"dislikes":175,"solve_percent":10,"solve_total":72174,"date":"25.04.2007","comments":36},{"id":214, яина рыбки.Подсказки:Англичанин живет в красном доме.Швед держит собаку.Датчанин пьет чай.Зеленый дом находится по соседству слева от белого.Владелец зеленого дома любит пить кофе.Курильщик Pall Mall разводит птиц.Владелец желтого дома курит Dunhill.В центральном доме предпочитают молоко.Норвежец живет в первом доме.Курильщик Blend живет по соседству с любителем кошек.Хозяин лошадей живет рядом с тем, кто курит Dunhill.Любитель пива курит Bluemaster.Немец курит Prince.Норвежец живет рядом с синим домом.Сосед курильщика Blend пьет воду.","faq":null,"likes":597,"dislikes":49,"solve_percent":6,"solve_total":74332,"date":"27.11.2006","comments":103},{"id":181,"title":"Молоко, Лимонад, Вода и Квас","category":"Последовательности","text":"В бутылке, стакане, кувшине и банке находятся молоко, лимонад, квас и вода. Известно, что вода и молоко — не в бутылке, сосуд с лимонадом стоит непосредственно между кувшином и сосудом с квасом, в банке — не лимонад и не вода. Стакан стоит около банки и сосуда с молоком. Сосуды стоят в одну линию. Расставьте сосуды/жидкости в ряд.","faq":null,"likes":453,"dislikes":84,"solve_percent":6,"solve_total":72458,"date":"05.04.2007","comments":102},{"id":613,"title":"Что лишнее?","category":"Последовательности","text":"Какая фигура на картинке лишняя?","faq":null,"likes":418,"dislikes":93,"solve_percent":8,"solve_total":27420,"date":"19.07.2014","comments":23,"image":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4ge4SUNDX1BST0ZJTEUAAQEAAAeoYXBwbAIgAABtbnRyUkdCIFhZWiAH2QACABkACwAaAAthY3NwQVBQTAAAAABhcHBsAAAAAAAAAAAAAAAAAAAAAAAA9tYAAQAAAADTLWFwcGwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAtkZXNjAAABCAAAAG9kc2NtAAABeAAABWxjcHJ0AAAG5AAAADh3dHB0AAAHHAAAABRyWFlaAAAHMAAAABRnWFlaAAAHRAAAABRiWFlaAAAHWAAAABRyVFJDAAAHbAAAAA5jaGFkAAAHfAAAACxiVFJDAAAHbAAAAA5nVFJDAAAHbAAAAA5kZXNjAAAAAAAAABRHZW5lcmljIFJHQiBQcm9maWxlAAAAAAAAAAAAAAAUR2VuZXJpYyBSR0IgUHJvZmlsZQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAbWx1YwAAAAAAA
