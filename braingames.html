<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BrainGames — Коллекция головоломок</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600;7..72,700&family=JetBrains+Mono:wght@400;500&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0c0c0f;
  --bg-card:#16161a;
  --bg-card-hover:#1c1c22;
  --bg-sidebar:#111114;
  --border:#2a2a32;
  --border-active:#4a4a58;
  --text:#e8e6e3;
  --text-dim:#8b8a88;
  --text-muted:#5c5b59;
  --accent:#d4a853;
  --accent-glow:#d4a85322;
  --green:#5cb85c;
  --green-dim:#5cb85c33;
  --red:#c75050;
  --red-dim:#c7505033;
  --blue:#5b8fd4;
  --radius:10px;
  --radius-sm:6px;
  --font-display:'Outfit',sans-serif;
  --font-body:'Literata','Georgia',serif;
  --font-mono:'JetBrains Mono',monospace;
}
html{font-size:16px;scroll-behavior:smooth}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  line-height:1.65;
  min-height:100vh;
  overflow-x:hidden;
}
::selection{background:var(--accent);color:var(--bg)}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--border-active)}

/* === LAYOUT === */
.app{display:flex;min-height:100vh}
.sidebar{
  width:280px;min-width:280px;
  background:var(--bg-sidebar);
  border-right:1px solid var(--border);
  padding:24px 0;
  position:sticky;top:0;height:100vh;
  overflow-y:auto;
  display:flex;flex-direction:column;
  z-index:10;
}
.main{flex:1;padding:32px 40px;max-width:900px}
@media(max-width:900px){
  .sidebar{
    position:fixed;left:-300px;width:280px;
    transition:left .3s cubic-bezier(.4,0,.2,1);
    box-shadow:4px 0 30px #0005;
  }
  .sidebar.open{left:0}
  .main{padding:20px 16px;max-width:100%}
  .burger{display:flex!important}
  .sidebar-overlay{display:block!important}
}

/* === BURGER === */
.burger{
  display:none;position:fixed;top:16px;left:16px;z-index:20;
  width:42px;height:42px;border-radius:50%;
  background:var(--bg-card);border:1px solid var(--border);
  align-items:center;justify-content:center;cursor:pointer;
  transition:all .2s;
}
.burger:hover{border-color:var(--accent);background:var(--bg-card-hover)}
.burger svg{width:20px;height:20px;stroke:var(--text);fill:none;stroke-width:2}
.sidebar-overlay{
  display:none;position:fixed;inset:0;background:#000a;z-index:9;
  opacity:0;pointer-events:none;transition:opacity .3s;
}
.sidebar-overlay.active{opacity:1;pointer-events:auto}

/* === SIDEBAR CONTENT === */
.logo{
  padding:0 24px 20px;
  font-family:var(--font-display);
  font-weight:700;font-size:1.3rem;
  letter-spacing:-.02em;
  color:var(--accent);
  border-bottom:1px solid var(--border);
  margin-bottom:8px;
}
.logo small{display:block;font-size:.7rem;font-weight:400;color:var(--text-muted);margin-top:2px;letter-spacing:.05em;text-transform:uppercase}
.nav-section{padding:16px 16px 8px;font-family:var(--font-display);font-size:.65rem;font-weight:600;text-transform:uppercase;letter-spacing:.12em;color:var(--text-muted)}
.cat-btn{
  display:flex;align-items:center;gap:10px;
  width:100%;padding:10px 24px;
  background:none;border:none;cursor:pointer;
  font-family:var(--font-display);font-size:.88rem;font-weight:400;
  color:var(--text-dim);text-align:left;
  transition:all .15s;position:relative;
}
.cat-btn:hover{color:var(--text);background:#ffffff06}
.cat-btn.active{color:var(--accent);background:var(--accent-glow);font-weight:500}
.cat-btn.active::before{
  content:'';position:absolute;left:0;top:6px;bottom:6px;
  width:3px;background:var(--accent);border-radius:0 3px 3px 0;
}
.cat-btn .count{
  margin-left:auto;font-size:.72rem;font-family:var(--font-mono);
  color:var(--text-muted);min-width:22px;text-align:right;
}
.cat-btn .solved-count{
  font-size:.65rem;font-family:var(--font-mono);
  color:var(--green);opacity:.7;
}
.sidebar-footer{
  margin-top:auto;padding:16px 24px;border-top:1px solid var(--border);
}
.daily-btn{
  width:100%;padding:12px 16px;
  background:linear-gradient(135deg,var(--accent),#c4923a);
  color:var(--bg);font-family:var(--font-display);
  font-weight:600;font-size:.88rem;
  border:none;border-radius:var(--radius);cursor:pointer;
  transition:all .2s;letter-spacing:-.01em;
  box-shadow:0 2px 16px #d4a85344;
}
.daily-btn:hover{transform:translateY(-1px);box-shadow:0 4px 24px #d4a85366}
.daily-btn:active{transform:translateY(0)}

.stats-bar{
  margin-top:12px;padding:10px 0 0;
  font-family:var(--font-mono);font-size:.7rem;color:var(--text-muted);
  display:flex;align-items:center;gap:6px;
}
.stats-bar .progress-track{
  flex:1;height:4px;background:var(--border);border-radius:2px;overflow:hidden;
}
.stats-bar .progress-fill{height:100%;background:var(--green);border-radius:2px;transition:width .5s cubic-bezier(.4,0,.2,1)}

/* === HEADER === */
.page-header{margin-bottom:28px;display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
.page-title{
  font-family:var(--font-display);font-size:1.8rem;font-weight:700;
  letter-spacing:-.03em;color:var(--text);
}
.page-subtitle{font-size:.85rem;color:var(--text-muted);margin-top:4px}
.search-box{
  position:relative;flex-shrink:0;
}
.search-box input{
  width:260px;padding:10px 14px 10px 38px;
  background:var(--bg-card);border:1px solid var(--border);
  border-radius:var(--radius);color:var(--text);
  font-family:var(--font-body);font-size:.85rem;
  transition:border-color .2s;
}
.search-box input:focus{outline:none;border-color:var(--accent)}
.search-box input::placeholder{color:var(--text-muted)}
.search-box svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--text-muted);fill:none;stroke-width:2}

/* === PUZZLE CARD === */
.puzzle-list{display:flex;flex-direction:column;gap:16px}
.puzzle-card{
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:24px;
  transition:all .2s;
  position:relative;
  animation:fadeUp .4s cubic-bezier(.4,0,.2,1) both;
}
.puzzle-card:hover{border-color:var(--border-active);background:var(--bg-card-hover)}
.puzzle-card.solved{border-left:3px solid var(--green)}

@keyframes fadeUp{
  from{opacity:0;transform:translateY(12px)}
  to{opacity:1;transform:translateY(0)}
}

.card-top{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px}
.solve-check{
  flex-shrink:0;width:22px;height:22px;margin-top:2px;
  appearance:none;-webkit-appearance:none;
  border:2px solid var(--border-active);
  border-radius:5px;cursor:pointer;
  position:relative;transition:all .2s;
  background:transparent;
}
.solve-check:hover{border-color:var(--green)}
.solve-check:checked{border-color:var(--green);background:var(--green)}
.solve-check:checked::after{
  content:'✓';position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:700;color:var(--bg);
}

.card-title{
  font-family:var(--font-display);font-size:1.1rem;font-weight:600;
  letter-spacing:-.02em;color:var(--text);flex:1;
}

.card-meta{
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  font-size:.75rem;color:var(--text-muted);
  font-family:var(--font-mono);margin-bottom:14px;
}
.meta-item{display:flex;align-items:center;gap:4px}
.meta-item svg{width:14px;height:14px;stroke-width:2;fill:none}
.meta-likes svg{stroke:var(--green)}
.meta-dislikes svg{stroke:var(--red)}
.meta-solve{color:var(--blue)}
.meta-date{color:var(--text-muted)}

.card-text{
  font-size:.9rem;line-height:1.7;
  color:var(--text-dim);
  overflow:hidden;
  position:relative;
}
.card-text.collapsed{max-height:120px}
.card-text.collapsed::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:50px;
  background:linear-gradient(transparent,var(--bg-card));
  pointer-events:none;
}
.puzzle-card:hover .card-text.collapsed::after{
  background:linear-gradient(transparent,var(--bg-card-hover));
}
.expand-btn{
  display:inline-block;margin-top:8px;
  background:none;border:none;cursor:pointer;
  font-family:var(--font-display);font-size:.78rem;
  color:var(--accent);transition:color .2s;
}
.expand-btn:hover{color:#e8be6a}

.card-faq{
  margin-top:12px;padding:12px 16px;
  background:#1a1a1f;border-radius:var(--radius-sm);
  border-left:2px solid var(--accent);
  font-size:.82rem;color:var(--text-muted);line-height:1.6;
}
.card-img{
  display:block;max-width:100%;margin:14px 0 4px;
  border-radius:var(--radius-sm);border:1px solid var(--border);
}
.card-faq summary{
  cursor:pointer;font-family:var(--font-display);
  font-size:.75rem;font-weight:500;color:var(--accent);
  text-transform:uppercase;letter-spacing:.06em;
}

/* === DAILY MODAL === */
.modal-overlay{
  position:fixed;inset:0;background:#000c;z-index:100;
  display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .3s;
  padding:20px;
}
.modal-overlay.active{opacity:1;pointer-events:auto}
.modal{
  background:var(--bg-card);border:1px solid var(--border);
  border-radius:14px;padding:32px;max-width:600px;width:100%;
  max-height:80vh;overflow-y:auto;
  transform:scale(.95);transition:transform .3s cubic-bezier(.4,0,.2,1);
  box-shadow:0 24px 80px #000a;
}
.modal-overlay.active .modal{transform:scale(1)}
.modal-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:20px;
}
.modal-title{font-family:var(--font-display);font-size:1.3rem;font-weight:700;color:var(--accent)}
.modal-close{
  width:32px;height:32px;border-radius:50%;
  background:var(--border);border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  color:var(--text);font-size:1.1rem;transition:all .2s;
}
.modal-close:hover{background:var(--red);color:#fff}
.daily-nav-btn{
  width:32px;height:32px;border-radius:50%;
  background:var(--border);border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  color:var(--text);font-size:1rem;transition:all .2s;
}
.daily-nav-btn:hover{background:var(--accent);color:var(--bg)}

/* === EMPTY STATE === */
.empty-state{
  text-align:center;padding:60px 20px;
  color:var(--text-muted);
}
.empty-state .icon{font-size:3rem;margin-bottom:16px;opacity:.4}
.empty-state p{font-family:var(--font-display);font-size:1rem}

/* === SORT === */
.sort-bar{
  display:flex;align-items:center;gap:8px;margin-bottom:20px;flex-wrap:wrap;
}
.sort-btn{
  padding:6px 14px;background:var(--bg-card);border:1px solid var(--border);
  border-radius:20px;cursor:pointer;font-family:var(--font-display);
  font-size:.75rem;color:var(--text-dim);transition:all .15s;
}
.sort-btn:hover{border-color:var(--border-active);color:var(--text)}
.sort-btn.active{border-color:var(--accent);color:var(--accent);background:var(--accent-glow)}

/* === KATEX FIX === */
/* === SOLVED VIEW === */
.solved-stats{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:12px;margin-bottom:24px;
}
.stat-card{
  background:var(--bg-card);border:1px solid var(--border);
  border-radius:var(--radius);padding:16px;text-align:center;
}
.stat-card .stat-value{
  font-family:var(--font-display);font-size:1.6rem;font-weight:700;
  color:var(--accent);
}
.stat-card .stat-label{
  font-size:.72rem;color:var(--text-muted);margin-top:2px;
  font-family:var(--font-display);text-transform:uppercase;letter-spacing:.06em;
}
.solved-item{
  display:flex;align-items:center;gap:14px;
  padding:14px 18px;background:var(--bg-card);
  border:1px solid var(--border);border-radius:var(--radius);
  border-left:3px solid var(--green);
  transition:background .15s;
}
.solved-item:hover{background:var(--bg-card-hover)}
.solved-item .si-title{
  font-family:var(--font-display);font-size:.92rem;font-weight:500;
  color:var(--text);flex:1;
}
.solved-item .si-cat{
  font-size:.7rem;color:var(--text-muted);font-family:var(--font-mono);
}
.solved-item .si-date{
  font-size:.72rem;color:var(--text-muted);font-family:var(--font-mono);
  white-space:nowrap;
}
.solved-item .si-remove{
  background:none;border:none;cursor:pointer;
  color:var(--text-muted);font-size:.85rem;padding:4px;
  border-radius:4px;transition:all .15s;
}
.solved-item .si-remove:hover{color:var(--red);background:var(--red-dim)}
.solved-timeline-date{
  font-family:var(--font-display);font-size:.78rem;font-weight:600;
  color:var(--text-muted);padding:8px 0 4px;
  text-transform:uppercase;letter-spacing:.04em;
}

.katex{font-size:1em!important}
.katex-display{margin:.5em 0!important}
</style>
</head>
<body>

<button class="burger" onclick="toggleSidebar()" aria-label="Меню">
  <svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
</button>
<div class="sidebar-overlay" onclick="toggleSidebar()"></div>

<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="logo">BrainGames<small>Коллекция головоломок</small></div>
  <div class="nav-section">Категории</div>
  <nav id="cat-nav"></nav>
  <div class="nav-section" style="margin-top:8px">Прогресс</div>
  <button class="cat-btn" id="solved-nav-btn" onclick="showSolvedView()">
    <span>✅ Решённые</span><span class="count" id="solved-nav-count">0</span>
  </button>
  <div class="sidebar-footer">
    <button class="daily-btn" onclick="showDaily()">&#9733; Задача дня</button>
    <div class="stats-bar">
      <span id="stats-text">0 / 0</span>
      <div class="progress-track"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
    </div>
  </div>
</aside>

<main class="main">
  <div class="page-header">
    <div>
      <h1 class="page-title" id="page-title">Логика</h1>
      <div class="page-subtitle" id="page-subtitle">72 задачи</div>
    </div>
    <div class="search-box">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="search" placeholder="Поиск задачи...">
    </div>
  </div>
  <div class="sort-bar" id="sort-bar">
    <button class="sort-btn active" data-sort="default">По умолчанию</button>
    <button class="sort-btn" data-sort="likes">По лайкам</button>
    <button class="sort-btn" data-sort="difficulty">По сложности</button>
    <button class="sort-btn" data-sort="date">По дате</button>
  </div>
  <div class="puzzle-list" id="puzzle-list"></div>
</main>
</div>

<div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal-content"></div>
</div>

<script>
const DATA = {"logic":[{"id":786,"title":"Деревня енотов","category":"Логика","text":"В деревне мегамозгов есть $N$ домов, на каждом доме висит номерной знак. В деревню повадилась ходить стая из $M$ енотов ($M \\le N$). Каждую ночь еноты приходят и переставляют номера домов, причем делают это циклически, так что второй енот вешает номер на дом с которого взял номер первый, третий вешает номер на обобранный вторым дом, и т.д. - первый вешает на дом, с которого взял последний енот.Мегамозги давно забыли про номера и никто кроме енотов их не переставляет. При каких $N$ и $M$ может случиться так, что в один прекрасный день все номера домов кроме двух будут висеть правильно?","faq":"1. каждую ночь еноты могут выбирать разный набор домов для перестановки их номеров.2. можно считать, что все еноты сначала дружно снимают по номеру с разных домов, а потом дружно вешают их на новые места.","likes":7,"dislikes":1,"solve_percent":11,"solve_total":84,"date":"01.04.2026","comments":17},{"id":827,"title":"Тетримино","category":"Логика","text":"Минимозг нарисовал на бумаге в клетку квадрат 7х7 и разбил его на фигуры двух типов: уголки из трех клеток и зигзаги из четырех. Сколько могло получиться зигзагов?","faq":"1. Допустимы оба вида зигзагов в одном разбиении: и \"левые\", и \"правые\".2. Каждая клетка квадрата должна принадлежать ровно одной фигуре.x - уголокz - зигзагx x 0 0 0 0 0x 0 0 0 0 0 00 0 0 0 0 0 00 0 0 0 0 0 0z z 0 0 0 z 00 z z 0 0 z z0 0 0 0 0 0 z","likes":28,"dislikes":1,"solve_percent":3,"solve_total":959,"date":"12.03.2024","comments":11},{"id":21,"title":"Музей лжи","category":"Логика","text":"При входе в Музей лжи стоят три вазы, на одной из которых написано «Черные», на второй — «Белые», на третьей — «Черные и белые». В одной из них лежат черные шары, в другой — белые, в оставшейся — и черные, и белые. Все надписи заведомо ложны. Как определить содержимое каждой вазы, достав только один шар?","faq":null,"likes":1192,"dislikes":110,"solve_percent":17,"solve_total":75611,"date":"22.09.2006","comments":89},{"id":149,"title":"Сторож","category":"Логика","text":"Как-то раз Мегамозг работал сторожем на складе. После дежурства он подошел к владельцу склада и сказал ему, что он часто видел вещие сны и что только что ему приснился сон, что склад завтра попытаются ограбить!!! Владелец недолго думая решил проверить и на следующий день вызвал милицию, и действительно склад пытались ограбить, однако милиция задержала воров. На следующий день владелец склада дал Мегамозгу 10000$ и сразу же уволил его. Почему?","faq":null,"likes":795,"dislikes":153,"solve_percent":12,"solve_total":73757,"date":"16.01.2007","comments":47},{"id":187,"title":"Трехтомник","category":"Логика","text":"На полке стоит трехтомник великого русского писателя. Толщина каждой обложки 1 мм, толщина всех страниц каждого тома 3 см. Книжный червь грызет книги от первой страницы первого тома до последней страницы последнего тома. Какой путь прогрызет червь?","faq":null,"likes":719,"dislikes":142,"solve_percent":8,"solve_total":72262,"date":"18.04.2007","comments":143},{"id":139,"title":"Равенство из спичек","category":"Логика","text":"На столе спичками выложено «равенство» XI+I=X. Как сделать его верным, не дотрагиваясь ни до одной спички? Спички нельзя поджигать, перемещать, добавлять, убирать, ломать и т.п. Нельзя использовать дополнительные предметы.","faq":null,"likes":967,"dislikes":209,"solve_percent":18,"solve_total":74054,"date":"18.12.2006","comments":183},{"id":241,"title":"Дуэль на стаканах","category":"Логика","text":"В местности, где жил Мегамозг, было 20 родников с удивительной водой. Родники пронумерованы от 1 до 20. Удивительные свойства их воды в том, что внешне (цвет, вкус, запах) она не отличается от обычной, но если такую воду выпить, то через некоторое время (в течение суток) умрешь, а чтобы спастись, нужно выпить воды из родника с бОльшим номером. Таким образом, вода из родника №20 является лекарством ко всем остальным, но от неё уже лекарства нет.Появились в этой местности подлые оккупанты, захватили источник №20 под свой контроль и стали терроризировать местное население. Мегамозг вызвал главного оккупанта на дуэль по следующим правилам: в полдень противники встречаются на площади с заранее заготовленными стаканами воды, обмениваются ими, выпивают то, что им дали, и расходятся. Кого на следующий день хоронят — тот проиграл.Главный оккупант знает, что вода №20 доступна лишь ему — она и самая смертельная, и самое сильное лекарство. Но по результатам дуэли оказалось, что Мегамозг остался жив, а оккупант — нет. Как действовал Мегамозг, чтобы выжить и победить (в рамках правил)? Дуэль проходила честно, воду действительно выпили, смешивать воду и подмешивать что-либо еще нельзя.","faq":null,"likes":698,"dislikes":156,"solve_percent":9,"solve_total":70034,"date":"17.09.2007","comments":171},{"id":138,"title":"Лестница в воде","category":"Логика","text":"Рядом с берегом стоит корабль со спущенной на воду стальной лестницей. У лестницы 10 ступенек. Расстояние между ступеньками 30 см. Самая нижняя ступенька касается поверхности воды. Океан сегодня очень спокоен, но начинается прилив, который поднимает воду за час на 15 см. Через сколько времени покроется водой третья ступенька лестницы?","faq":null,"likes":873,"dislikes":203,"solve_percent":15,"solve_total":74055,"date":"18.12.2006","comments":76},{"id":171,"title":"Часы с боем","category":"Логика","text":"Мегамозг пришел навестить своего друга, у которого было двое часов с боем. Часы начали бить одновременно (т. е. первый удар они сделали одновременно), одни били через каждые 1,5 секунды, а другие — через 2. Мегамозг слышит совпадающие удары как слитный. Всего он насчитал 8 ударов. Во сколько часов это произошло?","faq":null,"likes":537,"dislikes":156,"solve_percent":10,"solve_total":72762,"date":"15.03.2007","comments":72},{"id":62,"title":"Жестокий закон","category":"Логика","text":"Жил некогда жестокий правитель, который не желал никого впускать в свои владения. У моста через пограничную реку был поставлен часовой, вооружённый с головы до ног, и ему было приказано спрашивать каждого путника: «Зачем идёшь?» Если путник говорил неправду, часовой обязан был схватить его и тут же повесить. Если же путник говорил правду, часовой должен был немедленно утопить его в реке. Таков был суровый закон правителя, и неудивительно, что никто не решался приблизиться к его владениям. Нашёлся, однако, Мегамозг, который, несмотря на это, спокойно подошёл к охраняемому мосту у запретной границы. «Зачем идёшь?» — сурово остановил его часовой, готовясь казнить смельчака. Но ответ был таков, что озадаченный часовой, строго исполняя жестокий закон, ничего не мог поделать с Мегамозгом. Что это мог быть за ответ?","faq":null,"likes":585,"dislikes":182,"solve_percent":11,"solve_total":74392,"date":"23.11.2006","comments":79},{"id":309,"title":"Татуировка","category":"Логика","text":"Мегамозг решил сделать себе на спине татуировку в виде мозга. В городе было всего два тату-салона. Взглянув в один из салонов через витрину, Мегамозг ужаснулся: на столах пыль, на полу валялись использованные инструменты и краски, сам мастер-татуировщик ходил с некрасивыми татуировками во всех местах, которые только можно было придумать. Заглянув в другой салон, Мегамозг увидел идеальную чистоту, новенькие краски и инструменты, а сам мастер-татуировщик ходил с обалденной татуировкой на все тело в виде дракона.Но что-то в этом салоне Мегамозгу не понравилось, и он решил сделать себе татуировку в первом салоне. Почему?","faq":null,"likes":632,"dislikes":202,"solve_percent":12,"solve_total":67176,"date":"15.04.2008","comments":39},{"id":268,"title":"Гонка на колясках","category":"Логика","text":"Два развлекающихся джентльмена вздумали устроить гонку, в которой, чья упряжка пересечет финишную линию первой, тот и проиграл, чья второй, тот и выиграл. Они прошли почти всю дистанцию, взмыливая своих лошадей, но, по мере того как финиш приближался, оба замедляли темп и совсем остановились примерно в 100 метрах от черты. Понимая, что пари начинает выглядеть глупым, два седока сошли с колясок и отправились обсудить это дело с Мегамозгом, который наблюдал за ними. Когда Мегамозг услыхал всю историю, то дал им один совет, который позволил им быстро и с интересом закончить состязание. Что посоветовал Мегамозг?","faq":null,"likes":448,"dislikes":171,"solve_percent":9,"solve_total":68489,"date":"29.11.2007","comments":29},{"id":290,"title":"Мегамозг-избиратель","category":"Логика","text":"«Ну кто придумал, что голосовать на парламентских выборах можно с 18 лет? Из-за этого я позавчера не смог голосовать! — сидел и сокрушался молодой Мегамозг. — Успокаивает только то, что, хотя на президентских выборах можно голосовать с 20, в следующем году я все-таки буду выбирать президента». Как такое может быть?","faq":null,"likes":423,"dislikes":205,"solve_percent":9,"solve_total":67596,"date":"27.02.2008","comments":31},{"id":153,"title":"Хомяки","category":"Логика","text":"Однажды мама-мегамозг и папа-мегамозг пообещали купить младшему сыну-мегамозгу хомяка и отправились всей семьей в магазин. Младший сын, увидев хомяков, воскликнул: «Их здесь более 50 штук, выбирать будет очень сложно!» Старший сын ответил: «Не бойся, их здесь меньше 50». — «Самое главное, что здесь есть как минимум один», — сказала мама. «Интересно, — сказал папа, — что из всех трех предыдущих фраз только одна верная». Сколько было хомяков в магазине, учитывая то, что сыну купили одного?","faq":null,"likes":461,"dislikes":235,"solve_percent":10,"solve_total":73697,"date":"19.01.2007","comments":54},{"id":143,"title":"50 монет","category":"Логика","text":"Однажды Мегамозга в гости пригласил царь, который во время беседы решил проверить его сообразительность. Мегамозга отвели в абсолютно темную комнату и дали ему следующее задание. В этой комнате на столе лежит 50 монет. 10 из них лежат орлом вверх. Монеты абсолютно одинаковые. На ощупь орел и решка неотличимы. Необходимо разделить монеты на две группы так, чтобы в каждой группе было одинаковое количество монет, лежащих орлом вверх.","faq":null,"likes":1012,"dislikes":17,"solve_percent":6,"solve_total":74006,"date":"22.12.2006","comments":145},{"id":61,"title":"Вино и вода","category":"Логика","text":"В одной бутылке литр вина, в другой — литр воды. Из первой бутылки во вторую перелили ложку вина, а затем из второй в первую — ложку получившейся неоднородной смеси. Эти действия повторили несколько раз. Чего теперь больше: воды в первой бутылке, или вина во второй?","faq":null,"likes":480,"dislikes":38,"solve_percent":5,"solve_total":74392,"date":"23.11.2006","comments":88},{"id":713,"title":"Русский – Английский","category":"Логика","text":"Даны два столбца слов и словосочетаний.РусскийАнглийскийСловоБукваСочетание словСловосочетаниеДесять буквДесять звуковСуществительноеГлаголТрехсложныйЧетырехсложныйИзвестно, что все слова и словосочетания левого столбца обладают некоторым свойством Х, а все слова и словосочетания правого столбца им не обладают. Постарайтесь определить, что это за свойство.","faq":null,"likes":125,"dislikes":17,"solve_percent":5,"solve_total":9841,"date":"08.02.2020","comments":25},{"id":395,"title":"Ложные утверждения","category":"Логика","text":"Перед вами пять утверждений, три из которых являются ложными. 1+2=3. 2+3=5. 3+5=9. 5+9=14. 9+14=21. Найдите ложные утверждения.","faq":null,"likes":460,"dislikes":148,"solve_percent":5,"solve_total":63080,"date":"31.03.2009","comments":96},{"id":207,"title":"Подарки на дни рождения","category":"Логика","text":"Василий родился в Москве в тяжёлые послевоенные годы. Он с раннего детства мечтал о подарках на день рождения, но получил свои первые 8 подарков лишь в день, когда ему исполнилось 8 лет. В последующие дни рождения он получал столько подарков, сколько лет ему исполнялось. В свой 12-й день рождения Василий поехал в Санкт-Петербург, чтобы навестить своих маленьких внуков, и в этот день подарков не получил. Сколько всего подарков получил Василий к этому времени?Примечание: сам момент рождения днём рождения не считаем.","faq":null,"likes":241,"dislikes":134,"solve_percent":4,"solve_total":71776,"date":"28.05.2007","comments":64},{"id":757,"title":"КУБ и ШАР","category":"Логика","text":"ШАР является кубом. Почему КУБ кубом не является?В этой задаче нужно угадать ответ.","faq":null,"likes":36,"dislikes":25,"solve_percent":5,"solve_total":3827,"date":"31.03.2022","comments":13},{"id":809,"title":"Косплей","category":"Логика","text":"На доске 12х12 стоят 12 ладей так, что ни одна из них не бьет ни одну другую. Всегда ли можно их переставить так, чтобы каждая ладья была передвинута ходом коня, но все равно ни одна не била никакую другую?","faq":"1. Расстановка ладей произвольная.2. Каждую ладью нужно передвинуть ровно один раз.3. Важны только начальная и конечная расстановки. Можно считать, что ладьи передвигаются одновременно.","likes":25,"dislikes":1,"solve_percent":2,"solve_total":2741,"date":"12.11.2022","comments":14},{"id":657,"title":"Белые кубики и черная краска","category":"Логика","text":"У Васи есть 27 маленьких белых кубиков, из которых он хочет сложить белый куб 3х3х3. А у Пети есть чёрная краска, с помощью которой он хочет помешать Васе, испачкав некоторые грани кубиков. Какое минимальное число граней должен испачкать Петя, чтобы Вася не смог осуществить задуманное? А если кубиков тысяча и Вася хочет сложить куб 10х10х10? Доказательство минимальности не требуется.","faq":null,"likes":168,"dislikes":13,"solve_percent":3,"solve_total":18902,"date":"17.07.2016","comments":17},{"id":615,"title":"Монеты в ряд","category":"Логика","text":"На столе лежит ряд из 100 монет. Нужно за 50 ходов сделать 50 столбиков по две монеты.За один ход разрешается перепрыгнуть одной монетой ровно через две (не важно, лежащих рядом или друг на друге), и приземлиться на другой одиночной монете.","faq":"Например, был ряд:111111111...прыгнули направо первой монетой:_11211111...прыгнули направо третьей монетой:_1_221111...прыгнули налево девятой монетой:_1_22211_...","likes":76,"dislikes":8,"solve_percent":2,"solve_total":10614,"date":"21.10.2019","comments":20},{"id":170,"title":"Пари","category":"Логика","text":"Один мегамозг предложил другому пари. Он пишет на бумажке некоторое предсказание, которое в течение часа либо сбудется, либо нет. Бумажку запечатывает в конверт, не показывая второму. После этого второй пишет на другой бумажке одно слово — «да» или «нет». Через час конверт вскрывается, и если второй угадал, исполнилось ли предсказание, он получает от первого 1000 мозгобаксов, а если не угадал — отдает ему 1 мозгобакс. Что за предсказание написал первый?","faq":null,"likes":323,"dislikes":41,"solve_percent":3,"solve_total":72768,"date":"15.03.2007","comments":65},{"id":743,"title":"В столицу","category":"Логика","text":"В Мозголяндии 2015 городов и довольно много дорог, соединяющих города. Так, из столицы выходит 21 дорога, из Оченьдалекозадвинутовска выходит всего одна дорога, а из всех остальных городов выходит ровно по 14 дорог. Житель Оченьдалекозадвинутовска очень хочет попасть по дорогам в столицу. Может ли он быть уверен, что у него это получится?","faq":null,"likes":57,"dislikes":11,"solve_percent":2,"solve_total":8935,"date":"16.06.2020","comments":23},{"id":516,"title":"Фрукты на дорожку","category":"Логика","text":"Провожая Мегамозга домой, любимая бабушка приготовила внуку ящик с фруктами. Там были яблоки, груши и сливы. Если вытащить из ящика любые 100 фруктов, среди них обязательно будут яблоки и груши. Какое наибольшее количество фруктов могла положить в ящик бабушка?","faq":"1. Сливу считайте фруктом :)2. В ящике было как минимум одно яблоко, одна груша и одна слива.3. Вместимость ящика бесконечна.4. Какие бы 100 фруктов ни вытащили, среди них обязательно найдётся минимум одно яблоко и одна груша. Не исключено, что среди них будут и сливы.","likes":314,"dislikes":69,"solve_percent":4,"solve_total":43815,"date":"03.04.2012","comments":34},{"id":562,"title":"Неправильная дробь","category":"Логика","text":"Переложите одну спичку так, чтобы изображенное на рисунке равенство выполнялось с точностью до 0,01.","faq":null,"likes":260,"dislikes":57,"solve_percent":3,"solve_total":32317,"date":"31.05.2013","comments":53,"image":"data:image/gif;base64,R0lGODlhzQEcAYQXAJQpAJYsAJgwAJk0AZ4+EaRIHqdOJqFLKq1bNalfSLVrSLN+d4CAgL+WlMihmdm0ota7uODgucDAwOHR0eHT0///zP//4P///////////////////////////////////yH+EUNyZWF0ZWQgd2l0aCBHSU1QACH5BAEKAB8ALAAAAADNARwBAAX+4CeOZGmeaKqubOu+cCzPdG3feK7vfO//wKBwSCwaj8ikcslsOp/QqHRKrVqv2Kx2y+16v+CweEwum8/otHrNbrvf8Lh8Tq/b7/i8fs/v+/+AgWUPCgICCg+CiouMWAiGkAEGOoSGiDuVh4mNnJ1tDwIJDZACAJs2j6SSOamRk56wsWOFEBOkhzegoqSmuaGjkL2yw8RZhhQOtwM3tLakCswCtbfQxdbXUIYLB8o3x8mkyzbf3djmTwiEaunVOrfh3gLb5TXa3PDnnYiTp06FCaRg7PvQr8m/gDkKvcM1bqEAcfUcQsy36JCAAMKe/APGkIVFjAWZbITUzsaDAu/+CISMofBdyRktqVFclAlfk2MTnF1kURPSxCU4dQbQEdMSjpMpV8JAekvlTEUSnUBaAA7SqxRRb2qrauiqDQYWKoitEIFBQpdnZT4N9CiBTp8GHQpQKqLtW0M/kRQlRRcG2LFkzeL4O7ZsDsJiDa8FBGqaWiVMF74s0fhuxySR0Q4OW1jwDcSBD3NO7HlxHwWFKNyD5HTJXrwrUAtQ3bSvkNcPdYBW/Hl06M2AeZvuo02zErBZVRR/nAT5wrw0dpeuIV108OnD9zgUfoQwc+ULuRvx/mxHdeCdrafP7mdhYOxDQBtSORmF+7LwhcgXQN+8b/EznNfbdez9wRSBSOz+FkF9Khy4Xnf/LdiDgF/9l18MFBa4hwIKXugDaL+x1CGEgIXoH4IDPlghihryASKAPzAgnYcqvEijeTN+aKF6pPFoYot72FiEkNT59iMQRE64I3o9MnkkkHiAtaR+FkwZXZUsIomlijxkeGWWX3IJZR5JalkijH4ZiaZuat4YZpMpwrmimGPeIaOFbr4pJ3U5mgnmiXTK4GWAVtZJZptBjOjjk2wGt2acjGJYqJ6PGiqHokqemacLmHaJaKKTEvqnoKFaWkeZuvXZ6KhfqRpjqZKymqaspl76KaCBzpmrnpGuuielm9YIa622DkuqsVcim6aykFbawqCk0kosHKj+6vqrr9fy6myzwaYAbay7Tkutq0Vqmii52nYLrI/brvCtuHFUK2inOpr7Gb1+ZguuvrOGC+8b+O7LL7YRtIuCvK9K+yyz7jL8rxoIc7olaepGq7C3E783nsMYX9ywxw9DfKvF/mLb68cgc8tuxSa8G7IbUl5XccQ64ilqyio7aXDHJb+8Bs0892zyziIAnanQwuJ8gss+s3Gno90aPWHASSttLdFLc3yw1k2XIfUITxeGNaQnlxB2YmOXi3TQZS9sdddjfP2B3EcLTTfBLJvNdct7wy3G1zF3ljfZ2wZO8XF9k8C022v77fXIbLcNqr0oN77y5ToP7vgXhmtcteX+ntr8+cCTg67324onvjnnbXpIdYKQ8w01E4uzUHvlkq9uxtlkoXk3kq//jmvuo6edOuq6e4Ew7/hJsTy6JJp+vPRgq558F/IKXzqd2uONec7Xx5uxeJ0b/+qk5Wue+fdXqx/+Fqh2v/2e8rOvNumM4/++1 QTsvglcvfF7wf5rvxh8vnJEdFNHu3y7rc0hug7Mwuu7wS7swh18vt07NyR8w74ruXLEeyicwmarUupbwPMLvzMMuvW7wB+cwUbsuAdMwBhcuqmUe1TptX4rwEJsugPswQ8suKKLUFpcxAEcvER8xVgMwYFawT6Ht8chnofBxvCEw2pMBO4pxTgwx/DJX0Ecx8sHxXrcx378x4AcyII8yIRcyIZ8yIicyIq8yIzcyI78yHUSAgA7"},{"id":670,"title":"Найди число","category":"Логика","text":"Подлые оккупанты снова поймали двух мегамозгов и дали им такую задачу. В комнате на столе стоят 100 бутылок в ряд, в каждой бутылке - одно число от 1 до 100, все числа разные. В комнату заходит первый мегамозг. Он имеет право посмотреть содержимое всех бутылок и, если посчитает нужным, поменять местами любые две бутылки. После этого он уходит. Затем в комнату приглашается второй мегамозг. Ему называют произвольное число от 1 до 100, и он должен найти это число, открыв не более 50 бутылок. В лучших традициях жанра, мегамозги придумали стратегию и не были пущены на колбасу. О чём же они договорились?","faq":"1. Можно считать, что места бутылок в ряду пронумерованы.2. Первый ММ не общается со вторым после посещения комнаты.3. Первый ММ не знает, какое число будет искать второй.4. Найти число - значит открыть бутылку, в которой оно есть, а не просто логическим путем узнать, что оно там.","likes":101,"dislikes":2,"solve_percent":2,"solve_total":11176,"date":"28.07.2019","comments":36},{"id":240,"title":"Муравьи на палочке","category":"Логика","text":"У Мегамозга-биолога есть палочка длиной 10 см, на которую он сажает муравьев и наблюдает за ними. Муравьи могут по ней бегать только по длине (влево или вправо); когда доходят до конца, они падают вниз. Когда два муравья сталкиваются, оба сразу разворачиваются и бегут в противоположные стороны. Палочка узкая, и муравьи не могут обойти друг друга, не сталкиваясь. Скорость муравья 1 см в секунду, муравьи двигаются все время. Через какое минимальное время палочка гарантированно останется без муравьев? Начальное количество муравьев, их позиции и направления движения могут быть любыми. Длиной муравья можно пренебречь (считать равной нулю).","faq":null,"likes":285,"dislikes":9,"solve_percent":1,"solve_total":70302,"date":"04.09.2007","comments":59},{"id":251,"title":"Мышка и сыр","category":"Логика","text":"Мышка грызет кусок сыра, состоящий из 27 кубиков (как кубик Рубика). Съедая один кубик, она последовательно переходит на один из соседних с ним. Получится ли у нее съесть все кубики, кроме центрального?","faq":null,"likes":203,"dislikes":6,"solve_percent":1,"solve_total":69678,"date":"03.10.2007","comments":47},{"id":353,"title":"Квадрат 5х5","category":"Логика","text":"Какое наименьшее количество клеток квадрата 5×5 нужно закрасить, чтобы в любом квадрате 3×3, являющемся его частью, было ровно 4 закрашенных?","faq":null,"likes":233,"dislikes":8,"solve_percent":1,"solve_total":64542,"date":"10.12.2008","comments":33},{"id":121,"title":"Совет директоров","category":"Логика","text":"Шесть мегамозгов входят в совет директоров компании, которая получила прибыль в виде 100 акций стоимостью 1 млн. долларов каждая. Среди директоров есть линейная иерархия: от самого главного до самого «младшего». Прибыль делится следующим образом: главный директор предлагает, кому сколько дать акций, потом каждый голосует, «за» или «против». Если по меньшей мере половина директоров проголосует «за», они поделят акции так, как предложил главный, если же нет — главный мегамозг исключается из совета директоров, главным становится следующий по иерархии и делёжка начинается с начала по тому же принципу. Процесс продолжается до тех пор, пока какой-то план не будет принят. Как должен предложить разделить 100 акций главный мегамозг, чтобы получить максимальную прибыль? (Все мегамозги жадные, мыслят очень логично, и никто не хочет терять место в совете директоров).","faq":"Приоритеты директоров такие:1. остаться в совете;2. получить как можно больше денег;3. убрать старшего, чтобы самому приблизиться к должности главного.","likes":262,"dislikes":10,"solve_percent":1,"solve_total":74120,"date":"14.12.2006","comments":93},{"id":226,"title":"Хамелеоны","category":"Логика","text":"На острове живут 13 желтых, 15 синих и 17 красных хамелеонов. Когда встречаются два хамелеона разного цвета, они перекрашиваются в третий цвет. В остальных случаях ничего не происходит. Может ли случиться так, что все хамелеоны окажутся одного цвета?","faq":null,"likes":263,"dislikes":12,"solve_percent":2,"solve_total":71249,"date":"11.07.2007","comments":32},{"id":592,"title":"Картошка в мундире","category":"Логика","text":"Готовя на ужин картошку в мундире, Мегамозг задумался, всегда ли на двух произвольных картофелинах найдутся одинаковые замкнутые кривые. А вы как думаете?","faq":null,"likes":178,"dislikes":8,"solve_percent":1,"solve_total":29627,"date":"29.12.2013","comments":34},{"id":787,"title":"Мозаика — 2","category":"Логика","text":"Мегамозг хочет склеить мозаику размером 6x6 из 18 доминошек. Мозаика получится хрупкой, если границы склейки образуют хотя бы один отрезок, соединяющий ее противоположные стороны. Сможет ли Мегамозг сделать мозаику, которая не будет хрупкой?","faq":null,"likes":42,"dislikes":2,"solve_percent":2,"solve_total":6022,"date":"29.04.2021","comments":6},{"id":315,"title":"Рыцари, драконы и принцессы","category":"Логика","text":"В волшебной стране жили мужественные рыцари, свирепые драконы и прекрасные принцессы. Рыцари убивают драконов, драконы съедают принцесс, а принцессы изводят до смерти рыцарей. Всего было 100 рыцарей, 99 принцесс и 101 дракон. Древнее заклинание, наложенное на всех, запрещает убивать тех, кто погубил нечетное число жертв. В настоящее время в этой стране остался всего один житель. Кто это и почему?","faq":null,"likes":195,"dislikes":13,"solve_percent":1,"solve_total":67049,"date":"28.04.2008","comments":36},{"id":456,"title":"Охрана","category":"Логика","text":"Мегамозгу нужно расставить охранников охранять небольшой объект так, чтобы ни к объекту, ни к охранникам не смогли бы незаметно подкрасться оккупанты (нейтрализовать охранника можно с расстояния не более 1 метра). Какое минимальное число охранников необходимо расставить Мегамозгу, если каждый охранник стоит неподвижно и видит на 100 метров строго вперед? Доказательство минимальности не требуется.","faq":null,"likes":268,"dislikes":20,"solve_percent":2,"solve_total":57061,"date":"14.08.2010","comments":40},{"id":756,"title":"Мегамозг и фокусник","category":"Логика","text":"Как-то Мегамозг поспорил со своим другом, фокусником, что сможет того удивить. Для этого он попросил у фокусника колоду из 52 карт. За пару минут Мегамозг переставил их в нужном ему порядке, а затем предложил другу вытащить и забрать себе одну карту так, чтобы Мегамозг ничего не увидел.«У карты, которую ты вытащил, есть двойник — карта того же номинала и цвета, но другой масти, — обратился Мегамозг к другу. — Я не имею никакого представления о том, какую карту ты вытащил. Это может быть любая из 52 карт, а значит, ее двойником может быть любая из оставшихся в колоде. Однако, сейчас я переверну всего лишь несколько карт, и двойник обязательно окажется среди них».Какое минимальное число карт нужно перевернуть Мегамозгу, чтобы фокус гарантированно удался? Доказательство минимальности не требуется.","faq":"1. Колода обычная: 4 масти и 13 номиналов.2. Фокусник молчит до тех пор, пока Мегамозг не вытащит все карты, которые посчитает нужными.","likes":30,"dislikes":4,"solve_percent":1,"solve_total":3995,"date":"12.03.2022","comments":11},{"id":738,"title":"Друзья в доме","category":"Логика","text":"В доме проживает 200 человек. Некоторые из них дружат между собой. Количество пар друзей в любой тройке жителей дома — нечетное число. Какое наименьшее возможное количество пар друзей среди жителей этого дома?","faq":null,"likes":40,"dislikes":6,"solve_percent":1,"solve_total":8677,"date":"21.07.2020","comments":9},{"id":531,"title":"Вписанные многоугольники","category":"Логика","text":"На окружности расставили 2012 черных точек и одну белую. Среди множества всех многоугольников с вершинами в этих точках каких будет больше: с белой точкой или без нее?","faq":null,"likes":138,"dislikes":23,"solve_percent":1,"solve_total":36403,"date":"06.12.2012","comments":30},{"id":292,"title":"Гора","category":"Логика","text":"Мегамозг решил забраться на гору. Он запустил таймер и начал восхождение с самой нижней ее точки. Достигнув вершины, Мегамозг запустил таймер снова и спустился на первоначальную высоту с другой стороны горы. Всегда ли найдется момент времени (показание таймера) во время подъема и спуска, при котором Мегамозг находится на одной и той же высоте?","faq":null,"likes":239,"dislikes":43,"solve_percent":2,"solve_total":67541,"date":"03.03.2008","comments":39},{"id":760,"title":"Муравейник","category":"Логика","text":"Муравейник представляет из себя замощенный равными правильными треугольниками большой участок плоскости. Муравьи в нем бегают на ощупь по сторонам треугольников, при этом на каждом «перекрестке» (на котором сходятся 6 треугольников) муравей может либо побежать в крайний левый поворот, либо побежать в крайний правый поворот, либо пробежать прямо. Два муравейчика, Вася и Петя, одновременно стартуют с равной скоростью по одной из дорожек (по первой дорожке бегут вместе). Может ли так случиться, что они встретятся, двигаясь в противоположных направлениях по одной и той же дорожке?","faq":null,"likes":36,"dislikes":7,"solve_percent":1,"solve_total":7780,"date":"08.12.2020","comments":23},{"id":172,"title":"Кто выше?","category":"Логика","text":"80 мегамозгов встали в виде прямоугольника 10×8. В каждом продольном ряду нашли самого высокого, среди них самым низким оказался мегамозг с собакой. Затем нашли в каждом поперечном ряду самого низкого, среди них самым высоким оказался мегамозг в шляпе. Спрашивается, кто выше: мегамозг с собакой или в шляпе?","faq":"Среди мегамозгов могут быть люди одинакового роста. \"Самый высокий из группы\" - это тот, выше которого в группе нет. Если их несколько, то любой из них.","likes":152,"dislikes":33,"solve_percent":1,"solve_total":72760,"date":"15.03.2007","comments":34},{"id":483,"title":"Коэффициент невыговариваемости","category":"Логика","text":"Коэффициент невыговариваемости (КН) натурального числа - это отношение числа букв в записи числительного на русском языке к числу его цифр. Например КН(1234) = Число букв (одна тысяча двести тридцать четыре)/Число цифр (1234) = 30/4 = 7,5. Каков наибольший КН для чисел меньших миллиарда, и на каком наименьшем числе он достигается? Обоснование оптимальности не требуется.","faq":null,"likes":173,"dislikes":41,"solve_percent":1,"solve_total":52279,"date":"21.05.2011","comments":19},{"id":326,"title":"Инаугурация","category":"Логика","text":"После победы на выборах (см. задачу Мегамозг и выборы) Мегамозг устроил инаугурацию. Для этого он устроил званый пир, на который было приглашено ровно 2004 его сторонника, большинство из которых были мужчины. Гостей рассадили за круглый стол. Назовем двоих, сидящих по обе стороны от каждого гостя, его «соседями», двоих, сидящих от него через одного, — «соседями второй очереди» и т.д. Мегамозг заметил, что для каждого из мужчин ровно один из его «соседей второй очереди» — мужчина и ровно один из двух «соседей четвертой очереди» — мужчина. Сколько мужчин было на инаугурации у Мегамозга?","faq":null,"likes":131,"dislikes":32,"solve_percent":1,"solve_total":66878,"date":"22.05.2008","comments":19},{"id":688,"title":"Волейбольная сетка","category":"Логика","text":"На полу спортзала школы мегамозгов лежит волейбольная сетка 10х100 клеток. Точнее то, что от нее осталось, ведь проникший в зал оккупант так искромсал ее ножницами, что при добавлении любого разреза сетка распадется на куски. Сколько веревочек перерезал оккупант?","faq":"1. После действий оккупанта сетка по-прежнему представляет собой одно целое и содержит все узлы исходной сетки.2. В решении задачи требуется найти все возможные количества перерезанных веревочек, при которых может соблюдаться условие «при добавлении любого разреза сетка распадется на куски».3. Сетка 2х2 состоит из 12 верёвочек и 9 узлов. То есть, сетка содержит свои \"границы\".","likes":70,"dislikes":18,"solve_percent":1,"solve_total":16926,"date":"16.04.2017","comments":23},{"id":686,"title":"Мегамозг и шпионы","category":"Логика","text":"Разведывательный отряд в составе Мегамозга и 8 минимозгов, пробираясь в тыл оккупантов, дошел до развилки четырех дорог, одна из которых ведет к главному штабу. Мегамозгу нужно ее определить. Времени мало, и всё, что может сделать разведчик, — это исследовать одну дорогу, после чего вернуться к развилке и сообщить остальным, есть ли там штаб. Как стало известно Мегамозгу, двоих минимозгов оккупанты сумели перевербовать. Шпионы никак себя не проявляют, за исключением того, что иногда передают ложную информацию. Существует ли способ гарантированно найти путь к главному штабу?","faq":"Шпионы «иногда передают ложную информацию» — т.е. они хитрецы, а не лжецы в терминах других задач?Да, каждый из шпионов может врать или говорить правду на своё усмотрение.На сколько вылазок хватает времени?Времени разведчикам хватает только на одну вылазку. Однако разведчики могут разделиться и исследовать больше дорог.Развилка четырех дорог — это что такое? Одна дорога разветвляется на три или на четыре дороги?Одна дорога разветвляется на четыре дороги.Какие вопросы ММ может задавать разведчикам?Никаких. Разведчики просто сообщают, есть ли штаб на дороге, которую они исследовали.","likes":101,"dislikes":28,"solve_percent":2,"solve_total":16364,"date":"09.07.2017","comments":46},{"id":373,"title":"Математический факультет","category":"Логика","text":"При проверке математического факультета комиссией Министерства высшего образования выяснилось, что все математики этого факультета либо делают то, что нравится им, но не нравится декану, либо делают то, что нравится декану, но не нравится им. Комиссия пришла к неизбежному логическому выводу, следствием которого явилось снятие декана математического факультета с должности. С какой формулировкой?","faq":null,"likes":180,"dislikes":83,"solve_percent":2,"solve_total":63591,"date":"17.02.2009","comments":39},{"id":746,"title":"Жуки на доске — 2","category":"Логика","text":"На доску 7х7 посадили жуков двух видов, по одному в каждую клетку. Любого жука можно подружить не более чем с одним соседом того же вида по горизонтали, вертикали, диагонали. Какое максимальное количество пар друзей можно гарантированно создать при любой расстановке жуков?","faq":null,"likes":38,"dislikes":0,"solve_percent":null,"solve_total":null,"date":"15.07.2020","comments":19},{"id":468,"title":"Повесить картину","category":"Логика","text":"К картине обоими концами прикреплена длинная веревка. Необходимо повесить картину на стену с помощью N гвоздей так, чтобы при вытаскивании любого гвоздя картина и веревка падали. Как это сделать?","faq":"Уважаемые игроки! Задача чисто математическая - на топологию. Не надо искать в ней подвох. Трением, весом, растяжением и прочими физическими свойствами веревки пренебрегаем.Если перевести задачу на математический язык, то нужно на плоскости расположить веревочное кольцо и N точек так, чтобы выполнялись условия:1. Невозможно снять веревку, не пересекая при этом ни одной точки.2. После удаления любой точки веревку можно снять, не пересекая остальные точки.3. Саму себя верёвка пересекать при этом может (так как она все же трехмерная).А каким образом нужно ответить на задачу? Словами описать весь процесс или можно рисунком?Вы должны для каждого натурального N:1) либо указать алгоритм, по которому вы повесите картину, и обосновать его работоспособность.2) либо доказать отсутствие такого алгоритма.","likes":75,"dislikes":2,"solve_percent":null,"solve_total":null,"date":"10.12.2010","comments":109},{"id":642,"title":"Треугольники ABC","category":"Логика","text":"Треугольник АВС разрезан на некоторое количество меньших треугольников так, что ни одна вершина одного не лежит на стороне другого. Каждая из вершин, попавшая на сторону AB, может быть произвольно обозначена как А или В, на сторону ВС — как В или С, а на сторону АС — как А или С. Все внутренние вершины произвольно обозначены как А, В, или С. Докажите, что меньших треугольников АВС нечетное количество.","faq":"1. Треугольники не обязательно правильные.2. Два треугольника могут иметь либо общее ребро, либо общую вершину, но не часть ребра.3. Внутри большого треугольника (не на его сторонах) любая вершина может быть поименована любой буквой.4. Меньших треугольников ненулевое конечное количество","likes":38,"dislikes":1,"solve_percent":null,"solve_total":null,"date":"21.11.2015","comments":26},{"id":249,"title":"Испорченная шахматная доска","category":"Логика","text":"Из шахматной доски вырезали одну угловую клетку. Можно ли покрыть оставшуюся часть доски (63 клетки) с помощью 21 прямоугольного куска картона размером 1x3 клетки?","faq":null,"likes":133,"dislikes":7,"solve_percent":null,"solve_total":null,"date":"02.10.2007","comments":21},{"id":293,"title":"Клетчатая эпидемия","category":"Логика","text":"Некоторые клетки шахматной доски (8×8) заражены вирусом. Если у клетки имеются два или больше зараженных соседа (по стороне), то она становится зараженной. Например, если вначале заражена вся главная диагональ, то на первом шаге заражаются 14 соседних с ней клеток, на втором — еще 12 и т.д., пока вся доска не окажется зараженной. Докажите, что если вначале на доске менее 8 зараженных клеток, то на доске всегда останутся незараженные клетки.","faq":null,"likes":77,"dislikes":4,"solve_percent":null,"solve_total":null,"date":"04.03.2008","comments":23},{"id":322,"title":"Автомобиль — 2","category":"Логика","text":"На кольцевой дороге длиной 100 км произвольным образом размещают конечное число бочек с горючим. Суммарное количество горючего — 100 л, но его распределение по бочкам тоже произвольно. Есть автомобиль с расходом топлива 1 л/км и пустым баком вместимостью 100 л. Всегда ли получится объехать дорогу в каком-либо направлении? Начинать маршрут можно в любом месте дороги.","faq":null,"likes":119,"dislikes":8,"solve_percent":null,"solve_total":null,"date":"08.05.2008","comments":31},{"id":382,"title":"В ресторане, к 8 Марта","category":"Логика","text":"Пришла компания из N парней и N девчат отметить 8 Марта в ресторан. Посадили их неким случайным образом за большой вращающийся круглый стол. Официанту они заказали напитки, причем все парни заказали по кружке пива, а все девчата — по бокалу вина. Принеся заказ, официант все перепутал и расставил напитки случайным образом так, что большинство получило не свой напиток. Возмущению компании не было предела. «Не проблема, — сказал официант, — я смогу развернуть стол, не передвигая при этом напитки, таким образом, чтобы большинство из вас получили свой заказ». Всегда ли официант окажется прав?","faq":null,"likes":85,"dislikes":5,"solve_percent":null,"solve_total":null,"date":"06.03.2009","comments":34},{"id":527,"title":"Совет директоров — 2","category":"Логика","text":"Десять мегамозгов входят в совет директоров компании, которая получила прибыль в виде одной акции. Среди них есть линейная иерархия: от самого главного до самого «младшего». Прибыль делится следующим образом: главный предлагает, кому дать акцию, потом каждый, включая главного, голосует «за» или «против». Если по меньшей мере половина Мегамозгов проголосует «за», решение главного будет принято, если же нет — главный Мегамозг исключается из совета директоров, главным становится следующий по иерархии, и дележка начинается с начала по тому же принципу. Все мегамозги хотят остаться в совете директоров, а также очень хотят получить акцию. При прочих равных условиях директор будет голосовать за вариант, при котором в совете остается меньшее число коллег. Сколько директоров останется в совете после раздела прибыли?","faq":"Приоритеты мегамозгов:остаться в советеполучить акциюисключить из совета как можно больше коллегМегамозги не могут договариваться.","likes":148,"dislikes":9,"solve_percent":null,"solve_total":null,"date":"09.01.2013","comments":44},{"id":548,"title":"Тараканьи бега","category":"Логика","text":"Таракан бежит по беговой дорожке с непостоянной скоростью. В любой момент забега за ним наблюдает как минимум один человек. Каждый зритель следит за тараканом непрерывно в течение 10 секунд и замечает, что за это время тот пробежал 25 см. Забег длился 1 минуту. Какой максимальный и какой минимальный путь мог проделать таракан за это время, если до и после забега ни один человек за ним не наблюдал?","faq":"1. Скорость таракана конечна.2. 25 см - это путь (не перемещение)3. Число наблюдателей конечно.","likes":54,"dislikes":5,"solve_percent":null,"solve_total":null,"date":"16.03.2013","comments":51},{"id":571,"title":"Магический подсвечник","category":"Логика","text":"В магическом подсвечнике 13 свечей, расположенных по кругу. Некоторые из них горят. Магия в том, что если зажечь или потушить какую-то свечу, две соседние тоже поменяют свое состояние: незажженные загорятся, а горящие потухнут. Всегда ли можно добиться того, чтобы все свечи горели одновременно?","faq":null,"likes":113,"dislikes":12,"solve_percent":null,"solve_total":null,"date":"19.08.2013","comments":18},{"id":616,"title":"Испорченная шахматная доска — 2","category":"Логика","text":"Из шахматной доски вырезали две клетки разных цветов. Всегда ли полученную доску можно покрыть костяшками домино?","faq":"1. Речь о костяшках домино размером ровно 1 клетка на 2 клетки.2. Правила домино не обязаны соблюдаться.3. Костяшки не должны накладываться друг на друга.","likes":87,"dislikes":10,"solve_percent":null,"solve_total":null,"date":"05.10.2014","comments":13},{"id":301,"title":"Мегамозг и выборы","category":"Логика","text":"В одной латиноамериканской стране, где правит Мегамозг, пришло время новых выборов руководителя страны. В стране ровно 100 000 000 человек, обладающих правом голоса. Из них только 1% поддерживает Мегамозга. Но Мегамозг, чтобы казаться «демократичным» в глазах мировой общественности, хочет быть «честно избран». Процедура голосования в этой стране следующая: Мегамозг разделяет всех избирателей на некоторое количество равных групп, затем эти группы — еще на несколько равных групп и т.д. В полученных самых маленьких группах — люди избирают делегата, затем выбранные выборщики выбирают в большей группе следующего делегата и так далее. В конце представители самых больших групп избирателей выбирают руководителя страны.Мегамозг сам разделяет население на группы. Может ли он провести выборы так, чтобы его «демократично» избрали? (При равенстве голосов побеждает оппозиционный кандидат от Оккупантов).","faq":null,"likes":136,"dislikes":16,"solve_percent":null,"solve_total":null,"date":"10.04.2008","comments":51},{"id":364,"title":"Чебурашки","category":"Логика","text":"В лесу мегамозгов живут крикливые и пушистые зверюшки, в том числе чебурашки. Среди зверюшек одинаковой крикливости чебурашки наиболее пушистые. Для любой зверюшки существует чебурашка той же крикливости и чебурашка той же пушистости (возможно, это один и тот же чебурашка). А недавно мегамозги установили, что чем чебурашка крикливее, тем он пушистее. Правда ли, что из всех зверюшек одинаковой пушистости чебурашки наименее крикливые?","faq":null,"likes":138,"dislikes":18,"solve_percent":null,"solve_total":null,"date":"21.01.2009","comments":43},{"id":481,"title":"Пожмем друг другу руки!","category":"Логика","text":"Мегамозг заметил, что все его 17 коллег здороваются за руку с разным числом товарищей по работе. Скольким коллегам пожимает руку сам Мегамозг?","faq":"1. Условие самодостаточно и не содержит никаких подвохов.2. У Мегамозга 17 коллег, а значит всего в коллективе 18 человек.3. Все коллеги Мегамозга здороваются за руку с разным числом товарищей по работе, Мегамозг же может здороваться с любым количеством коллег. С каким именно - вам требуется найти (найти все решения и доказать, что других нет).4. Ни с кем не здороваться (то есть поздороваться ноль раз) - это разрешённое действие.5. Если человек А поздоровался с человеком Б, то и Б поздоровался А. То есть после акта рукопожатия у каждого из них добавилось по рукопожатию.6. \"Он здоровался со всеми, потому что был культурным\" не является верным решением!","likes":144,"dislikes":20,"solve_percent":null,"solve_total":null,"date":"27.04.2011","comments":35},{"id":49,"title":"gridgame","category":"Логика","text":"Может ли цепная реакция в gridgame продолжаться бесконечно?","faq":null,"likes":126,"dislikes":20,"solve_percent":null,"solve_total":null,"date":"20.10.2006","comments":73},{"id":372,"title":"Узники в коридоре","category":"Логика","text":"Мегамозг решил запереть трех узников в прямом коридоре, разделенном пятью проходами на шесть комнат, причем в каждом проходе, облокотившись на одну из стен, стоит толстый усатый стражник. Каждый раз, когда узник переходит из одной комнаты в другую, стражник, стоящий в этом проходе, переходит к противоположной стене и облокачивается на нее (если одновременно идут несколько узников, стражник переходит соответствующее число раз). Если все стражники облокотятся на одну стену, она не выдержит и рухнет, а узники выйдут на свободу. Может ли Мегамозг изначально так прислонить стражников и разместить узников, чтобы они никогда не смогли выбраться?","faq":null,"likes":92,"dislikes":18,"solve_percent":3,"solve_total":71249,"date":"15.02.2009","comments":41},{"id":495,"title":"Карта рельефа","category":"Логика","text":"На карте рельефа Мозголяндии граница страны имеет форму окружности, а средняя высота любых четырех точек, лежащих в вершинах одного квадрата, равна нулю. Верно ли, что Мозголяндия идеально плоская?","faq":"Квадрат, о котором говорится в задаче, это квадрат на карте, а не на местности. На местности из-за разницы в высотах точки могут находиться не на квадрате.\"Земля\" в Мозголяндии плоская, т.е. высота отсчитывается от плоскости.","likes":92,"dislikes":19,"solve_percent":null,"solve_total":null,"date":"27.11.2011","comments":42},{"id":492,"title":"Иголки и многоугольники","category":"Логика","text":"На листе бумаги площадью 100 нарисовано 100 непересекающихся многоугольников площадью 1, а на его обратной стороне нарисовано еще 100 непересекающихся многоугольников площадью 1. Всегда ли можно воткнуть в лист 100 иголок так, чтобы в любой многоугольник втыкалась только одна?","faq":"1. Как обычно, если ответ «всегда», нужно это доказать; если ответ «не всегда», доказать существование контрпримера.2. Втыкать иголки в границу нельзя.3. Многоугольники на одной стороне листа могут пересекаться только по границе.","likes":37,"dislikes":10,"solve_percent":null,"solve_total":null,"date":"12.11.2011","comments":43},{"id":319,"title":"Книга множеств","category":"Логика","text":"У одного Мегамозга хранится «Книга множеств». На каждой ее странице дается описание какого-нибудь множества чисел (под множеством чисел мы понимаем подмножество множества натуральных чисел 1, 2, 3, ..., n, ...).  Страницы книги пронумерованы по порядку натуральными числами.  Мегамозг подозревает, что в книге бесконечное количество страниц, так как, сколько он ни пытался, он не мог долистать до последней. Есть ли множество, описания которого нет ни на одной странице «Книги множеств», даже если в ней действительно бесконечно много страниц? Если да — приведите пример, если нет — обоснуйте.","faq":null,"likes":102,"dislikes":40,"solve_percent":null,"solve_total":null,"date":"29.04.2008","comments":73},{"id":494,"title":"Наименьшее число","category":"Логика","text":"Найдите наименьшее число из множества всех тех натуральных чисел, которые нельзя определить менее чем шестнадцатью словами.","faq":"Пример определений числа 127:\"сто двадцать семь\"\"два в степени семь минус один\"\"тридцать первое простое число\"","likes":118,"dislikes":57,"solve_percent":null,"solve_total":null,"date":"23.11.2011","comments":72},{"id":457,"title":"Таймер","category":"Логика","text":"Однажды планете минимозгов грозила серьезная опасность — прямо на нее летел огромный астероид. Правительство приняло решение взорвать его с помощью бомбы. И вот решающий момент. Все население планеты наблюдает за этим событием по телевидению. На экране появляется таймер бомбы, установленный на 25 минут. Но после активации происходит странная вещь: показания таймера сразу изменяются на 15:00, а еще через секунду — на 05:00. Как такое могло произойти, если таймер был обыкновенный и полностью исправен? Сколько времени прошло с момента активации до взрыва?","faq":null,"likes":140,"dislikes":31,"solve_percent":1,"solve_total":57045,"date":"18.08.2010","comments":37},{"id":424,"title":"Самый длинный месяц","category":"Логика","text":"Мегамозг родился в Москве, в первый день самого длинного месяца 2000 года. Назовите дату его рождения.","faq":null,"likes":212,"dislikes":67,"solve_percent":2,"solve_total":59709,"date":"26.11.2009","comments":36},{"id":443,"title":"Три мага","category":"Логика","text":"Давным-давно страной мегамозгов управляли три могущественных мага. Их имена нельзя произносить простым смертным, поэтому будем называть их А, B и С. Так случилось, что В и С были братьями А, и других братьев у А не было. Каждый из магов жил в своем величественном замке и обучал там множество подмастерьев. У мага А их было 100, а в замке была 101 комната. Однажды шпион доложил магу А важную информацию: комнат в замке мага В столько же, сколько подмастерьев у С, а комнат в замке мага С столько же, сколько подмастерьев у В. Магу А было известно, что у всех братьев в сумме подмастерьев столько же, сколько и комнат в замках. Немного подумав, великий маг все понял и приказал готовиться к войне. Мы не спрашиваем, чем закончилась та война. Ответьте только, жила ли жена А вместе с ним в замке?","faq":null,"likes":87,"dislikes":33,"solve_percent":2,"solve_total":58091,"date":"15.03.2010","comments":58}],"weighing":[{"id":318,"title":"Дефектные шарики","category":"Взвешивания","text":"Мегамозг для собственных опытов заказал на фабрике 10 одинаковых по весу разноцветных шариков: 2 красных, 2 оранжевых, 2 желтых, 2 зеленых и 2 голубых. Однако на фабрике, к сожалению, ошиблись и сделали 2 шарика одного из цветов легче других на 1 грамм. У него есть точные мегаэлектронные весы с двумя чашами, которые показывают, на сколько граммов различается масса содержимого чаш (и какая из них тяжелее). Как Мегамозгу за одно взвешивание определить, какого цвета дефектные шарики?","faq":null,"likes":969,"dislikes":62,"solve_percent":11,"solve_total":67046,"date":"29.04.2008","comments":66},{"id":13,"title":"Фальшивомонетчик","category":"Взвешивания","text":"Мегамозг содержит монетный двор, на котором работают 100 рабочих. Ежедневно он выдает каждому рабочему по 1 кг золота, из которого тот должен изготовить 100 монет по 10 г. Мегамозгу стало известно, что один из его рабочих делает фальшивые монеты — на 1 г легче. Как Мегамозгу при помощи одного взвешивания на стрелочных весах гарантированно определить прощелыгу?","faq":null,"likes":1013,"dislikes":75,"solve_percent":13,"solve_total":75611,"date":"22.09.2006","comments":173},{"id":22,"title":"8 монет","category":"Взвешивания","text":"У вас есть 8 с виду одинаковых монет, одна из которых, тем не менее, фальшивая. Фальшивая монета чуть тяжелее, но во всем остальном идентична настоящим. Также, в лучших традициях жанра, у вас есть чашечные весы, как у богини правосудия. За какое минимальное число взвешиваний можно гарантированно определить фальшивку?","faq":null,"likes":984,"dislikes":108,"solve_percent":15,"solve_total":75611,"date":"22.09.2006","comments":54},{"id":157,"title":"Стирка","category":"Взвешивания","text":"Мегамозг затеял стирку. По инструкции к стиральной машине на имеющееся количество белья ему необходимо засыпать в машину 220 г стирального порошка. Если засыпать меньше, белье плохо простирается, а если больше — плохо прополоскается. У Мегамозга есть килограммовая нераспечатанная упаковка стирального порошка, чашечные весы (чашки весов таковы, что могут вместить несколько килограммов порошка) и гирьки: две - по 10 г и две - по 5 г. Как максимум за три взвешивания получить на весах 220 г порошка?","faq":"А есть ли у ММ какая-нибудь сторонняя емкость, где он может хранить результаты измерений, не ссыпая все обратно в упаковку?Нет, в качестве емкостей Мегамозг может использовать только пачку и весы.","likes":451,"dislikes":149,"solve_percent":9,"solve_total":73582,"date":"24.01.2007","comments":65},{"id":754,"title":"Спасти Новый год","category":"Взвешивания","text":"Дед Мороз увидел, как со склада, где хранилась партия из 1000 одинаковых подарков с конфетами, выбежали воришки с четырьмя «Шоколадными мыслителями», и понял, что воришки вскрыли 4 подарка, стащив из каждого самую вкусную конфету. Помогите ему за 2 взвешивания на чашечных весах без гирек отобрать 120 целых подарков, чтобы разложить их под мегаёлкой.","faq":"1. Все подарки выглядят одинаково.2. Все целые подарки весят одинаково, испорченные тоже весят одинаково, но они чуть легче целых.3. Заглядывать в подарки некогда.","likes":45,"dislikes":0,"solve_percent":2,"solve_total":4479,"date":"30.12.2021","comments":35},{"id":721,"title":"Кошелек, кошелек... какой кошелек?","category":"Взвешивания","text":"В 64 пронумерованных кошельках лежали копеечные монетки. Кошелек №1 был пуст, а в каждом следующем по номеру кошельке было на одну копейку больше, чем в предыдущем. Затем один из кошельков опустошили, а все монетки из него разложили по одной в кошельки с меньшими номерами. В вашем распоряжении есть весы со стрелкой, которые позволяют за одно взвешивание узнать суммарный вес любых выбранных кошельков вместе с их содержимым. При этом известно, что копеечная монетка весит 1 г, а пустой кошелек — 100 г.  За какое наименьшее число взвешиваний можно гарантированно узнать номер опустевшего кошелька?","faq":null,"likes":92,"dislikes":2,"solve_percent":3,"solve_total":6658,"date":"14.03.2021","comments":16},{"id":109,"title":"Гирьки","category":"Взвешивания","text":"Какое минимальное количество гирек необходимо, чтобы можно было взвесить все целые веса от 1 до 40 на чашечных весах?","faq":null,"likes":343,"dislikes":14,"solve_percent":3,"solve_total":74223,"date":"07.12.2006","comments":89},{"id":117,"title":"12 монет","category":"Взвешивания","text":"У Мегамозга 12 монет, одна из них фальшивая, отличающаяся по весу от остальных, но не известно, в какую сторону. В распоряжении есть чашечные весы. Гирь нет. За какое минимальное число взвешиваний можно определить фальшивку и выяснить, тяжелее она или легче? Как это сделать?","faq":null,"likes":299,"dislikes":17,"solve_percent":2,"solve_total":74147,"date":"12.12.2006","comments":87},{"id":399,"title":"101 монета","category":"Взвешивания","text":"Среди 101 монеты ровно 50 фальшивых. Веса всех настоящих монет одинаковы, вес каждой фальшивой монеты отличается от веса настоящей на 1 грамм в большую или меньшую сторону (фальшивые монеты могут иметь разный вес). Как за одно взвешивание на двухчашечных весах со стрелкой и шкалой (без гирь) определить, является ли данная монета фальшивой?","faq":null,"likes":337,"dislikes":16,"solve_percent":2,"solve_total":62738,"date":"20.04.2009","comments":60},{"id":371,"title":"Шесть шариков","category":"Взвешивания","text":"Есть 2 синих, 2 красных и 2 зеленых шарика. В каждом цвете один из шариков тяжелее другого. Все легкие шарики имеют одинаковый вес, все тяжелые — тоже. Есть также весы с двумя чашками без гирь. Сколько взвешиваний минимально необходимо для гарантированного определения тяжелых шариков?","faq":null,"likes":273,"dislikes":4,"solve_percent":1,"solve_total":63611,"date":"15.02.2009","comments":45},{"id":561,"title":"2000 шариков","category":"Взвешивания","text":"Есть 2000 одинаковых с виду шариков, половина из которых алюминиевые, половина дюралевые. Шарики из одного материала весят одинаково, из разных — по-разному. Какое минимальное число взвешиваний на чашечных весах понадобится, чтобы гарантированно сформировать две группы разного веса из одинакового числа шариков?","faq":null,"likes":130,"dislikes":2,"solve_percent":null,"solve_total":null,"date":"26.04.2013","comments":35},{"id":707,"title":"Монета-хитрец","category":"Взвешивания","text":"Есть 11 одинаковых с виду монет. Среди них монета-хитрец. После каждого взвешивания с участием этой монеты её вес меняется: то он такой же, как и у остальных, то меньше. За какое минимальное число взвешиваний её можно гарантированно найти с помощью чашечных весов? Состояние монеты при первом взвешивании неизвестно.","faq":null,"likes":49,"dislikes":1,"solve_percent":null,"solve_total":null,"date":"21.04.2018","comments":19},{"id":379,"title":"Правдивые этикетки","category":"Взвешивания","text":"Имеется 6 гирек весом 1, 2, 3, 4, 5, 6 граммов. На них наклеены этикетки 1, 2, 3, 4, 5, 6. За какое наименьшее количество взвешиваний на чашечных весах без стрелки можно выяснить, правильно ли наклеены этикетки?","faq":null,"likes":187,"dislikes":6,"solve_percent":null,"solve_total":null,"date":"23.02.2009","comments":31},{"id":705,"title":"Морской бой","category":"Взвешивания","text":"На полке выставлены в ряд 128 одинаковых с виду гирек. Каждая весит по 100 г, кроме четырёх бракованных, которые легче остальных на 1 грамм, причём известно, что они стоят рядом. За какое минимальное количество взвешиваний на электронных весах можно гарантированно найти все бракованные гирьки?","faq":"1. Гири пронумерованы числами от 1 до 128.2. Электронные весы позволяют за одно взвешивание узнать суммарный вес любого количества гирь","likes":69,"dislikes":2,"solve_percent":null,"solve_total":null,"date":"24.06.2018","comments":34},{"id":384,"title":"Мегамозг и Оккупант-дальтоник","category":"Взвешивания","text":"Мегамозг работал окулистом у Оккупанта-дальтоника. Оккупанту приснилось, что для того чтобы вернуть ему цвета жизни, Мегамозг должен изготовить 9 красных и 9 синих хрусталиков, на вид ничем не отличающихся друг от друга, кроме цвета. Хрусталики одного цвета весят одинаково, но красные легче синих.  Мегамозг выполнил свою задачу и принес Оккупанту две кучки по 9 хрусталиков: в одной — все красные, в другой — все синие. Но Оккупант не доверяет Мегамозгу, а доверяет только показаниям чашечных весов без стрелки и гирь. Каким образом Мегамозг за три взвешивания может убедить Оккупанта, что в первой кучке все хрусталики красные, а во второй — все синие?","faq":"Изначально всем известно (оккупант не нуждается в доказательстве этого), что:1. Хрусталики одного цвета весят одинаково.2. Красные легче синих.3. Среди принесенных 18 хрусталиков есть только красные и синие. Причем хрусталиков каждого цвета может быть от 0 до 18 включительно.Нужно показать (умный оккупант нуждается в доказательстве этого), что:1.\tВ первой (конкретной) кучке все 9 хрусталиков синие.2.\tВо второй кучке все 9 хрусталиков красные.Дополнительно:- Красные хрусталики от синих можно отличить только по цвету или весу.- Для оккупанта доступно отличие только по весу.","likes":60,"dislikes":7,"solve_percent":null,"solve_total":null,"date":"16.03.2009","comments":89},{"id":654,"title":"Весы с подвохом","category":"Взвешивания","text":"У Мегамозга есть чашечные весы, которые правильно определяют более тяжелый груз, но могут показать любой результат в случае равенства весов на чашах. Также у него есть четырнадцать монет, из которых ровно одна фальшивая. Все настоящие монеты одинаковые, а фальшивая отличается по весу. За какое минимальное число взвешиваний у Мегамозга гарантированно получится определить фальшивую монету и узнать, тяжелее она или легче настоящих?","faq":null,"likes":79,"dislikes":9,"solve_percent":null,"solve_total":null,"date":"19.07.2015","comments":33},{"id":330,"title":"Пять предметов","category":"Взвешивания","text":"Пять различных по весу предметов требуется расположить в порядке убывания их веса. Пользоваться можно только простейшими весами без гирь, которые позволяют взвесить два предмета и установить, какой из них тяжелее. Как следует действовать, чтобы решить задачу оптимальным образом, то есть так, чтобы число взвешиваний было минимальным? Сколько взвешиваний придется при этом произвести?","faq":null,"likes":84,"dislikes":17,"solve_percent":null,"solve_total":null,"date":"16.06.2008","comments":26},{"id":554,"title":"Средняя монета","category":"Взвешивания","text":"У Мегамозга есть 7 монет разного веса и мегавесы, которые принимают по 5 монет и показывают, какая из них является средней по весу. За какое минимальное число взвешиваний Мегамозг сможет гарантированно определить среднюю из своих монет? Доказательство минимальности не требуется.","faq":"монетки можно помечать? Или как только взвесили, нужно откладывать, а то перемешаются в приборе.Можно помечать.","likes":36,"dislikes":8,"solve_percent":null,"solve_total":null,"date":"31.05.2013","comments":44},{"id":612,"title":"Коллекция монет","category":"Взвешивания","text":"В коллекции Мегамозга была 101 золотая монета и 100 серебряных. Все монеты разные по весу, причем вес монет из одного и того же металла пропорционален размеру, который легко различить на глаз. Какое минимальное число взвешиваний на чашечных весах понадобится, чтобы гарантированно определить среднюю по весу монету в коллекции?","faq":"1. Выражение \"средняя по весу\" означает, что если выложить монеты в ряд в порядке возрастания весов, из них берется центральная. Например, среди двух золотых монет 1г, 3г и трех серебряных 2г, 4г, 10г средней по весу будет монета 3г [а вовсе не 4г, вес которой случайно совпадает со средним арифметическим весом монет].2. На глаз можно сравнить только массы двух монет из одного и того же металла. Во всех других случаях без чашечных весов не обойтись.","likes":39,"dislikes":9,"solve_percent":null,"solve_total":null,"date":"17.08.2014","comments":28}],"liars":[{"id":26,"title":"Два кишлака","category":"Лжецы, хитрецы, правдивцы","text":"Мегамозг потерялся на горной тропе между непролазной пропастью и скалами. На одном конце тропы — кишлак, где горцы всегда говорят неправду и едят мегамозгов, на другом — кишлак, где всегда говорят правду и не едят мегамозгов. И вот навстречу нашему путнику идет житель одного из кишлаков. Мегамозг охрип и может произнести лишь несколько слов. Придумайте простой вопрос, который поможет ему попасть к тем, кто его не съест.","faq":null,"likes":715,"dislikes":44,"solve_percent":6,"solve_total":75611,"date":"22.09.2006","comments":146},{"id":194,"title":"Сколько правдивцев?","category":"Лжецы, хитрецы, правдивцы","text":"В комнате 10 мегамозгов, какие-то из них — правдивцы, а какие-то — лжецы. Первый сказал: «Здесь нет ни одного правдивца», второй: «Здесь не более одного правдивца», третий: «Здесь не более двух правдивцев», ..., десятый «Здесь не более 9 правдивцев». Сколько правдивцев в комнате?","faq":null,"likes":464,"dislikes":80,"solve_percent":6,"solve_total":72174,"date":"25.04.2007","comments":54},{"id":312,"title":"Парламент","category":"Лжецы, хитрецы, правдивцы","text":"В парламент одной страны избраны две партии: «Партия лжецов» и «Партия правдивцев». Всего — 101 депутат. В целях сокращения бюджета на парламент руководство страны решило уменьшить состав парламента на одного человека. Но каждый из депутатов высказался, что если его исключат из парламента, то среди оставшихся депутатов большинство будут лжецами. Сколько лжецов и правдивцев было изначально в парламенте?","faq":null,"likes":470,"dislikes":103,"solve_percent":7,"solve_total":67105,"date":"21.04.2008","comments":29},{"id":94,"title":"Как выйти на свободу?","category":"Лжецы, хитрецы, правдивцы","text":"Мегамозг может выйти на свободу, если он справится с заданием: перед ним две двери, одна из них ведет на волю, другая — дорога к смерти. Здесь же сидят два стражника, причем один из них либо лжец, либо правдивец, а второй — хитрец, то есть человек, который говорит правду и ложь строго поочередно (либо на нечетные вопросы отвечает ложью, а на четные — правдой, либо наоборот). Оба стражника знают, какая из дорог ведет на волю, но Мегамозгу неизвестно, кто из стражников хитрец. Мегамозг имеет право задать два вопроса одному из стражников (вопросы должны быть простыми). Как ему определить дорогу, ведущую на свободу?","faq":null,"likes":613,"dislikes":15,"solve_percent":4,"solve_total":74293,"date":"30.11.2006","comments":169},{"id":441,"title":"Социологический опрос","category":"Лжецы, хитрецы, правдивцы","text":"На острове живут правдивцы и лжецы. Первые всегда говорят правду, вторые всегда лгут. Каждый житель острова живет в четырехэтажном доме. В социологическом опросе приняли участие все жители острова. На вопрос «Вы живете на первом этаже?» ответили «да» 40% жителей. На аналогичный вопрос про второй этаж утвердительно ответили 30%, про третий — 50%, а про четвертый — 0%. Какой процент жителей острова действительно живет на первом этаже?","faq":null,"likes":435,"dislikes":33,"solve_percent":3,"solve_total":58434,"date":"16.02.2010","comments":44},{"id":152,"title":"Мегамозг и телевизор","category":"Лжецы, хитрецы, правдивцы","text":"В городе живут лжецы, которые всегда лгут, и правдивцы, которые всегда говорят правду. Как Мегамозгу, задав один вопрос жителю города, узнать, есть ли у него цветной телевизор?","faq":null,"likes":244,"dislikes":51,"solve_percent":2,"solve_total":73697,"date":"19.01.2007","comments":125},{"id":317,"title":"Тысяча туземцев","category":"Лжецы, хитрецы, правдивцы","text":"Мегамозг попал в плен на острове, где живут туземцы (правдивцы и лжецы), всего 1000 аборигенов, причем среди них есть как минимум один правдивец. Ему пообещали жизнь, если он точно укажет, кто из туземцев является лжецом, а кто правдивцем. Раз в час Мегамозг может позвать к себе любое количество туземцев и задать каждому из них вопрос: «Сколько среди присутствующих туземцев правдивцев?», либо «Сколько среди присутствующих лжецов?». За какое минимальное количество часов Мегамозг справится с этой задачей и даст туземцам ответ? Обоснование минимальности не требуется.","faq":null,"likes":331,"dislikes":3,"solve_percent":1,"solve_total":67048,"date":"28.04.20
